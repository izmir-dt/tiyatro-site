          <div style="min-width:0"><div class="nm">${esc(play)}</div>
            <div class="mt">${esc(rs.map(r => r.gorev || r.kategori).filter(Boolean).join(" · "))}</div></div>
          <div class="tag-row">${[...new Set(rs.map(r => r.kategori).filter(Boolean))].map(c => `<span class="chip ${isFig(c) ? "crim" : ""}">${esc(c)}</span>`).join("")}</div>
        </div>`).join("")}</div></div>
    <div class="card"><div class="card-h"><h3 style="font-size:12.5px;letter-spacing:.08em;text-transform:uppercase">Arşiv oyunlar</h3>
      <span class="chip">Repertuvardan kaldırılanlar</span></div><div class="card-b" style="padding:12px 14px" id="pd-arsiv"></div></div>`;
  };

  /* ---------- Arşiv sayfası: oyun başına künye ---------- */
  window.renderArsivList = function(){
    const box = document.getElementById("arsiv-list");

        <div class="play-body"><div style="padding:14px">${body}</div></div></div>`;
    }).join("") : `<div class="card"><div class="empty">Eşleşen arşiv oyunu bulunamadı.</div></div>`;
  };
})();

<script>
(function(){
  /* 1) Ekran: önizleme içeriğini kaydırma gerektirmeden pencereye sığdır */
  function fitPrev(prev){
    if(window.innerWidth < 760) { prev.querySelectorAll(".aph-fit-z").forEach(n=>{n.style.zoom="";}); return; }
    const isWeek = !!prev.closest(".hp-ov");
    if(!isWeek){ [...prev.children].forEach(n=>{n.style.zoom="";n.classList.remove("aph-fit-z");}); return; } /* aylık: okunaklı boyut korunur */
    const targets = isWeek ? [...prev.querySelectorAll(":scope > .hp-doc")] : [...prev.children].filter(n=>n.nodeType===1);
    if(!targets.length) return;
    targets.forEach(t=>{t.classList.add("aph-fit-z");t.style.zoom="";});
    const cs = getComputedStyle(prev);
    const avail = prev.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
    let z = 1;
    for(let i=0;i<10;i++){
      const total = prev.scrollHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      if(total <= avail + 1) break;
      const fixedH = isWeek ? [...prev.children].filter(n=>!targets.includes(n)).reduce((a,n)=>a+n.offsetHeight+10,0) : 0;
      const contentH = total - fixedH;
      const room = avail - fixedH;
      if(room <= 0 || contentH <= 0) break;
      z = Math.max(.5, z * (room/contentH) * .99);
      targets.forEach(t=>t.style.zoom = z.toFixed(3));
      if(z <= .5) break;
    }
  }
  function fitAll(){ document.querySelectorAll(".aph-ov .aph-prev").forEach(fitPrev); }
  let raf = 0;
  const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>requestAnimationFrame(fitAll)); };
  new MutationObserver(muts=>{
    if(muts.some(m=>[...m.addedNodes].some(n=>n.nodeType===1 && (n.matches(".aph-ov,.aph-prev,table,.hp-doc") || n.querySelector && n.querySelector(".aph-ov,.aph-prev"))))) schedule();
  }).observe(document.body,{childList:true,subtree:true});
  window.addEventListener("resize", schedule);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);

  /* 2) Yazdırma: haftalık program tek A4 yatay sayfaya sığar */
  const PW = 1047, PH = 712; /* A4 yatay, 10 mm kenar boşluğu (96 dpi) */
  let saved = null;
  window.addEventListener("beforeprint", ()=>{
    const doc = document.querySelector("body > .hp-ov .hp-doc");
    if(!doc) return;
    const note = document.querySelector("body > .hp-ov .hp-note");
    const noteH = note ? note.offsetHeight + 10 : 0;
    saved = {doc, zoom:doc.style.zoom, width:doc.style.width};
    document.documentElement.classList.add("hp-printing");
    let z = 1;
    for(let i=0;i<12;i++){
      doc.style.zoom = z; doc.style.width = (PW/z) + "px";
      const h = doc.offsetHeight * z + noteH;
      if(h <= PH) break;
      z = Math.max(.35, z * (PH - noteH) / (h - noteH) * .985);
    }
  });
  window.addEventListener("afterprint", ()=>{
    document.documentElement.classList.remove("hp-printing");
    if(saved){ saved.doc.style.zoom = saved.zoom; saved.doc.style.width = saved.width; saved = null; }
    schedule();
  });

  /* 3) Aylık önizleme penceresinden yazdırma: yalnızca tablo, tek A4 yatay sayfa */
  let mParent = null, mNext = null, mSaved = null;
  function aphMonthlyBegin(ov){
    if(document.documentElement.classList.contains("aph-printing-monthly")) return;
    mParent = ov.parentNode; mNext = ov.nextSibling;
    document.body.appendChild(ov);
    document.documentElement.classList.add("aph-printing-monthly");
  }
  function aphMonthlyCleanup(){
    if(!document.documentElement.classList.contains("aph-printing-monthly")) return;
    document.documentElement.classList.remove("aph-printing-monthly");
    const ov = document.querySelector("body > .aph-ov[data-preview-index]");
    if(ov && mParent && mParent.isConnected) mParent.insertBefore(ov, mNext);
    mParent = null; mNext = null;
    if(mSaved){
      const t = document.querySelector(".aph-ov[data-preview-index] .aph-prev table");
      if(t){ t.style.zoom = mSaved.zoom; t.style.width = mSaved.width; }
      mSaved = null;
    }
  }
  window.aphPrintPreview = function(){
    const ov = document.querySelector(".aph-ov[data-preview-index]");
    if(!ov){ window.print(); return; }
    aphMonthlyBegin(ov);
    setTimeout(()=>window.print(), 30);
  };
  window.addEventListener("beforeprint", ()=>{
    if(document.querySelector("body > .hp-ov")) return; /* haftalık yazdırma öncelikli */
    const ov = document.querySelector(".aph-ov[data-preview-index]");
    if(!ov) return;
    aphMonthlyBegin(ov);
    const table = document.querySelector("body > .aph-ov[data-preview-index] .aph-prev table");
    if(!table) return;
    const MPW = 1047, MPH = 712; /* A4 yatay, 10 mm kenar boşluğu (96 dpi) */
    mSaved = {zoom:table.style.zoom, width:table.style.width};
    let z = 1;
    for(let i=0;i<12;i++){
      table.style.zoom = z; table.style.width = (MPW/z) + "px";
      const h = table.offsetHeight * z;
      if(h <= MPH) break;
      z = Math.max(.35, z * MPH / h * .985);
    }
  });
  window.addEventListener("afterprint", aphMonthlyCleanup);
})();

/* ---- veri: her birim+hafta için en yeni eksiksiz kayıt ---- */
async function load(){
  let res;
  try { res = await fetch(API,{cache:"no-store"}); }
  catch(e){ await new Promise(r => setTimeout(r,700)); res = await fetch(API.replace("?fresh=1",""),{cache:"no-store"}); }
  if (!res.ok) throw new Error("HTTP " + res.status);
  const rows = (await res.json()).rows || [], groups = new Map();
  rows.forEach(r => { const id = String(r[0]||""); if (!/^hpub_[a-z]+_\d{4}-\d{2}-\d{2}_\d+$/.test(id)) return; (groups.get(id) || groups.set(id,[]).get(id)).push(r); });
  const best = new Map();
  for (const [id, rs] of groups){
    const total = +rs[0][3] || rs.length;
    if (new Set(rs.map(r => +r[2])).size < total) continue;
    const m = id.match(/^hpub_([a-z]+)_(\d{4}-\d{2}-\d{2})_(\d+)$/), k = m[1] + "|" + m[2], ts = +m[3], cur = best.get(k);
    if (cur && cur.ts >= ts) continue;
    try {
      const o = JSON.parse(b64u(rs.slice().sort((a,b) => a[2]-b[2]).map(r => String(r[4]||"")).join("")));
      if (o && o.doc) best.set(k,{ts,key:m[1],week:m[2],label:o.label||m[2],doc:o.doc,note:String(o.note||"").trim()});
    } catch(e){}
  }
  const out = {}; UNITS.forEach(([k]) => out[k] = []);
  for (const v of best.values()) (out[v.key] = out[v.key] || []).push(v);
  Object.values(out).forEach(a => a.sort((x,y) => x.week < y.week ? 1 : -1));
  return out;
}

function docHtml(doc){
  const body = (doc.days||[]).map(d => {
    const n = (d.rows||[]).length;
    return (d.rows||[]).map((row,i) => {
      let h = `<tr class="${i===0?"ds":""}">`;
      if (i === 0) h += `<td class="date${d.weekend?" we":""}" rowspan="${n}">${esc(d.label)}</td>`;
      ["time","place","task","ppl"].forEach(role => {
        const c = (row.cells && row.cells[role]) || {t:""};
        if (c.skip) return;
        h += `<td class="${role}"${c.span>1?` rowspan="${c.span}"`:""}>${esc(c.t)}</td>`;
      });
      return h + "</tr>";
    }).join("");
  }).join("");
  const notes = (doc.notes||[]).length ? `<ul class="notes">${doc.notes.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
  const signs = (doc.signs||[]).map(s => { const l = String(s).split("\n"); return `<div><b>${esc(l.shift())}</b>${esc(l.join(" "))}</div>`; }).join("");
  return `<article class="sheet">
    <div class="sheet-h"><div class="org">İZMİR DEVLET TİYATROSU MÜDÜRLÜĞÜ</div><h2>${esc(doc.title||"Haftalık iş planı çizelgesi")}</h2><span class="wk">${esc(doc.week||"")}</span></div>
    <div class="tw"><table><thead><tr><th>Tarih / gün</th><th>Saat</th><th>Yer</th><th>Yapılacak iş</th><th>Görevliler</th></tr></thead><tbody>${body}</tbody></table></div>
    ${notes}${signs ? `<div class="signs">${signs}</div>` : ""}</article>`;
}

/* ---- Ana panel: oyunlar, afiş ve künye ---- */
const trLower = s => String(s == null ? "" : s).replace(/İ/g,"i").replace(/I/g,"ı").toLowerCase();
const norm = s => trLower(String(s || "").trim());
const unent = s => String(s == null ? "" : s).replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g," ");
const FIGTAG = /\(\s*fig[üu]ran\s*\)/i;
const stripTag = s => s.replace(/\(\s*fig[üu]ran\s*\)/ig,"").replace(/^"+|"+$/g,"").trim();
const names = s => s.split(",").map(x => x.trim()).filter(Boolean);
const isCocuk = n => /\(\s*Ç\s*\.?\s*[O0]\s*\.?\s*\)|Ç\.\s*[O0](?![A-Za-z0-9])|\(\s*Ç\s*\)/.test(String(n));
const isFigCat = c => { const t = norm(c); return t.includes("figüran") || t.includes("figuran"); };
const grpOf = k => { const t = norm(k); return isFigCat(k) ? 2 : (t.includes("oyuncu") || t.includes("kadro") || t.includes("rol")) ? 0 : 1; };
const ini = n => { const w = String(n).trim().split(/\s+/).filter(Boolean); return ((w[0] || "").charAt(0) + (w.length > 1 ? w[w.length - 1].charAt(0) : "")).toLocaleUpperCase("tr-TR"); };
const sortTr = (a,b) => String(a).localeCompare(String(b),"tr");
const figNames = r => {
  const t = names(r.kisi), tg = t.filter(x => FIGTAG.test(x));
  if (tg.length) return new Set(tg.map(stripTag).filter(Boolean));
  return isFigCat(r.kategori) ? new Set(t.map(stripTag).filter(Boolean)) : new Set();
};

let PD = null, PERR = "", PBUSY = false, pq = "", pf = "tumu", openPlay = null;

}

  PBUSY = false; render(); buildNav();
  if (PANELS.includes(cur)) flushPending();

function buildPanel(main, img, sez, pas){
  const H = (main.headers || []).map(h => trLower(h).trim());
  const ix = (k,d) => { const i = H.findIndex(h => h === k || h.startsWith(k)); return i < 0 ? d : i; };
  const C = {o:ix("oyun",0), k:ix("kategori",1), g:ix("görev",2), p:ix("kişi",3)};
  const cell = (r,i) => unent(String(r[i] == null ? "" : r[i]).trim());
  const rows = (main.rows || []).map(r => ({oyun:cell(r,C.o), kategori:cell(r,C.k), gorev:cell(r,C.g), kisi:cell(r,C.p)})).filter(r => r.oyun);

  const pg = new Set(), pp = new Set();
  (pas.rows || []).forEach(r => { const n = norm(unent(r[0])), o = norm(unent(r[1])); if (!n) return; if (o) pp.add(n + "|" + o); else pg.add(n); });
  const pasif = (n, oyun) => pg.has(norm(n)) || pp.has(norm(n) + "|" + norm(oyun));

  const ih = (img.headers || []).map(h => trLower(h)), io = Math.max(0, ih.findIndex(h => h.includes("oyun")));
  const posters = new Map();
  (img.rows || []).forEach(r => {
    const nm = unent(r[io]).trim(), u = (r.filter((_,i) => i !== io).join(" ").match(/https?:\/\/[^\s"'<>\[\]]+/) || [])[0];
    if (nm && u) posters.set(norm(nm), u);
  });

  const sh = (sez.headers || []).map(h => trLower(h).trim()), si = k => sh.findIndex(h => h.includes(k));
  const sO = Math.max(0, si("oyun")), sT = si("prömiyer tarihi"), sS = si("prömiyer sezonu"), sN = si("sezon sayısı") >= 0 ? si("sezon sayısı") : si("temsil");
  const season = new Map(), sv = (r,i) => i >= 0 ? String(r[i] == null ? "" : r[i]).trim() : "";
  (sez.rows || []).forEach(r => { const n = unent(r[sO]).trim(); if (n) season.set(norm(n), {tar:sv(r,sT), sez:sv(r,sS), say:sv(r,sN)}); });

  const map = new Map();
  rows.forEach(r => { if (!map.has(r.oyun)) map.set(r.oyun, []); map.get(r.oyun).push(r); });
  const plays = [...map.entries()].map(([name, rs]) => {
    const all = new Set(), figs = new Set();
    rs.forEach(r => { names(r.kisi).forEach(n => { const c = stripTag(n); if (c) all.add(c); }); figNames(r).forEach(c => figs.add(c)); });
    return {name, rows:rs, kisi:[...all].filter(n => !pasif(n,name)).length, fig:[...figs].filter(n => !pasif(n,name)).length,
      poster:posters.get(norm(name)) || "", season:season.get(norm(name)) || null, cocuk:isCocuk(name)};
  }).sort((a,b) => sortTr(a.name,b.name));

  const ppl = new Set(), fg = new Set();
  rows.forEach(r => { names(r.kisi).forEach(n => { const c = stripTag(n); if (c && !pg.has(norm(c))) ppl.add(c); }); figNames(r).forEach(c => fg.add(c)); });
  /* kişi dizini: her kişinin oynadığı oyunlar ve görevleri */
  const people = new Map();
  plays.forEach(p => p.rows.forEach(r => {
    const fs = figNames(r), g = grpOf(r.kategori);
    names(r.kisi).forEach(t => {
      const n = stripTag(t); if (!n) return;
      const k = norm(n); let o = people.get(k);
      if (!o) { o = {name:n, key:k, plays:new Map(), oy:false, ek:false, fg:false}; people.set(k, o); }
      const f = fs.has(n);
      if (f) o.fg = true; else if (g === 0) o.oy = true; else o.ek = true;
      if (!o.plays.has(p.name)) o.plays.set(p.name, []);
      o.plays.get(p.name).push({kategori:r.kategori, gorev:r.gorev, fig:f});
    });
  }));
  const plist = [...people.values()].sort((a,b) => sortTr(a.name,b.name));
  return {plays, pasif, people, plist, playMap:new Map(plays.map(p => [p.name, p])), nPeople:ppl.size, nFig:fg.size, nPoster:plays.filter(p => p.poster).length};
}

function kunyeHtml(p){
  const cats = new Map();
  p.rows.forEach(r => {
    const k = r.kategori || "Diğer", gk = r.gorev || "—";
    if (!cats.has(k)) cats.set(k, new Map());
    const g = cats.get(k); if (!g.has(gk)) g.set(gk, []);
    names(r.kisi).forEach(t => g.get(gk).push(t));
  });
  const nm = ts => ts.map(t => { const n = stripTag(t);

  const cnt = g => [...g.values()].reduce((s,ts) => s + ts.filter(t => stripTag(t)).length, 0);
  const grp = grpOf;
  const GN = ["Oyuncular","Sanat ve teknik ekip","Figüranlar"];
  const tabs = [0,1,2].map(i => ({i, cs:[...cats].filter(c => grp(c[0]) === i)})).filter(x => x.cs.length);

  return `<div class="ptabs">${tabs.map(x => `<button type="button" data-jump="kg${x.i}"><b>${pc(x.cs)}</b>${GN[x.i]}</button>`).join("")}</div>` +
    tabs.map(x => `<div class="kgroup" id="kg${x.i}"><h2 class="kg-h">${GN[x.i]}<span>${pc(x.cs)} kişi</span></h2>${x.cs.map(([k,g]) => {
    const fig = isFigCat(k);
    return `<section class="kcard${fig ? " fig" : ""}"><h3>${esc(k)}${fig ? `<i class="tag">${cnt(g)} kişi</i>` : ""}</h3>${[...g].map(([gr, ts]) => {
      const n = ts.filter(t => stripTag(t)).length;
      return (fig || n > 6)
        ? `<div class="kr bulk">${gr !== "—" ? `<div class="g">${esc(gr)} <i class="tag">${n}</i></div>` : ""}<div class="names">${nm(ts)}</div></div>`
        : `<div class="kr"><div class="g">${esc(gr)}</div><div class="p">${nm(ts)}</div></div>`;
    }).join("")}</section>`;
  }).join("")}</div>`).join("");
}

function route(){
  closeKn();
  const parts = (location.hash || "#programlar").slice(1).split("/"), page = parts[0];
  if (page === "figuranlar") { location.replace("#yonetimpaneli"); return; }
  if (page === "kisiler" && parts[1]) { try { PENDING = decodeURIComponent(parts[1]); } catch(e){} location.replace("#oyuncular"); return; }
  if (page === "programlar") { if (parts[1] && UNITS.some(x => x[0] === parts[1])) unit = parts[1]; week = parts[2] || null; }
  else if (page === "panel") { try { openPlay = parts[1] ? decodeURIComponent(parts[1]) : null; } catch(e){ openPlay = null; } }
  else if (page === "oyuncular" || page === "yonetimpaneli") { openPlay = null; }
  else if (OLDIDS.includes(page)) { cur = page; buildNav(); syncHero(); let who = null; try { who = parts[1] ? decodeURIComponent(parts[1]) : null; } catch(e){} if (page === "kisiler" && who) showPerson(who); else showLegacy(page); window.scrollTo(0,0); return; }
  else { location.hash = "#programlar"; return; }
  hideLegacy(); cur = page; buildNav(); render(); window.scrollTo(0,0);
  if (PANELS.includes(page)) { if (!PD && !PBUSY) loadPanel(); else flushPending(); }
}

  if (t.dataset.kpTab != null) { kpTab(+t.dataset.kpTab); return; }
  if (t.dataset.ym) { ym.tab = t.dataset.ym; ymRender(); return; }
  if (t.dataset.ymm) { ym.mode = t.dataset.ymm; ymRender(); return; }
  if (t.dataset.yx) { ymAct(t.dataset.yx); return; }
  if (t.dataset.ympick != null) { ym.person = decodeURIComponent(t.dataset.ympick); ymRender(); return; }
  if (t.dataset.jump) { document.getElementById(t.dataset.jump)?.scrollIntoView({behavior:"smooth"}); return; }
  if (t.dataset.hsGo != null) { hsGo(+t.dataset.hsGo); return; }
  if (t.dataset.hs) { const a = t.dataset.hs; if (a === "prev") hsGo(HERO.i - 1); else if (a === "next") hsGo(HERO.i + 1); else if (a === "play") { HERO.paused = !HERO.paused; hsTimer(); } else if (a === "fs") hsFull(); return; }
  if (t.dataset.unit) { location.hash = "#programlar/" + t.dataset.unit; }
  else if (t.dataset.week) { location.hash = "#programlar/" + unit + "/" + t.dataset.week; }
  else if (t.dataset.act === "print") window.print();
  else if (t.dataset.act === "theme") { setTheme(THEME === "dark" ? "light" : "dark"); }
  else if (t.dataset.pf) { pf = t.dataset.pf; render(); }
  else if (t.dataset.kf) { kf = t.dataset.kf; render(); }
  else if (t.dataset.ks) { ks = t.dataset.ks; render(); }
  else if (t.dataset.fm) { fm = t.dataset.fm; render(); }
  else if (t.dataset.act === "refresh") { if (PANELS.includes(cur)) loadPanel(true); else refresh(); }
});
document.addEventListener("input", e => {
  const id = e.target.id, g = $("#pgrid"), l = $("#plist");
  if (id === "pq") { pq = e.target.value; if (g) g.innerHTML = gridHtml(); }
  else if (id === "kq") { kq = e.target.value; if (l) l.innerHTML = peopleGrid(); }
  else if (id === "fq") { fq = e.target.value; if (l) l.innerHTML = figGrid(); }
  else if (id === "ymq") { ym.q = e.target.value; const yl = $("#ymList"); if (yl) yl.innerHTML = ymFigList(); }
  else if (id === "ymp") { ym.person = e.target.value; const yl = $("#ymList"); if (yl) { yl.innerHTML = ymKisiBody(); ymAfter(); } }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (HERO.kp) kpClose(); closeKn(); closeMenus(); setOv(false); return; }
  if (!$("#heroBox") || HERO.kp || $("#kn") || document.body.classList.contains("ov-open") || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "")) return;
  if (e.key === "ArrowRight") { hsGo(HERO.i + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { hsGo(HERO.i - 1); e.preventDefault(); }
  else if (e.key === "f" || e.key === "F") hsFull();
  else if (e.key === " " && document.fullscreenElement) { HERO.paused = !HERO.paused; hsTimer(); e.preventDefault(); }
});

document.addEventListener("change", e => {
  const s = e.target.closest && e.target.closest("select[data-sel]"); if (!s) return; const k = s.dataset.sel;
  if (k === "unit") location.hash = "#programlar/" + s.value;
  else if (k === "week") location.hash = "#programlar/" + unit + "/" + s.value;
  else if (k === "ymplay") { ym.play = s.value; const yl = $("#ymList"); if (yl) yl.innerHTML = ymOyunBody(); }
});
/* ---- yazdırma: haftalık program tek A4 (yatay) sayfaya sığar ---- */
let PFIT = null;
window.addEventListener("beforeprint", () => {
  if (cur !== "programlar") return;
  const s = document.querySelector("#main .sheet:not(.sk)"); if (!s) return;
  const PW = 1050, PH = 705; /* A4 yatay, 8 mm kenar boşluğu, 96 dpi (güvenlik payı ile) */
  document.documentElement.classList.add("pfit"); PFIT = s;
  let z = 1, h = 0;
  for (let i = 0; i < 10; i++) {
    s.style.zoom = ""; s.style.width = (PW / z) + "px"; h = s.offsetHeight;
    const nz = Math.min(1, PH / h);
    if (Math.abs(nz - z) < .003) { z = nz; break; }
    z = nz;
  }
  z = Math.max(.3, Math.min(z, PH / h) * .985);
  s.style.width = (PW / z) + "px"; s.style.zoom = z;
});
window.addEventListener("afterprint", () => {
  document.documentElement.classList.remove("pfit");
  if (PFIT) { PFIT.style.zoom = ""; PFIT.style.width = ""; PFIT = null; }
});
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => $(".top").classList.toggle("scrolled", scrollY > 6), {passive:true});
route(); refresh();
