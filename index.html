<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/tiyatro-site/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/tiyatro-site/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
<script>
(function(){
  var inserted = false;
  function addTurneLink(){
    if(inserted) return;
    // ARŞİV OYUNLAR nav linkini bul (data-testid="nav-arsiv-oyunlar")
    var arsivEl = document.querySelector('[data-testid="nav-arsiv-oyunlar"]');
    if(!arsivEl) return;
    // Üst <a> veya wrapper div'i bul
    var arsivParent = arsivEl.closest('a') || arsivEl.parentElement;
    if(!arsivParent || document.getElementById('turne-nav-link')) return;
    
    inserted = true;
    var turneLink = document.createElement('a');
    turneLink.id = 'turne-nav-link';
    turneLink.href = '/tiyatro-site/turne.html';
    turneLink.className = arsivParent.className;
    turneLink.style.cssText = arsivParent.style.cssText;
    
    var innerDiv = arsivEl.cloneNode(true);
    innerDiv.setAttribute('data-testid', 'nav-turne');
    // İkon yerine emoji, metin değiştir
    var spans = innerDiv.querySelectorAll('span, svg');
    spans.forEach(function(el){ if(el.tagName==='svg') el.remove(); });
    innerDiv.innerHTML = '<div style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;white-space:nowrap;color:hsl(var(--sidebar-foreground));transition:all 0.15s">🚌 TURNE</div>';
    
    turneLink.appendChild(innerDiv);
    arsivParent.parentNode.insertBefore(turneLink, arsivParent.nextSibling);
  }
  var observer = new MutationObserver(addTurneLink);
  observer.observe(document.body, {childList:true, subtree:true});
  setTimeout(addTurneLink, 600);
  setTimeout(addTurneLink, 1500);
  setTimeout(addTurneLink, 3000);
})();
</script>

  </body>
</html>
