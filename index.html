/* ---------- Aylık program verisini bot için okunabilir hale getir ---------- */
function monthlyCellMap(month){
  const out = {};
  if(Array.isArray(month?.cells)){
    month.cells.forEach(([r,c,v]) => { out[r+"_"+c] = {v:String(v ?? "")}; });
  }else{
    Object.keys(month?.cells || {}).forEach(k => {
      const cell = month.cells[k];
      out[k] = typeof cell === "object" ? Object.assign({},cell,{v:String(cell.v ?? "")}) : {v:String(cell ?? "")};
    });
  }
  return out;
}
function monthlyFreeText(cell, value){
  const t = String(value || "").trim();
  return !!(cell?.freeText || /^(\/\/|#|!|>|\+|\[.*\]$|\(.*\)$)/.test(t));
}
function monthlyBotSnapshot(months){
  return (Array.isArray(months) ? months : []).map(month => {
    const cells = monthlyCellMap(month);
    const cols = Number(month.cols || 0);
    const playCols = new Set();
    for(let c=2; c<Math.max(2,cols-1); c++) playCols.add(c);
    const sceneOf = {};
    for(let c=0;c<cols;c++){
      let cc=c, scene="";
      while(cc>=0 && !scene){
        const v=String(cells["1_"+cc]?.v || "").trim();
        if(v) scene=v;
        cc--;
      }
      sceneOf[c]=scene;
    }
    const games = new Map(), notes = [];
    const pushNote = value => {
      const note=String(value || "").trim();
      if(note && !notes.includes(note)) notes.push(note);
    };
    pushNote(month.siteNote || month.note);
    for(const key of Object.keys(cells)){
      const [r0,c0] = key.split("_").map(Number);
      const cell = cells[key] || {};
      const value = String(cell.v || "").trim();
      if(!value || r0 < 2 || !playCols.has(c0)) continue;
      const lowered = fold(value);
      const noteLike = monthlyFreeText(cell,value) ||
        !!cell.note ||
        /not|uyari|ilerleyen|etkinlik|olasil|bilgi|duyuru/.test(lowered);
      if(noteLike){
        pushNote(cell.note || value);
        continue;
      }
      if(/^(\*|★)?\s*promiyer$/.test(lowered)) continue;
      const clean = value.replace(/^\s*[\*★]\s*/,"").replace(/[(\[][^)\]]*[)\]]/g," ").replace(/\s+/g," ").trim();
      if(!clean) continue;
      const gameKey = fold(clean);
      if(!games.has(gameKey)) games.set(gameKey,{name:clean,occurrences:[]});
      games.get(gameKey).occurrences.push({
        date:String(cells[r0+"_0"]?.v || "").trim(),
        time:String(cells[r0+"_1"]?.v || "").trim(),
        scene:String(sceneOf[c0] || "").trim(),
        note:String(cell.note || "").trim()
      });
    }
    return {
      name:String(month.name || "Adsız ay"),
      games:[...games.values()],
      notes,
      total:[...games.values()].reduce((n,g)=>n+g.occurrences.length,0)
    };
  });
}
function monthlyProgramAnswer(text, months){
  const data = monthlyBotSnapshot(months);
  if(!data.length) return null;
  const q = fold(text);
  const monthWords = ["ocak","subat","mart","nisan","mayis","haziran","temmuz","agustos","eylul","ekim","kasim","aralik"];
  const monthFiltered = data.filter(m => {
    const name=fold(m.name), year=(name.match(/20\d{2}/)||[])[0];
    return q.includes(name) ||
      monthWords.some(word => name.includes(word) && q.includes(word) && (!year || q.includes(year)));
  });
  const selected = monthFiltered.length ? monthFiltered : data;
  const allGames = selected.flatMap(m => m.games.map(g => ({...g,month:m.name})));
  const game = allGames.find(g => q.includes(fold(g.name))) ||
    allGames.find(g => fold(g.name).includes(q) && q.length >= 4);
  const wantsNotes = /not|uyari|duyuru|bilgi|etkinlik|olasil/.test(q);
  const wantsSchedule = /temsil|tarih|saat|sahne|ne zaman|hangi gun|program/.test(q);
  const wantsList = /hangi oyun|oyunlar|neler var|aylik program|takvim/.test(q);

  if(game){
    const rows = game.occurrences.map(o =>
      [o.date,o.time,o.scene].filter(Boolean).map(esc).join(" · ")
    );
    const notes = game.occurrences.map(o=>o.note).filter(Boolean);
    return "<b>"+esc(game.name)+"</b> için aylık program bilgisi:\n\n" +
      (rows.length ? rows.map((r,i)=>"• "+r).join("\n") : "• Temsil kaydı bulunamadı.") +
      (notes.length ? "\n\n<b>Not:</b> "+esc([...new Set(notes)].join(" · ")) : "");
  }
  if(wantsNotes){
    const noteRows = selected.flatMap(m => m.notes.map(n => "• <b>"+esc(m.name)+"</b>: "+esc(n)));
    return noteRows.length ? "<b>Aylık program notları</b>\n\n"+noteRows.join("\n") :
      "Seçilen aylarda kayıtlı bir not veya duyuru görünmüyor.";
  }
  if(wantsList || (monthFiltered.length && !game)){
    return selected.map(m => {
      const names = m.games.map(g => esc(g.name));
      return "<b>"+esc(m.name)+"</b> · "+m.total+" temsil\n"+(names.length ? names.map(n=>"• "+n).join("\n") : "• Oyun kaydı bulunmuyor.");
    }).join("\n\n");
  }
  if(wantsSchedule){
    return selected.map(m => "<b>"+esc(m.name)+"</b> · "+m.total+" temsil").join("\n") +
      "\n\nBir oyun adı yazarsanız tarih, saat ve sahne bilgilerini tek tek çıkarabilirim.";
  }
  return null;
}
async function monthlyProgramAnswerAsync(text){
  const q=fold(text);
  let months=window.IDT_MONTHLY_PROGRAM || [];
  const monthlyIntent=/aylik program|aylik|takvim|temsil|sahne|saat|oyun|not|uyari|duyuru/.test(q);
  if(!months.length && monthlyIntent && typeof window.loadMonthlyProgramForBot==="function"){
    try{ months=await window.loadMonthlyProgramForBot(); }catch(e){}
  }
  return monthlyProgramAnswer(text,months);
}
async function smartAnswerAsync(text){
  const monthly=await monthlyProgramAnswerAsync(text);
  return monthly || smartAnswer(text);
}

window.notifRowsHtml = function(list, baseIndex){
  if(NOTIF_ERR) return '<p class="sec-sub" style="padding:8px 2px;color:var(--danger)">' + esc(NOTIF_ERR) +
    '<button class="btn sm" style="margin-left:8px" onclick="loadNotifs()">Tekrar dene</button></p>';
  if(!list.length) return '<p class="sec-sub" style="padding:6px 2px">Henüz bildirim yok.</p>';
  const cls = t => trLower(t).includes("sil") || trLower(t).includes("çıkar") ? "crim" : trLower(t).includes("ekl") ? "gold" : "";
  const off = baseIndex || 0;
  return list.map((n,i) => '<div class="notif">' +
    '<span class="chip ' + cls(n.tur) + '" style="flex:0 0 auto">' + esc(n.tur||"İŞLEM") + '</span>' +
    '<div style="flex:1;min-width:0;padding-right:4px"><div class="nm">' + esc(n.aciklama || [n.kisi,n.oyun,n.gorev].filter(Boolean).join(" · ")) + '</div>' +
    '<span class="mt">' + esc(n.tarih||"") + '</span></div>' +
    '<button class="notif-del" onclick="removeNotif(' + (off+i) + ')" title="Herkesten sil">✕</button></div>').join("");
};

window.removeNotif = async function(idx){
  const n = NOTIFS[idx];
  if(!n) return;
  const btnList = document.querySelectorAll(".notif-del");
  btnList.forEach(b => b.style.pointerEvents = "none");
  let ok = false;
  const payload = JSON.stringify({tarih:n.tarih, tur:n.tur, oyun:n.oyun, kisi:n.kisi, gorev:n.gorev, aciklama:n.aciklama});
  const urls = [NOTIF_API + "/delete-row", NOTIF_FALLBACK + "/delete-row"];
  for(const u of [...new Set(urls)]){
    try{
      const r = await fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:payload});
      if(r.ok){ const j = await r.json().catch(()=>({})); if(j.deleted !== 0){ ok = true; break; } ok = true; break; }
    }catch(e){}
  }
  btnList.forEach(b => b.style.pointerEvents = "");
  if(ok){
    NOTIFS.splice(idx, 1);
    renderNotifs();
    const log = document.getElementById("notif-log");
    if(log) log.innerHTML = notifRowsHtml(NOTIFS.slice(0,50));
    toast("Bildirim tüm kullanıcılardan silindi.");
    loadNotifs();
  }else{
    saveHiddenKey(notifKey(n));
    NOTIFS.splice(idx, 1);
    renderNotifs();
    const log = document.getElementById("notif-log");
    if(log) log.innerHTML = notifRowsHtml(NOTIFS.slice(0,50));
    toast("Sunucuya ulaşılamadı; bildirim yalnızca bu cihazda gizlendi.", "err");
  }
};

window.loadNotifs = async function(){
  try{
    const d = await fetchNotifJson();
    NOTIF_ERR = "";
    const t = (d.headers||[]).map(h => trLower(h).trim());
    const ix = k => { const i = t.findIndex(h => h.startsWith(k)); return i < 0 ? -1 : i; };
    const turIx = [ix("işlem"), ix("tür"), ix("tur"), ix("islem")].find(i => i >= 0);
    const c = {tarih:Math.max(0,ix("tarih")), tur:turIx===undefined?-1:turIx, oyun:ix("oyun"), kisi:ix("kişi"), gorev:ix("görev"), aciklama:ix("açıklama")};
    const hidden = getHiddenKeys();
    NOTIFS = (d.rows||[]).map(row => ({
      tarih: row[c.tarih]??"", tur: c.tur<0?"":row[c.tur]??"", oyun: c.oyun<0?"":row[c.oyun]??"",
      kisi: c.kisi<0?"":row[c.kisi]??"", gorev: c.gorev<0?"":row[c.gorev]??"", aciklama: c.aciklama<0?"":row[c.aciklama]??""
    })).reverse().filter(n => !hidden.has(notifKey(n)));
  }catch(e){ NOTIFS = []; NOTIF_ERR = "Bildirimler yüklenemedi (" + (e.message||"bağlantı hatası") + ")."; }
  renderNotifs();
  const log = document.getElementById("notif-log");
  if(log) log.innerHTML = notifRowsHtml(NOTIFS.slice(0,50));
};

/* ---------- Veri tazeliği ---------- */
let LAST_SYNC = Date.now(), FRESH_BUSY = false, PAGE_OPEN_AT = Date.now();
const STALE_MS = 10 * 60 * 1000;
const FRESH_GRACE_MS = 2 * 60 * 1000; /* açılıştan sonraki ilk 2 dk göze çarpmasın */
function freshText(){
  const diff = Date.now() - LAST_SYNC;
  const m = Math.floor(diff / 60000);
  if(m < 1) return "Veriler güncel";
  if(m < 60) return m + " dk önce alındı";
  const h = Math.floor(m / 60);
  return h + " sa önce alındı";
}
function updateFreshUI(){
  const el = document.getElementById("data-fresh");
  if(!el) return;
  const stale = (Date.now() - LAST_SYNC) > STALE_MS;
  const inGrace = (Date.now() - PAGE_OPEN_AT) < FRESH_GRACE_MS;
  el.classList.toggle("stale", stale);
  el.classList.toggle("hidden-grace", inGrace && !stale);
  el.title = "Son veri alımı: " + new Date(LAST_SYNC).toLocaleTimeString("tr-TR") + (stale ? " · Veriler eskimiş olabilir, Güncelle'ye basın." : " · " + freshText());
}
window.refreshAllData = async function(silent){
  if(FRESH_BUSY) return;
  FRESH_BUSY = true;
  const btn = document.getElementById("data-fresh-btn");
  if(btn){ btn.classList.add("busy"); btn.textContent = "Alınıyor…"; }
  try{
    cache.clear();
    await boot();
    await loadNotifs();
    LAST_SYNC = Date.now();
    if(!silent) toast("Veriler Google e-Tablo'dan yeniden alındı.");
  }catch(e){
    if(!silent) toast("Veriler güncellenemedi, bağlantıyı kontrol edin.", "err");
  }
  if(btn){ btn.classList.remove("busy"); btn.textContent = "Güncelle"; }
  FRESH_BUSY = false;
  updateFreshUI();
};
setInterval(updateFreshUI, 30000);
updateFreshUI();

document.addEventListener("visibilitychange", () => {

/* ---------- PDF: görev filtreleme ---------- */
const rawPDF = window.exportPDF;
function pickFilterCol(headers){
  const idxOf = key => headers.findIndex(h => fold(h).includes(key));
  const g = idxOf("gorev");
  if(g >= 0) return g;
  const k = idxOf("kategori");
  if(k >= 0) return k;
  return -1;
}
window.pdfSelectAll = function(v){
  document.querySelectorAll("[data-pdfval]").forEach(e => e.checked = v);
};
const PDF_EMPTY_LABEL = "(Belirtilmemiş)";
window.exportPDFFiltered = async function(title, headers, allRows, filterCol){
  const dataRows = (allRows && allRows.length && Array.isArray(allRows[0]) && allRows[0].join("|") === headers.join("|")) ? allRows.slice(1) : (allRows || []);
  if(!dataRows.length) return rawPDF(title, headers, dataRows);
  let col = (filterCol === undefined || filterCol === null || filterCol < 0) ? pickFilterCol(headers) : filterCol;
  if(col < 0) return rawPDF(title, headers, dataRows);
  const valOf = r => { const v = String(r[col] || "").trim(); return v || PDF_EMPTY_LABEL; };
  const uniqueVals = [...new Set(dataRows.map(valOf))].sort((a,b) => {
    if(a === PDF_EMPTY_LABEL) return 1;
    if(b === PDF_EMPTY_LABEL) return -1;
    return sortTr(a,b);
  });
  if(uniqueVals.length <= 1) return rawPDF(title, headers, dataRows);
  const label = headers[col] || "Değer";
  const html =
    '<b style="display:block;margin-bottom:6px">PDF\u2019ye dahil edilecek <span style="color:var(--accent)">' + esc(label) + '</span> seçimi:</b>' +
    '<div style="display:flex;gap:6px;margin-bottom:10px">' +
      '<button class="btn sm" onclick="pdfSelectAll(true)">Tümü</button>' +
      '<button class="btn sm" onclick="pdfSelectAll(false)">Hiçbiri</button>' +
      '<span style="margin-left:auto;font-size:12px;color:var(--muted);align-self:center">' + uniqueVals.length + ' ' + esc(label.toLocaleLowerCase("tr")) + '</span>' +
    '</div>' +
    '<div style="display:flex;flex-direction:column;max-height:300px;overflow-y:auto;gap:2px">' +
    uniqueVals.map(v => {
      const n = dataRows.filter(r => valOf(r) === v).length;
      return '<label style="display:flex;align-items:center;gap:8px;padding:6px 5px;cursor:pointer;border-radius:7px">' +
        '<input type="checkbox" checked style="width:15px;height:15px;accent-color:var(--accent)" data-pdfval="' + esc(v) + '">' +
        '<span style="font-size:13px;flex:1">' + esc(v) + '</span>' +
        '<span style="font-size:11px;color:var(--muted)">' + n + '</span></label>';
    }).join("") + '</div>';
  const accepted = await uiOpen({mode:"confirm", title: title + " \u2014 PDF Filtrele", html, okText:"PDF Oluştur"});
  if(!accepted) return;
  const checked = new Set([...document.querySelectorAll("[data-pdfval]")].filter(e => e.checked).map(e => e.getAttribute("data-pdfval")));
  if(!checked.size) return uiAlert("Hiçbir seçim yapılmadı, PDF oluşturulmadı.");
  const filtered = dataRows.filter(r => checked.has(valOf(r)));
  rawPDF(title + (checked.size < uniqueVals.length ? " (Filtreli)" : ""), headers, filtered);
};
window.exportPDF = function(title, headers, data){
  return exportPDFFiltered(title, headers, data, undefined);
};

<script>
/* ═══════════ v5: düzeltmeler ve yeni özellikler ═══════════ */
(function(){

  /* ---------- 1) Tek oyunda pasife alma artık sayımlara da yansır ---------- */
  window.buildPlays = function(rows){
    const m = new Map();
    rows.forEach(r => {
      if(!m.has(r.oyun)) m.set(r.oyun,{name:r.oyun,people:new Set(),figs:new Set(),rows:0,cats:new Set()});
      const o = m.get(r.oyun); o.rows++;
      const figSet = figNamesInRow(r);
      names(r.kisi).forEach(n => { const c = stripTag(n); if(c) o.people.add(c); });
      figSet.forEach(c => o.figs.add(c));
      if(r.kategori) o.cats.add(r.kategori);
    });
    return [...m.values()].map(o => {
      const all = [...o.people];
      const akt = all.filter(n => !isPasifInPlay(n, o.name));   /* global + oyun bazlı pasif */
      return {name:o.name, personel:akt.length, tumPersonel:all.length, pasif:all.length - akt.length,
        figuran:[...o.figs].filter(n => !isPasifInPlay(n, o.name)).length, rowCount:o.rows, cats:[...o.cats].sort(sortTr)};
    }).sort((a,b) => sortTr(a.name,b.name));
  };

  window.buildPeople = function(rows){
    const m = new Map();
    rows.forEach(r => {
      const figSet = figNamesInRow(r);
      names(r.kisi).forEach(raw => {
        const n = stripTag(raw); if(!n) return;
        if(!m.has(n)) m.set(n,{name:n,oyunlar:new Set(),pasifOyun:new Set(),gorevler:new Set(),cats:new Set(),fig:false});
        const p = m.get(n);
        if(PASIF_PLAY.has(norm(n) + "|||" + norm(r.oyun))) p.pasifOyun.add(r.oyun);
        else p.oyunlar.add(r.oyun);
        if(r.gorev) p.gorevler.add(r.gorev);
        if(r.kategori) p.cats.add(r.kategori);
        if(figSet.has(n)) p.fig = true;
      });
    });
    return [...m.values()].map(p => ({name:p.name, oyunlar:[...p.oyunlar].sort(sortTr),
      pasifOyunlar:[...p.pasifOyun].sort(sortTr),
      gorevler:[...p.gorevler].sort(sortTr), cats:[...p.cats], fig:p.fig, aktif: !PASIF.has(norm(p.name))}))
      .sort((a,b) => b.oyunlar.length - a.oyunlar.length || sortTr(a.name,b.name));
  };

  /* Oyun bazlı pasife alma: satırdaki her ismi ayrı ayrı işler, hata mesajını gösterir */
  window.setPersonActiveForPlay = async function(name, oyun, aktif){
    const msg = aktif
      ? `${name}, "${oyun}" oyununda yeniden AKTİF olarak işaretlenecek.`
      : `${name}, yalnızca "${oyun}" oyununun kadrosunda PASİF olarak işaretlenecek.\n\nDiğer oyunlardaki kayıtları etkilenmez.`;
    const ok = await uiConfirm(msg, aktif ? "Aktife al" : "Pasife al (bu oyunda)");
    if(!ok) return;
    const key = norm(name) + "|||" + norm(oyun);
    try{
      toast((aktif ? "Aktife alınıyor" : "Pasife alınıyor") + "…");
      if(aktif){
        const hit = PASIF_ROWS.filter(x => norm(x.name) === norm(name) && norm(x.oyun) === norm(oyun)).sort((a,b) => b.i - a.i);
        for(const h of hit) await sheetDeleteFrom(PASIF_SHEET, h.i);
        PASIF_PLAY.delete(key);
      }else{
        if(!PASIF_PLAY.has(key)) await sheetAppendTo(PASIF_SHEET, [name, oyun]);
        PASIF_PLAY.add(key);
      }
      /* anında ekrana yansıt */
      rebuild();
      cache.delete(MAIN_SHEET); cache.delete(PASIF_SHEET);
      await boot();
      toast(aktif ? `${name} bu oyunda aktife alındı.` : `${name} "${oyun}" oyununda pasife alındı.`);
      loadNotifs();
    }catch(err){
      toast("Kaydedilemedi: " + (err && err.message ? err.message : "bilinmeyen hata"), "err");
    }
  };

  /* ---------- 2) Bildirimler: oyun bazlı kategorize ---------- */
  const notifCls = t => trLower(t||"").includes("sil") || trLower(t||"").includes("çıkar") ? "crim"
    : trLower(t||"").includes("ekl") ? "gold" : "";
  function notifItemHtml(n, realIdx){
    return '<div class="notif">' +
      '<span class="chip ' + notifCls(n.tur) + '" style="flex:0 0 auto">' + esc(n.tur||"İŞLEM") + '</span>' +
      '<div style="flex:1;min-width:0;padding-right:4px"><div class="nm">' +
        esc(n.aciklama || [n.kisi,n.oyun,n.gorev].filter(Boolean).join(" · ")) + '</div>' +
      '<span class="mt">' + esc(n.tarih||"") + '</span></div>' +
      '<button class="notif-del" onclick="removeNotif(' + realIdx + ')" title="Herkesten sil">✕</button></div>';
  }
  /* Oyunlara göre grupla; sıralama en yeni bildirime göre */
  window.notifGroupedHtml = function(limit){
    if(NOTIF_ERR) return '<p class="sec-sub" style="padding:8px 2px;color:var(--danger)">' + esc(NOTIF_ERR) +
      '<button class="btn sm" style="margin-left:8px" onclick="loadNotifs()">Tekrar dene</button></p>';
    const list = NOTIFS.slice(0, limit || 200);
    if(!list.length) return '<p class="sec-sub" style="padding:6px 2px">Henüz bildirim yok.</p>';
    const groups = new Map();
    list.forEach((n,i) => {
      const key = (n.oyun && String(n.oyun).trim()) ? String(n.oyun).trim() : "Diğer / Oyun belirtilmemiş";
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push({n, i});
    });
    return [...groups.entries()].map(([oyun, items], gi) =>
      '<details class="notif-group"' + (gi < 2 ? " open" : "") + '>' +
        '<summary><span>' + esc(oyun) + '</span><span class="cnt">' + items.length + '</span></summary>' +
        '<div class="gb">' + items.map(it => notifItemHtml(it.n, it.i)).join("") + '</div>' +
      '</details>').join("");
  };
  window.renderNotifs = function(){
    const b = document.getElementById("notif-badge"), l = document.getElementById("notif-list");
    if(b){ const n = unseenCount(); b.textContent = n > 99 ? "99+" : n; b.style.display = n ? "grid" : "none"; }
    if(l) l.innerHTML = notifGroupedHtml(60);
    const log = document.getElementById("notif-log");
    if(log) log.innerHTML = notifGroupedHtml(200);
  };
  const _loadNotifs = window.loadNotifs;
  window.loadNotifs = async function(){ await _loadNotifs.apply(this, arguments); renderNotifs(); };

  /* ---------- 3) İstatistik: kişi ve oyun araması ---------- */
  function ensureStatSearch(){
    if(document.getElementById("stat-search-wrap")) return;
    const seg = document.getElementById("stat-seg");
    if(!seg) return;
    const div = document.createElement("div");
    div.className = "stat-search"; div.id = "stat-search-wrap";
    div.innerHTML = '<input id="stat-q" placeholder="İstatistiklerde kişi veya oyun ara…" autocomplete="off">' +
      '<span class="hint" id="stat-q-hint"></span>';
    seg.parentNode.insertBefore(div, seg.nextSibling);
    div.querySelector("input").addEventListener("input", applyStatSearch);
  }
  function applyStatSearch(){
    const q = trLower((document.getElementById("stat-q")?.value || "").trim());
    const body = document.getElementById("stat-body");
    if(!body) return;
    const rows = body.querySelectorAll(".hbar, .grid-tbl tbody tr, table tr");
    let shown = 0, total = 0;
    rows.forEach(r => {
      if(r.closest("thead")) return;
      total++;
      const hit = !q || trLower(r.textContent || "").includes(q);
      r.style.display = hit ? "" : "none";
      if(hit) shown++;
    });
    const hint = document.getElementById("stat-q-hint");
    if(hint) hint.textContent = q ? (shown + " / " + total + " kayıt") : "";
  }
  window.applyStatSearch = applyStatSearch;
  const _renderGrafik = window.renderGrafik;
  window.renderGrafik = function(){
    _renderGrafik.apply(this, arguments);
    ensureStatSearch();
    applyStatSearch();
  };

  /* ---------- 4) Navigasyon: yönetim menüsü + Aylık Program ---------- */
  const ADMIN_IDS = ["gorevsiz","arsiv","yonetim"];
  function buildNav(){
    const nav = document.getElementById("nav");
    if(!nav) return;
    const main = [
      ["panel","Ana Panel"],["kisiler","Kişiler"],["dagilim","Dağılım"],["sorgu","Sorgulama"],
      ["grafik","İstatistik"],["figuran","Figüran"],["program","Programlar"]
    ];
    const admin = [["gorevsiz","Görevli Olmayan"],["arsiv","Arşiv Oyunlar"],["yonetim","Yönetim"]];
    const cur = (location.hash||"#panel").slice(1);
    nav.innerHTML =
      main.map(([id,l]) => '<button class="tab' + (cur===id?" on":"") + '" data-t="' + id + '" onclick="go(\'' + id + '\')">' + l + '</button>').join("") +
      '<div class="navdd" id="navdd-admin">' +
        '<button class="tab' + (ADMIN_IDS.includes(cur)?" on":"") + '" onclick="toggleAdminMenu(event)">Yönetim Paneli<span class="lock">🔒</span> <span style="opacity:.6">▾</span></button>' +
        '<div class="navdd-pop">' +
          admin.map(([id,l]) => '<button data-t="' + id + '" onclick="go(\'' + id + '\')">' + l + (id === "arsiv" ? "" : '<span class="lock">🔒</span>') + '</button>').join("") +
        '</div>' +
      '</div>' +
      '<a class="tab link" href="turne.html" target="_blank" rel="noopener">Turne Takip <span style="opacity:.6">↗</span></a>';
  }
  window.toggleAdminMenu = function(e){
    if(e){ e.stopPropagation(); }
    document.getElementById("navdd-admin")?.classList.toggle("open");
  };
  document.addEventListener("click", e => {
    const dd = document.getElementById("navdd-admin");
    if(dd && dd.classList.contains("open") && !e.target.closest("#navdd-admin")) dd.classList.remove("open");
  });
  buildNav();

  const _go = window.go;
  window.go = function(id){
    _go(id);
    document.getElementById("navdd-admin")?.classList.remove("open");
    const dd = document.querySelector("#navdd-admin > .tab");
    if(dd) dd.classList.toggle("on", ADMIN_IDS.includes(id));
    if(id === "program") renderProgram();
  };

  renderNotifs();
})();
<LEGSC/script>

<script>
/* ═══════ v7: Aylık Program = AYLIK PROGRAM HTML · iki yönlü veri köprüsü ═══════ */
(function(){
  const PRG_URL   = "AYLIK_PROGRAM.html"; /* aynı klasörde olmalı */
  const PRG_LSKEY = "idt_aylik_program_v3";         /* AYLIK PROGRAM HTML'in kendi kaydı */
  const BRIDGE    = "idt_repertuvar_bridge";        /* repertuvar -> aylık program veri köprüsü */
  const PUBLISHED_SHEET = "AYLIK PROGRAM";
  const PUBLISHED_API = "https://tiyatro-backend.vercel.app/api/sheets";

  /* ---------- 1) Repertuvar verisini köprüye yaz (AYLIK PROGRAM HTML buradan çeker) ---------- */
  function publishBridge(){
    try{
      if(typeof DATA === "undefined" || !Array.isArray(DATA) || !DATA.length) return;
      const plays = [], seen = new Set(), crew = [], ck = new Set();
      DATA.forEach(r => {
        const oyun = String(r.oyun||"").trim(); if(!oyun) return;
        if(!seen.has(oyun)){ seen.add(oyun); plays.push(oyun); }
        names(r.kisi).forEach(raw => {
          const kisi = stripTag(raw); if(!kisi) return;
          const kategori = String(r.kategori||"").trim() || "Oyuncu";
          const gorev = String(r.gorev||"").trim();
          const key = oyun+"|"+kategori+"|"+gorev+"|"+kisi;
          if(ck.has(key)) return; ck.add(key);
          crew.push({play:oyun, category:kategori, role:gorev, person:kisi, src:"idt"});
        });
      });
      plays.sort(sortTr);
      localStorage.setItem(BRIDGE, JSON.stringify({ts:Date.now(), plays, crew}));
    }catch(e){}
  }
  window.publishProgramBridge = publishBridge;
  const _rebuild = window.rebuild;
  if(typeof _rebuild === "function"){
    window.rebuild = function(){ const out = _rebuild.apply(this, arguments); publishBridge(); return out; };
  }
  setTimeout(publishBridge, 1500);
  setInterval(publishBridge, 60000);

  /* ---------- 2) AYLIK PROGRAM HTML kayıtlarını oku ---------- */
  function prgState(){
    try{ const raw = localStorage.getItem(PRG_LSKEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }
  function b64Utf8Decode(s){
    const bin = atob(s), bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  /* v8: Aylar artık AY BAZINDA kesinleştirilir/geri alınır. Sunucuda her ay
     kendi grup kimliğiyle ("apub_<ay-kodu>_<zaman>") ayrı satırlarda durur.
     Burada her ay-kodu için en güncel sürüm seçilip months[] birleştirilir;
     böylece bir ayın geri alınması diğer kesinleştirilmiş ayları etkilemez. */
  async function publishedState(){
    try{
      const res = await fetch(PUBLISHED_API + "/" + encodeURIComponent(PUBLISHED_SHEET) + "?fresh=1", {cache:"no-store"});
      if(!res.ok) return null; /* sunucuya erişilemedi -> yerel yedeğe düş */
      const rows = (await res.json()).rows || [];
      const groups = new Map();
      rows.filter(r => String(r[0]||"").startsWith("apub_")).forEach(r => {
        const id=String(r[0]), ts=+r[1]||0;
        if(!groups.has(id)) groups.set(id,{ts,rows:[]});
        groups.get(id).rows.push(r);
      });
      /* Sunucuya bağlanıldı ama kesinleştirilmiş program yok (örn. tüm aylar
         "Kesinleştirmeyi geri al" ile kaldırılmış) -> yerel taslağa DÜŞME, boş listeyi göster. */
      if(!groups.size) return {months:[]};
      const bySlug = new Map();
      for(const [id, g] of groups){
        const mm = id.match(/^apub_(.+)_(\d+)$/);
        const slug = mm ? mm[1] : id;
        const existing = bySlug.get(slug);
        if(!existing || g.ts > existing.ts) bySlug.set(slug, {ts:g.ts, rows:g.rows});
      }
      const months = [];
      for(const [slug, g] of bySlug){
        const parts = g.rows.slice().sort((a,b) => (+a[2]||0) - (+b[2]||0));
        const total = +parts[0][3] || parts.length;
        if(parts.length < total) continue; /* parçalı/eksik veri, güvenilmez say */
        try{
          const data = JSON.parse(b64Utf8Decode(parts.slice(0,total).map(r=>String(r[4]||"")).join("")));
          /* Yeni (ay bazlı) biçim: {month, plays, ...}. Eski (tüm program tek
             seferde) biçim geriye dönük uyum için hâlâ okunur: {months:[...]}. */
          if(data && data.month) months.push(Object.assign({}, data.month, {_pubTs:g.ts}));
          else if(data && Array.isArray(data.months)) months.push(...data.months.map(mo => Object.assign({}, mo, {_pubTs:g.ts})));
        }catch(e){}
      }
      return {months};
    }catch(e){ return null; } /* ağ/erişim hatası -> yerel yedeğe düş */
  }
  function cellsOf(m){
    const out = {};
    if(Array.isArray(m.cells)) m.cells.forEach(([r,c,v]) => out[r+"_"+c] = {v:String(v)});
    else Object.keys(m.cells||{}).forEach(k => out[k] = m.cells[k]);
    return out;
  }
  const normPlay = s => String(s||"")
    .replace(/[(\[][^)\]]*[)\]]/g, " ")            /* (FUAYE-11.00) gibi ekler */
    .replace(/\s+/g, " ").trim().toLocaleUpperCase("tr");
  /* Aylık Program'daki tanım BİREBİR aynı kurallar: bir hücre "oyun" sayılır,
     ancak ve ancak Aylık Program'da "Serbest metin" olarak işaretlenmemişse
     (elle ✎ ile veya //, #, !, >, + ile başlayan / tamamen parantez içindeki
     metinler otomatik serbest metin sayılır) ve salt "PRÖMİYER" işareti
     değilse. Tarih/saat/başlık sütunları zaten yapısal olarak (satır/sütun
     aralığı) devre dışı — ayrıca içerik bazlı bir anahtar kelime listesine
     ihtiyaç yok; bu da Aylık Program'da yeni bir tur/tatil/duyuru adı
     eklendiğinde index'in listeyi güncellemek için değiştirilmesini gerektirmez. */
  function isPremiereLabel(t){
    const s = String(t||"").trim().toLocaleUpperCase("tr");
    return s==="PRÖMİYER" || s==="* PRÖMİYER" || s==="*PRÖMİYER";
  }
  function isFreeTextValue(v){
    const t = String(v||"").trim();
    if(!t) return false;
    if(/^(\/\/|#|!|>|\+)/.test(t)) return true;
    if(/^\(.*\)$/.test(t)) return true;
    if(/^\[.*\]$/.test(t)) return true;
    return false;
  }
  function isFreeTextCell(cell){ return !!(cell && (cell.freeText || isFreeTextValue(cell.v))); }
  function playKeyOf(raw){
    const t = String(raw||"").trim();
    if(!t) return "";
    const body0 = t.startsWith("*") ? t.slice(1).trim() : t;
    let body = body0.replace(/[(\[][^)\]]*[)\]]/g, " ");   /* (11.00-14.00) gibi ekler */
    const dash = body.match(/\s[-–—]\s*(\S.*)$/);           /* " - açıklama" eki */
    if(dash) body = body.slice(0, dash.index);
    return body.replace(/\s+/g, " ").trim();
  }
  /* Aylık Program'daki programCols() ile aynı: ilk iki sütun (tarih/saat) ve
     son sütun (tarih tekrarı) oyun sütunu değildir. */
  function playColsOf(m){
    const out = new Set();
    for(let c=2; c<(m.cols||0)-1; c++) out.add(c);
    return out;
  }
  /* Oyun adları repertuvar köprüsünden gelir; yalnızca AYNI oyunun farklı
     yazımlarını (Repertuvar'daki resmî adına) tek isim altında toplamak için
     kullanılır — bir hücrenin oyun SAYILIP sayılmayacağına karar vermez. */
  function knownPlaySet(){
    const out = new Map();
    try{
      const b = JSON.parse(localStorage.getItem(BRIDGE)||"null");
      (b && b.plays || []).forEach(p => out.set(normPlay(p), String(p).trim()));
    }catch(e){}
    try{
      if(typeof DATA !== "undefined" && Array.isArray(DATA))
        DATA.forEach(r => { const o=String(r.oyun||"").trim(); if(o) out.set(normPlay(o), o); });
    }catch(e){}
    return out;
  }
  function monthInfo(m){
    const cells = cellsOf(m);
    const known = knownPlaySet();
    const playCols = playColsOf(m);
    let dolu = 0; const oyunlar = new Set();
    Object.keys(cells).forEach(k => {
      const cell = cells[k]||{};
      const v = String(cell.v||"").trim(); if(!v) return;
      dolu++;
      const r = +k.split("_")[0], c = +k.split("_")[1];
      if(r < 2) return;                                  /* kurum başlığı ve sahne satırı */
      if(!playCols.has(c)) return;                       /* tarih/saat sütunları ve son (tarih tekrarı) sütunu */
      if(isPremiereLabel(v)) return;                      /* salt "PRÖMİYER" işareti, oyun adı değil */
      if(isFreeTextCell(cell)) return;                    /* Aylık Program'da "Serbest metin" işaretli hücre */
      const key = playKeyOf(v);
      if(!key) return;
      const nk = normPlay(key);
      if(known.has(nk)){ oyunlar.add(known.get(nk)); return; }
      /* "OYUN ADI (SAAT)" gibi ekli yazımlar için baş harf eşleşmesi */
      if(known.size){
        for(const [kk, orig] of known){
          if(kk.length > 3 && (nk.startsWith(kk) || kk.startsWith(nk))){ oyunlar.add(orig); return; }
        }
      }
      /* Repertuvar'da henüz kayıtlı olmayan oyun da sayıma dahil edilsin */
      oyunlar.add(key);
    });
    /* temsil sayısı (dolu oyun hücresi), sahne sayısı ve dolu gün sayısı */
    let temsil = 0; const sahneler = new Set(), gunler = new Set();
    Object.keys(cells).forEach(k => {
      const cell = cells[k]||{};
      const v = String(cell.v||"").trim(); if(!v) return;
      const r = +k.split("_")[0], c = +k.split("_")[1];
      if(r === 1 && playCols.has(c)){ sahneler.add(v); return; }
      if(r < 2 || !playCols.has(c)) return;
      if(isPremiereLabel(v) || isFreeTextCell(cell)) return;
      temsil++;
      const g = String((cells[r+"_0"]||{}).v||"").trim(); if(g) gunler.add(g);
    });
    return {cells, dolu, oyunSayisi:oyunlar.size, oyunlar:[...oyunlar],
      temsil, sahneSayisi:sahneler.size, doluGun:gunler.size,
      pubTs:m._pubTs||0,
      note:String(m.siteNote||m.note||"").trim()};
  }
  function pubTsLabel(ts){
    if(!ts) return "";
    const d = new Date(ts);
    const tarih = d.toLocaleDateString("tr-TR", { timeZone:"Europe/Istanbul", day:"2-digit", month:"2-digit", year:"numeric" });
    const saat = d.toLocaleTimeString("tr-TR", { timeZone:"Europe/Istanbul", hour:"2-digit", minute:"2-digit" });
    return tarih + " saat:" + saat;
  }

  /* ---------- 2b) Ay sırası (takvim sırası) ---------- */
  const TR_MONTHS = ["OCAK","ŞUBAT","MART","NİSAN","MAYIS","HAZİRAN","TEMMUZ","AĞUSTOS","EYLÜL","EKİM","KASIM","ARALIK"];
  function monthOrder(m){
    const name = String((m && m.name) || "").toLocaleUpperCase("tr");
    let mi = -1;
    TR_MONTHS.forEach((nm, i) => { if(mi < 0 && name.includes(nm)) mi = i; });
    const ym = name.match(/(20\d{2})/);
    const yr = ym ? +ym[1] : 9999;
    if(mi < 0) return yr * 100 + 99;
    return yr * 100 + mi;
  }

  /* ---------- 3) Önizleme tablosu (salt okunur) ---------- */
  let PREVIEW = -1;
  window.toggleProgramPreview = function(i){
    PREVIEW = (PREVIEW === i ? -1 : i);
    if(PREVIEW === -1) document.querySelectorAll(".aph-ov").forEach(n => n.remove());
    renderProgram();
  };
  /* Önizleme açıkken aylar arasında dolaş: son aydan sonra ilk aya,
     ilk aydan önce son aya dönerek kesintisiz bir takvim hissi verir. */
  window.changeProgramPreview = function(delta){
    const ov = document.querySelector(".aph-ov");
    if(!ov) return;
    const current = Number(ov.dataset.previewIndex);
    const count = Number(ov.dataset.previewCount);
    if(!Number.isInteger(current) || !Number.isInteger(count) || count < 2) return;
    const next = (current + delta + count) % count;
    PREVIEW = next;
    renderProgram();
  };
  document.addEventListener("keydown", e => {
    if(e.key !== "Escape" || PREVIEW < 0) return;
    const prevEl = document.querySelector(".aph-prev");
    const hasHl = prevEl && (prevEl.classList.contains("aph-searching") || prevEl.querySelector("td.aph-sel"));
    if(hasHl){ e.preventDefault(); window.aphClearHighlight(); return; }
    window.toggleProgramPreview(PREVIEW);
  });
  document.addEventListener("keydown", e => {
    if(PREVIEW < 0 || !document.querySelector(".aph-ov")) return;
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if(["input","textarea","select"].includes(tag) || e.target?.isContentEditable) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); window.changeProgramPreview(-1); }
    if(e.key === "ArrowRight"){ e.preventDefault(); window.changeProgramPreview(1); }
  });
  const PRG_TITLE_RE = /İZMİR\s+DEVLET\s+TİYATROSU\s+MÜDÜRLÜĞÜ/i;
  const DAY_RE = /(cumartesi|pazar)(?!tesi)/i;
  function previewHtml(m){
    const cells = cellsOf(m);
    const covered = new Set(), span = {};
    (m.merges||[]).forEach(([r1,c1,r2,c2]) => {
      span[r1+"_"+c1] = {rs:r2-r1+1, cs:c2-c1+1};
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) if(r!==r1||c!==c1) covered.add(r+"_"+c);
    });
    const playCols = playColsOf(m);
    /* Sahne adları: 2. satırdaki (index 1) başlık hücreleri */
    const sceneOf = {};
    for(let c=0;c<m.cols;c++){
      let cc = c, txt = "";
      while(cc >= 0 && !txt){ const cl = cells["1_"+cc]; if(cl && String(cl.v||"").trim() && !covered.has("1_"+cc)) txt = String(cl.v).trim(); cc--; }
      sceneOf[c] = txt;
    }
    /* Birleştirilmiş (rowspan) tarih hücrelerinde alt satırların da tarihi bilinsin:
       örn. "18 TEMMUZ Cumartesi" 15.00 + 20.00 satırlarının ikisi de hafta sonu sayılır. */
    const dateAt = {};
    let curDate = "";
    for(let r=0;r<m.rows;r++){
      const own = (!covered.has(r+"_0")) ? String((cells[r+"_0"]||{}).v||"") : null;
      if(own !== null){ curDate = own; dateAt[r] = own; }
      else dateAt[r] = curDate;
    }
    /* Bir satırda temsil var mı? Birleştirilmiş oyun hücreleri de sayılır. */
    const filled = {};
    for(let r=0;r<m.rows;r++) filled[r] = false;
    for(let r=2;r<m.rows;r++){
      playCols.forEach(c => {
        const k = r+"_"+c;
        if(covered.has(k)) return;
        const cell = cells[k]||{};
        const txt = String(cell.v||"").replace(/^\s*[\*★]\s*/, "").trim();
        if(!txt || isPremiereLabel(txt)) return;
        const sp = span[k] || {rs:1, cs:1};
        for(let rr=r; rr<r+sp.rs && rr<m.rows; rr++) filled[rr] = true;
      });
    }
    let h = "<table id=\"aphPrevTable\"><colgroup><col style=\"width:128px\"><col style=\"width:60px\">"
      + Array(Math.max(0, m.cols - 2)).fill("<col>").join("") + "</colgroup><tbody>";
    for(let r=0;r<m.rows;r++){
      const dateTxt = String(dateAt[r]||"");
      const cls = [];
      if(r < 2) cls.push("aph-hdr-row","aph-hdr-row-"+r);
      else {
        const dolu = filled[r];
        if(dolu) cls.push("aph-has");
        else if(dateTxt.trim()) cls.push("aph-empty");
        if(DAY_RE.test(dateTxt)) cls.push("aph-weekend");
      }
      h += "<tr"+(cls.length?' class="'+cls.join(" ")+'"':"")+">";
      for(let c=0;c<m.cols;c++){
        const k = r+"_"+c; if(covered.has(k)) continue;
        const cell = cells[k]||{}, sp = span[k]||{rs:1,cs:1};
        const rawV = String(cell.v||"");
        /* Prömiyer: Aylık Program editöründeki ★ işaretiyle BİREBİR aynı kural */
        const isPrem = !!cell.premiere || (rawV.trim().startsWith("*") && !isPremiereLabel(rawV));
        const v = isPrem ? rawV.replace(/^\s*[\*★]\s*/, "") : rawV;
        const st = [];
        const isHdr = r < 2;
        const isPlayCell = !isHdr && playCols.has(c) && v.trim() && !isPremiereLabel(v) && !isFreeTextCell(cell);
        if(!isHdr){
          if(isPrem) st.push("color:var(--danger)", "font-weight:800");
          else if(cell.color) st.push("color:"+cell.color);
          if(cell.bold && !isPrem) st.push("font-weight:700");
        }
        const cc = [];
        if(isHdr) cc.push("aph-hdr-cell","aph-hdr-cell-"+r);
        if(c < 2) cc.push("aph-col-"+c);
        if(isPlayCell) cc.push("aph-play");
        if(!isHdr && playCols.has(c) && !v.trim() && !cell.bg) cc.push("aph-blank");
        const data = isPlayCell
          ? ' data-oyun="'+esc(v)+'" data-tarih="'+esc(String((cells[r+"_0"]||{}).v||"").trim())
            +'" data-saat="'+esc(String((cells[r+"_1"]||{}).v||"").trim())
            +'" data-sahne="'+esc(sceneOf[c]||"")+'"'+(cell.note?' data-not="'+esc(String(cell.note))+'"':"")
          : "";
        const inner = (isPrem?"★ ":"")+esc(v);
        const content = (!isHdr && c===0) ? '<div class="aph-datewrap">'+inner+'</div>' : inner;
        h += "<td"+(cc.length?' class="'+cc.join(" ")+'"':"")+data+
             (sp.rs>1?' rowspan="'+sp.rs+'"':"")+(sp.cs>1?' colspan="'+sp.cs+'"':"")+
             (st.length?' style="'+st.join(";")+'"':"")+">"+content+"</td>";
      }
      h += "</tr>";
    }
    return h + "</tbody></table>";
  }

  /* Önizleme etkileşimi: TEK tık hücreyi seçer ve alt bilgi çubuğunu doldurur,
     ÇİFT tık aynı oyunun ay içindeki tüm tarihlerini işaretler. */
  function wirePreview(prevEl){
    if(!prevEl) return;
    const info = document.getElementById("aphInfo");
    const setInfo = html => { if(info) info.innerHTML = html; };
    prevEl.addEventListener("click", e => {
      const td = e.target.closest("td.aph-play"); if(!td) return;
      prevEl.querySelectorAll("td.aph-sel").forEach(n => n.classList.remove("aph-sel"));
      td.classList.add("aph-sel");
      setInfo('<div><span class="k">Oyun</span><b>'+esc(td.dataset.oyun||"")+'</b></div>'
        + '<div><span class="k">Tarih</span>'+esc(td.dataset.tarih||"—")+'</div>'
        + '<div><span class="k">Saat</span>'+esc(td.dataset.saat||"—")+'</div>'
        + '<div><span class="k">Sahne</span>'+esc(td.dataset.sahne||"—")+'</div>'
        + (td.dataset.not ? '<div><span class="k">Not</span>'+esc(td.dataset.not)+'</div>' : "")
        + '<div><button class="btn sm" onclick="aphHighlightPlay(this.dataset.oyun)" data-oyun="'+esc(td.dataset.oyun||"")+'">Tüm temsillerini göster</button></div>');
    });
    window.aphHighlightPlay = function(name){
      const key = normPlay(playKeyOf(name||""));
      const hits = [...prevEl.querySelectorAll("td.aph-play")]
        .filter(n => normPlay(playKeyOf(n.dataset.oyun||"")) === key);
      prevEl.classList.add("aph-searching");
      prevEl.querySelectorAll("td.aph-hit").forEach(n => n.classList.remove("aph-hit"));
      hits.forEach(n => n.classList.add("aph-hit"));
      const srch = document.getElementById("aphSearch"); if(srch) srch.value = playKeyOf(name||"");
      const list = hits.map(n => {
        const t = String(n.dataset.tarih||"").replace(/\s+/g," ").trim();
        const sa = String(n.dataset.saat||"").trim();
        return (t + (sa ? " · " + sa : "")).trim();
      }).filter(Boolean);
      setInfo('<div><span class="k">Oyun</span><b>'+esc(playKeyOf(name||""))+'</b></div>'
        + '<div><span class="k">Bu ay</span><b>'+hits.length+' temsil</b></div>'
        + (list.length ? '<div style="flex:1;min-width:200px"><span class="k">Tarihler</span>'+esc(list.join("  |  "))+'</div>' : "")
        + '<div><button class="btn sm" onclick="aphClearHighlight()" title="Vurgu ve seçimi kaldır (Esc)">Vurguyu kaldır <span style="opacity:.6">Esc</span></button></div>');
    };
    prevEl.addEventListener("dblclick", e => {
      const td = e.target.closest("td.aph-play"); if(!td) return;
      window.aphHighlightPlay(td.dataset.oyun||"");
    });
  }

  const APH_INFO_HINT = '<span style="color:var(--muted)">Bir oyun hücresine <b>tek tıklayın</b> → tarih, saat ve sahne bilgisi burada görünür · <b>çift tıklayın</b> → o oyunun ay içindeki tüm temsilleri vurgulanır · <b>Esc</b> → vurguyu kaldırır.</span>';
  window.aphClearHighlight = function(){
    const prevEl = document.querySelector(".aph-prev"); if(!prevEl) return;
    prevEl.classList.remove("aph-searching");
    prevEl.querySelectorAll("td.aph-hit").forEach(n => n.classList.remove("aph-hit"));
    prevEl.querySelectorAll("td.aph-sel").forEach(n => n.classList.remove("aph-sel"));
    const srch = document.getElementById("aphSearch"); if(srch) srch.value = "";
    const info = document.getElementById("aphInfo"); if(info) info.innerHTML = APH_INFO_HINT;
  };

  window.aphSearch = function(q){
    const prevEl = document.querySelector(".aph-prev"); if(!prevEl) return;
    const t = String(q||"").trim().toLocaleUpperCase("tr");
    prevEl.querySelectorAll("td.aph-hit").forEach(n => n.classList.remove("aph-hit"));
    if(!t){ prevEl.classList.remove("aph-searching"); return; }
    prevEl.classList.add("aph-searching");
    prevEl.querySelectorAll("td.aph-play").forEach(n => {
      if(String(n.dataset.oyun||"").toLocaleUpperCase("tr").includes(t)) n.classList.add("aph-hit");
    });
  };
  window.aphZoom = function(d){
    const prevEl = document.querySelector(".aph-prev"); if(!prevEl) return;
    const cur = parseFloat(getComputedStyle(prevEl).getPropertyValue("--aph-zoom")) || 1;
    prevEl.style.setProperty("--aph-zoom", Math.min(1.6, Math.max(.75, cur + d)).toFixed(2));
    stickProgramHeader(prevEl);
  };

  /* Önizlemeyi yeni sekmede, tarayıcı alanına otomatik sığan ve hiç
     kaydırma gerektirmeyen bir görünüm olarak aç. Yazı boyutu ekrana göre
     büyütülerek okunaklılık artırılır. */
  window.openProgramFullscreen = function(i){
    const months = Array.isArray(window.IDT_MONTHLY_PROGRAM) ? window.IDT_MONTHLY_PROGRAM : [];
    const m = months[i];
    if(!m) return;
    const info = monthInfo(m);
    const tableHtml = previewHtml(m);
    const popup = window.open("", "_blank");
    if(!popup){
      uiAlert("Tam ekran önizleme açılamadı. Tarayıcı yeni sekme açılmasına izin vermiyor olabilir.", "Yeni sekme açılamadı");
      return;
    }
    const title = String(m.name || "Aylık Program");
    const styleText = [...document.querySelectorAll("style")]
      .map(s => s.textContent || "")
      .join("\n")
      .replace(/<\/style/gi, "<\\/style");
    const docHtml = '<!doctype html><html lang="tr" class="aph-fullscreen-html"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +

            '<span class="chip gold">' + info.temsil + ' temsil · ' + info.oyunSayisi + ' oyun</span>' +
            '<div class="aph-fullscreen-zoom" role="group" aria-label="Yazı boyutu">' +
              '<button class="btn sm" type="button" onclick="aphFsZoom(-1)" aria-label="Küçült">A−</button>' +
              '<span class="aph-fullscreen-zoomval" id="aphFsZoomVal">%100</span>' +

            '<button class="btn sm" type="button" onclick="window.close()">Kapat ✕</button>' +

        '</header>' +
        '<section class="aph-fullscreen-stage" aria-label="' + esc(title) + ' program tablosu">' +

        '</section>' +
        '<footer class="aph-fullscreen-legend">' +
          '<span><i style="background:color-mix(in srgb,var(--accent) 22%,var(--surface))"></i>Hafta sonu · temsil var</span>' +
          '<span><i style="background:color-mix(in srgb,var(--text) 12%,var(--surface));background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.10) 0 4px,transparent 4px 8px)"></i>Temsil yok</span>' +
          '<span><i style="background:color-mix(in srgb,var(--text) 5%,var(--surface))"></i>Boş hücre</span>' +
          '<span class="aph-fullscreen-hint">Yazı boyutu için <b>+ / −</b> · sığdırmak için <b>0</b></span>' +
        '</footer>' +
      '</main>' +
      '<script>' +
        '(function(){' +
          'var stage=document.querySelector(".aph-fullscreen-stage"),fit=document.getElementById("aphFullscreenFit");' +
          'var prev=fit?fit.querySelector(".aph-prev"):null,val=document.getElementById("aphFsZoomVal");' +
          'var zoom=1,manual=false;' +
          'function apply(z){zoom=Math.max(.55,Math.min(3,z));if(prev)prev.style.setProperty("--aph-zoom",zoom.toFixed(3));' +
            'if(val)val.textContent="%"+Math.round(zoom*100);}' +
          'function frame(){return{w:Math.max(1,stage.clientWidth-10),h:Math.max(1,stage.clientHeight-10)};}' +
          'function shrinkToFit(){if(!fit)return;fit.style.transform="none";var f=frame(),r=fit.getBoundingClientRect();' +
            'var s=Math.min(1,f.w/r.width,f.h/r.height);fit.style.transform=s<.999?"scale("+s.toFixed(4)+")":"none";}' +
          'function autoFit(){if(!stage||!fit)return;fit.style.transform="none";apply(1);' +
            'for(var i=0;i<14;i++){var f=frame(),r=fit.getBoundingClientRect();' +
              'var ratio=Math.min(f.h/r.height,f.w/r.width);' +

              'if(h<=PH)break;z=Math.max(.3,z*PH/h*.985);}});' +

        '})();' +
      '<\/script></body></html>';
    popup.document.open();
    popup.document.write(docHtml);
    popup.document.close();
    try{ popup.opener = null; }catch(e){}
  };

  /* Başlık satırları (kurum adı + sahne adları) kaydırma sırasında görünür
     kalsın diye sabitlenir. İkinci satırın üst konumu ilk satırın gerçek
     yüksekliğine göre hesaplanır (rowspan'lı hücreler yüzünden sabit bir
     değer güvenilir olmaz). */
  function stickProgramHeader(container){
    if(!container) return;
    const table = container.querySelector("#aphPrevTable");
    if(!table) return;
    const row0 = table.querySelector(".aph-hdr-row-0");
    if(!row0) return;
    const h0 = row0.getBoundingClientRect().height;
    container.style.setProperty("--aph-r0h", h0 + "px");
    const c0 = table.querySelector("tr:not(.aph-hdr-row) td.aph-col-0:not([colspan])");
    if(c0) container.style.setProperty("--aph-c0w", c0.getBoundingClientRect().width + "px");
  }

  /* Aylık programı rehber botuna da aç: bot, kullanıcı program ekranını hiç
     açmamış olsa bile güncel yayınlanmış veriyi gerektiğinde okuyabilir. */
  window.IDT_MONTHLY_PROGRAM = [];
  window.loadMonthlyProgramForBot = async function(){
    try{
      const st = (await publishedState()) || prgState();
      const raw = (st && Array.isArray(st.months)) ? st.months : [];
      const months = raw.slice().sort((a,b) => monthOrder(a) - monthOrder(b));
      window.IDT_MONTHLY_PROGRAM = months;
      return months;
    }catch(e){
      return window.IDT_MONTHLY_PROGRAM || [];
    }
  };

  /* ---------- 4) Yeni Aylık Program ekranı ---------- */
  let PRG_LAST_FETCH = null; /* bu ekran en son ne zaman yenilendi (kafa karışmasın diye) */
  function prgLastFetchLabel(){
    if(!PRG_LAST_FETCH) return "";
    return PRG_LAST_FETCH.toLocaleTimeString("tr-TR", { timeZone:"Europe/Istanbul", hour:"2-digit", minute:"2-digit" });
  }
  window.renderProgram = async function(){
    const box = document.getElementById("program");
    if(!box) return;
    publishBridge();
    const st = (await publishedState()) || prgState();
    PRG_LAST_FETCH = new Date();
    const rawMonths = (st && Array.isArray(st.months)) ? st.months : [];
    /* Aylık programlar takvim sırasına (yıl + ay) göre listelenir */
    const months = rawMonths.slice().sort((a,b) => monthOrder(a) - monthOrder(b));
    window.IDT_MONTHLY_PROGRAM = months;
    if(PREVIEW >= months.length) PREVIEW = months.length - 1;
    const infos = months.map(monthInfo);

    box.innerHTML = `
      <div class="card">
         <div class="card-h aph-head">
          <div><h3><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18"></path><path d="m8 14 2 2 5-5"></path></svg></span> Aylık Program</h3></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <span class="chip gold">${months.length} ay</span>
            <span class="chip" title="Bu ekran en son bu saatte yenilendi (verinin ne zaman kesinleştirildiğini göstermez)">Ekran yenilendi: ${prgLastFetchLabel()}</span>
            <button class="btn sm" onclick="renderProgram()">Yenile</button>
          </div>
        </div>
        <div class="card-b" style="padding:16px">
          ${months.length ? "" : `<div class="aph-note" style="background:var(--danger-wash);border-color:var(--danger);border-left-color:var(--danger);color:var(--danger)">
            Henüz kayıtlı aylık program görünmüyor. Aylık Program üzerinde ay oluşturup kaydedin,
            sonra bu ekranda <b style="color:var(--danger)">Yenile</b>'ye basın.</div>`}
          <div class="aph-months">${infos.map((inf,i) => `
            <div class="aph-card">
              <div class="month-kicker"><svg class="aph-kicker-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18"></path></svg>Aylık program özeti</div>
              <div class="ttl">${esc(months[i].name||("Ay "+(i+1)))}</div>
              ${inf.pubTs ? `<div class="meta" title="Bu ayın programı bu tarih ve saatte son kez kesinleştirildi (yayına alındı)">Son güncelleme: ${pubTsLabel(inf.pubTs)}</div>` : ""}
              <div class="stat">
                <div title="Bu ay programda yer alan birbirinden farklı oyun sayısı">
                  <svg class="aph-stat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h16v11H4z"></path><path d="M7 7.5V5h10v2.5M8 12h8M8 15.5h5"></path></svg>
                  <b>${inf.oyunSayisi}</b><span>farklı oyun</span><small>oyun sayısı</small>
                </div>
                <div title="Bu ay oynanacak toplam temsil (gösteri) sayısı">
                  <svg class="aph-stat-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18M8 14l2 2 5-5"></path></svg>
                  <b>${inf.temsil}</b><span>temsil</span><small>gösteri sayısı</small>
                </div>
                <div title="Ay içinde en az bir temsil bulunan gün sayısı">
                  <svg class="aph-stat-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"></path></svg>
                  <b>${inf.doluGun}</b><span>dolu gün</span><small>gün sayısı</small>
                </div>
              </div>
              ${inf.note ? `<div class="note">${esc(inf.note)}</div>` : ""}
              <div class="acts">
                <button class="btn sm aph-preview-btn" onclick="toggleProgramPreview(${i})">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="m8 21 2-3h4l2 3"></path><path d="m10 9 4 2-4 2z"></path></svg>
                  ${PREVIEW===i?"Önizlemeyi kapat":"Programı önizle"}
                </button>
              </div>
            </div>`).join("")}</div>
          ${PREVIEW>-1 && months[PREVIEW] ? `
            <div class="aph-ov" data-preview-index="${PREVIEW}" data-preview-count="${months.length}"
              role="dialog" aria-modal="true" aria-labelledby="aphPreviewTitle"
              onclick="if(event.target===this)toggleProgramPreview(${PREVIEW})">
              <div class="win">
                <div class="top">
                  <div class="t" id="aphPreviewTitle" aria-live="polite">${esc(months[PREVIEW].name||"Önizleme")}</div>
                  <div style="display:flex;gap:8px;align-items:center">
                    <button class="btn sm aph-preview-fullscreen-btn" type="button"
                      onclick="openProgramFullscreen(${PREVIEW})" aria-label="Tam ekran önizlemeyi yeni sekmede aç"
                      title="Tam ekran önizlemeyi yeni sekmede aç">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"></path></svg>
                    </button>
                    <button class="btn sm" type="button" onclick="aphPrintPreview()" title="Yazdır / PDF">🖨 Yazdır</button>
                    <span class="chip gold">${infos[PREVIEW].temsil} temsil · ${infos[PREVIEW].oyunSayisi} oyun</span>
                    <div class="aph-preview-nav" aria-label="Aylar arasında geçiş">
                      <button class="btn sm" type="button" onclick="changeProgramPreview(-1)"
                        aria-label="Önceki ay" title="Önceki ay (sol ok)">‹</button>
                      <span class="aph-page" aria-live="polite">${PREVIEW+1} / ${months.length}</span>
                      <button class="btn sm" type="button" onclick="changeProgramPreview(1)"
                        aria-label="Sonraki ay" title="Sonraki ay (sağ ok)">›</button>
                    </div>
                    <button class="btn sm" type="button" data-aph-close
                      onclick="toggleProgramPreview(${PREVIEW})" aria-label="Önizlemeyi kapat">Kapat ✕</button>
                  </div>
                </div>
                <div class="aph-tools">
                  <input id="aphSearch" type="text" placeholder="Oyun ara — eşleşenler vurgulanır…" oninput="aphSearch(this.value)" />
                  <button class="btn sm" onclick="document.getElementById('aphSearch').value='';aphSearch('')">Temizle</button>
                  <button class="btn sm" onclick="aphZoom(-0.1)">A−</button>
                  <button class="btn sm" onclick="aphZoom(0.1)">A+</button>
                  <div class="aph-legend">
                    <span><i style="background:color-mix(in srgb,var(--accent) 22%,var(--surface))"></i>Hafta sonu · temsil var</span>
                    <span><i style="background:color-mix(in srgb,var(--text) 12%,var(--surface));box-shadow:inset 3px 0 0 color-mix(in srgb,var(--accent) 50%,transparent)"></i>Hafta sonu · temsil yok</span>
                    <span><i style="background:color-mix(in srgb,var(--text) 12%,var(--surface));background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.10) 0 4px,transparent 4px 8px)"></i>Temsil yok</span>
                    <span><i style="background:color-mix(in srgb,var(--text) 5%,var(--surface))"></i>Boş hücre</span>
                    <span><i style="background:#ffe9a8"></i>Arama sonucu</span>
                    <span style="color:var(--danger);font-weight:700">★ Prömiyer</span>
                  </div>
                </div>
                <div class="aph-prev">${previewHtml(months[PREVIEW])}</div>
                <div class="aph-info" id="aphInfo"><span style="color:var(--muted)">Bir oyun hücresine <b>tek tıklayın</b> → tarih, saat ve sahne bilgisi burada görünür · <b>çift tıklayın</b> → o oyunun ay içindeki tüm temsilleri vurgulanır · <b>Esc</b> → vurguyu kaldırır.</span></div>
              </div>
            </div>` : ""}
        </div>
      </div>`;

    /* Önizleme katmanını body'ye taşı (fixed konumlanma bozulmasın) */
    document.querySelectorAll("body > .aph-ov").forEach(n => n.remove());
    const ov = box.querySelector(".aph-ov");
    if(ov){
      document.body.appendChild(ov);
      const prevEl = ov.querySelector(".aph-prev");
      if(prevEl){
        stickProgramHeader(prevEl);
        wirePreview(prevEl);
        window.addEventListener("resize", () => stickProgramHeader(prevEl));
        setTimeout(() => stickProgramHeader(prevEl), 60);
      }
        setTimeout(() => ov.querySelector("[data-aph-close]")?.focus(), 40);
    }
  };

  window.openProgramSite = function(i){
    const url = PRG_URL + (typeof i === "number" ? "#ay=" + i : "");
    window.open(url, "_blank", "noopener");
  };

  if(window.RENDER) window.RENDER.program = window.renderProgram;
  if((location.hash||"").slice(1) === "program") setTimeout(() => window.go("program"), 120);
})();

<!-- ═══════════════ HAFTALIK PROGRAM ÖNİZLEME · birimlerin onaylı haftalık programları ═══════════════ -->
<style>

.hp-note::before{content:"i";display:grid;place-items:center;flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800}

@media(max-width:700px){.hp-doc table{font-size:11.5px}.hp-doc .hp-head{flex-direction:column}.hp-doc .hp-head .r,.hp-doc .hp-head .l{text-align:left}}
</style>
<script>
(function(){
  const API = "https://tiyatro-backend.vercel.app/api/sheets/" + encodeURIComponent("HAFTALIK PROGRAM") + "?fresh=1";
  const UNITS = [["dekor","Dekor Aksesuar Birimi"],["kondvit","Kondüvit Birimi"],["isik","Işık Birimi"],
                 ["erkek","Erkek Terzi Birimi"],["kadin","Kadın Terzi Birimi"],["peruka","Peruka Birimi"]];
  const SHOW_FIRST = 4;
  let DATA = {};            /* birim kodu -> [{week,label,ts,doc}] (yeniden eskiye) */
  let OPEN = null;          /* açık önizleme: {key, week} */
  let EXPAND = {};          /* birim kodu -> hepsi gösteriliyor mu */
  let LAST = null;
  let LIST = null;         /* haftaları listelenen birim kodu */

  const hesc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function b64u(b){ const bin=atob(b), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
  function tsLabel(ts){
    try{ return new Date(ts).toLocaleString("tr-TR",{timeZone:"Europe/Istanbul",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).replace(","," saat:"); }
    catch(e){ return ""; }
  }

  async function load(){
    let res;
    try{ res = await fetch(API,{cache:"no-store"}); }
    catch(e){ await new Promise(r=>setTimeout(r,700)); res = await fetch(API.replace("?fresh=1",""),{cache:"no-store"}); }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const rows = (await res.json()).rows || [];
    const groups = new Map();
    rows.forEach(r=>{
      const id = String(r[0]||"");
      if(!/^hpub_[a-z]+_\d{4}-\d{2}-\d{2}_\d+$/.test(id)) return;
      if(!groups.has(id)) groups.set(id,[]);
      groups.get(id).push(r);
    });
    /* her birim+hafta için en yeni EKSİKSİZ kayıt */
    const best = new Map();
    for(const [id,rs] of groups){
      const total = +rs[0][3] || rs.length;
      if(new Set(rs.map(r=>+r[2])).size < total) continue;
      const m = id.match(/^hpub_([a-z]+)_(\d{4}-\d{2}-\d{2})_(\d+)$/);
      const k = m[1]+"|"+m[2], ts = +m[3], cur = best.get(k);
      if(cur && cur.ts >= ts) continue;
      try{
        const txt = rs.slice().sort((a,b)=>a[2]-b[2]).map(r=>String(r[4]||"")).join("");
        const o = JSON.parse(b64u(txt));
        if(o && o.doc) best.set(k,{ts,key:m[1],week:m[2],label:o.label||m[2],doc:o.doc,note:String(o.note||"").trim()});
      }catch(e){}
    }
    const out = {};
    UNITS.forEach(([k])=>out[k]=[]);
    for(const v of best.values()){ (out[v.key] = out[v.key] || []).push(v); }
    Object.values(out).forEach(a=>a.sort((x,y)=> y.week<x.week ? -1 : y.week>x.week ? 1 : 0));
    return out;
  }

  function statsOf(doc){
    let isSayi=0, doluGun=0; const kisi=new Set();
    (doc.days||[]).forEach(d=>{
      let any=false;
      (d.rows||[]).forEach(r=>{
        const task=(r.cells&&r.cells.task&&r.cells.task.t||"").trim();
        const ppl=(r.cells&&r.cells.ppl&&r.cells.ppl.t||"");
        if(task){ isSayi++; any=true; }
        ppl.split(/[–—,\-\n]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>kisi.add(x));
      });
      if(any) doluGun++;
    });
    return {isSayi,doluGun,kisi:kisi.size};
  }

  function statHtml(st){
    return `<div class="stat">
        <div title="Haftalık programa girilen iş sayısı"><b>${st.isSayi}</b><span>iş</span><small>yapılacak iş</small></div>
        <div title="En az bir iş girilen gün sayısı"><b>${st.doluGun}</b><span>dolu gün</span><small>gün sayısı</small></div>
        <div title="Görevli olarak yazılan farklı kişi/kısaltma sayısı"><b>${st.kisi}</b><span>görevli</span><small>kişi sayısı</small></div>
      </div>`;
  }
  /* birim penceresindeki hafta kartı (kart içinde kart) */
  function weekCard(key,w){
    return `<div class="aph-card">
      <div class="month-kicker">Haftalık program</div>
      <div class="ttl">${hesc(w.label)}</div>
      <div class="meta">Onay: ${hesc(tsLabel(w.ts))}</div>
      ${statHtml(statsOf(w.doc))}
      ${w.note?`<div class="note">${hesc(w.note)}</div>`:""}
      <div class="acts">
        <button class="btn sm aph-preview-btn" onclick="hpOpen('${key}','${w.week}')">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="m8 21 2-3h4l2 3"></path><path d="m10 9 4 2-4 2z"></path></svg>
          Programı önizle</button>
      </div>
    </div>`;
  }

  function unitCard([key,name]){
    const list = DATA[key] || [];
    if(!list.length) return `<div class="aph-card" style="opacity:.8">
      <div class="month-kicker">Haftalık program</div>
      <div class="ttl">${hesc(name)}</div>
      <div class="meta">Henüz onaylanmış program yok</div>
      <div class="note">Birim haftalık programı onayladığında burada görünür.</div>
    </div>`;
    const w = list[0], st = statsOf(w.doc);
    return `<div class="aph-card">
      <div class="month-kicker">Haftalık program</div>
      <div class="ttl">${hesc(name)}</div>
      <div class="meta" title="En son onaylanan hafta">${hesc(w.label)} · Onay: ${hesc(tsLabel(w.ts))}</div>
      ${statHtml(st)}
      ${w.note?`<div class="note">${hesc(w.note)}</div>`:""}
      <div class="acts">
        <button class="btn sm aph-preview-btn" onclick="hpOpen('${key}','${w.week}')">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="m8 21 2-3h4l2 3"></path><path d="m10 9 4 2-4 2z"></path></svg>
          Programı önizle</button>
        <button class="btn sm" style="width:100%" onclick="hpList('${key}')" aria-label="Bu birimin tüm onaylı haftaları">Tüm haftalar (${list.length})</button>
      </div>
    </div>`;
  }

  function docHtml(doc){
    const days = (doc.days||[]).map(d=>{
      const n = (d.rows||[]).length;
      return (d.rows||[]).map((row,i)=>{
        let h = `<tr class="${i===0?"ds":""}">`;
        if(i===0) h += `<td class="date${d.weekend?" we":""}" rowspan="${n}">${hesc(d.label)}</td>`;
        ["time","place","task","ppl"].forEach(role=>{
          const c = (row.cells&&row.cells[role])||{t:""};
          if(c.skip) return;
          h += `<td class="${role}"${c.span>1?` rowspan="${c.span}"`:""}>${hesc(c.t)}</td>`;
        });
        return h+"</tr>";
      }).join("");
    }).join("");
    const signs = (doc.signs||[]).map(s=>{ const l=String(s).split("\n"); return `<div><b>${hesc(l.shift())}</b>${hesc(l.join("\n"))}</div>`; }).join("");
    return `<div class="hp-doc">
      <h2>${hesc(doc.title||"HAFTALIK İŞ PLANI ÇİZELGESİ")}</h2><div class="wk">${hesc(doc.week||"")}</div>
      <table><colgroup><col style="width:12%"><col style="width:9%"><col style="width:10%"><col style="width:41%"><col style="width:28%"></colgroup>
        <thead><tr><th>TARİH / GÜN</th><th>SAAT</th><th>YER</th><th>YAPILACAK İŞ</th><th>GÖREVLİLER</th></tr></thead><tbody>${days}</tbody></table>
      ${(doc.notes&&doc.notes.length)?`<ul>${doc.notes.map(t=>`<li>${hesc(t)}</li>`).join("")}</ul>`:""}
      ${signs?`<div class="signs">${signs}</div>`:""}
    </div>`;
  }

  function overlay(){
    document.querySelectorAll("body > .hp-ov").forEach(n=>n.remove());
    if(!OPEN) return;
    const w = (DATA[OPEN.key]||[]).find(x=>x.week===OPEN.week);
    if(!w){ OPEN=null; return; }
    const uname = (UNITS.find(u=>u[0]===OPEN.key)||[,""])[1];
    const ov = document.createElement("div");
    ov.className = "aph-ov hp-ov";
    ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
    ov.onclick = e => { if(e.target===ov) hpClose(); };
    ov.innerHTML = `<div class="win">
      <div class="top"><div class="t">${hesc(uname)} · ${hesc(w.label)}</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="chip">Onay: ${hesc(tsLabel(w.ts))}</span>
        <button class="btn sm" onclick="window.print()" title="Yazdır / PDF">🖨 Yazdır</button>
        <button class="btn sm" data-hp-close onclick="hpClose()">Kapat ✕</button></div></div>
      <div class="aph-prev" style="padding-top:8px">${w.note?`<div class="hp-note">${hesc(w.note)}</div>`:""}${docHtml(w.doc)}</div></div>`;
    document.body.appendChild(ov);
    ov.querySelector("[data-hp-close]")?.focus();
  }
  document.addEventListener("keydown", e => { if(e.key!=="Escape") return; if(OPEN) hpClose(); else if(LIST) hpListClose(); });

  function listOverlay(){
    document.querySelectorAll("body > .hp-ovl").forEach(n=>n.remove());
    if(!LIST) return;
    const u = UNITS.find(x=>x[0]===LIST), arr = DATA[LIST]||[];
    if(!u || !arr.length){ LIST=null; return; }
    const ov = document.createElement("div");
    ov.className = "aph-ov hp-ovl";
    ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
    ov.onclick = e => { if(e.target===ov) hpListClose(); };
    ov.innerHTML = `<div class="win" style="display:flex;flex-direction:column">
      <div class="top"><div class="t">${hesc(u[1])} · Haftalık programlar</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="chip gold">${arr.length} onaylı hafta</span>
        <button class="btn sm" data-hp-lclose onclick="hpListClose()">Kapat ✕</button></div></div>
      <div class="aph-prev" style="flex:1;min-height:0;overflow:auto;padding-top:8px">
        <div class="aph-months" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">${arr.map(w=>weekCard(LIST,w)).join("")}</div></div></div>`;
    document.body.appendChild(ov);

  function paint(error){
    const box = document.getElementById("haftalik");
    if(!box) return;
    const total = Object.values(DATA).reduce((n,a)=>n+a.length,0);
    box.innerHTML = `<div class="card">
      <div class="card-h aph-head">
        <div><h3><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2"></rect><path d="M8 2.5v4M16 2.5v4M3 9.5h18"></path><path d="m8 14 2 2 5-5"></path></svg></span> Haftalık Program</h3></div>

      <div class="card-b" style="padding:16px">
        ${error?`<div class="aph-note" style="background:var(--danger-wash);border-color:var(--danger);border-left-color:var(--danger);color:var(--danger)">Haftalık programlar okunamadı (${hesc(error)}). Bir süre sonra <b>Yenile</b>'ye basın.</div>`:""}
        <div class="aph-months">${UNITS.map(unitCard).join("")}</div>
      </div></div>`;
    listOverlay();
    overlay();
  }

  window.renderHaftalik = async function(){
    const box = document.getElementById("haftalik");
    if(!box) return;
    if(!LAST) box.innerHTML = `<div class="card"><div class="card-b" style="padding:16px;color:var(--muted)">Haftalık programlar yükleniyor…</div></div>`;
    let err = "";

    LAST = new Date();
    paint(err);
  };
  window.hpOpen   = (key,week) => { OPEN={key,week}; overlay(); };
  window.hpClose  = () => { OPEN=null; overlay(); };
  window.hpList   = key => { LIST=key; listOverlay(); };
  window.hpListClose = () => { LIST=null; listOverlay(); };

  let VIEW = "aylik";
  function applyView(){
    const am=document.getElementById("program"), hf=document.getElementById("haftalik");
    if(am) am.style.display = VIEW==="aylik" ? "" : "none";
    if(hf) hf.style.display = VIEW==="haftalik" ? "" : "none";
    document.querySelectorAll("#prgSwitch button").forEach(b=>b.classList.toggle("on", b.dataset.v===VIEW));
  }
  window.setProgView = v => { VIEW=v; applyView(); if(v==="haftalik") renderHaftalik(); else if(window.renderProgram) renderProgram(); };
  const _go = window.go;
  window.go = function(id){
    if(id === "haftalik"){ VIEW="haftalik"; id="program"; }
    _go(id);
    if(id === "program"){ applyView(); if(VIEW==="haftalik") renderHaftalik(); }
  };
  const h0=(location.hash||"").slice(1);
  if(h0 === "haftalik") setTimeout(() => window.go("haftalik"), 150);
})();

<script>
(function(){
  /* ---------- açık/kapalı durumu (yeniden çizimde korunur) ---------- */
  const OPEN = new Map();
  window.knToggle = function(el, key, cat){
    const s = OPEN.get(key); if(!s) return;
    if(el.open) s.add(cat); else s.delete(cat);
  };
  window.knAll = function(key, open){
    document.querySelectorAll("[data-kn]").forEach(c => {
      if(c.dataset.kn === key) c.querySelectorAll("details.kn-cat").forEach(d => { d.open = open; });
    });
  };

  const PSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>';
  const initial = n => (String(n).trim().charAt(0) || "?").toLocaleUpperCase("tr");

  /* rows: [{kategori, gorev, kisi}]  ·  opt: {oyun, scope, pas(name) -> "" | "Pasif" | "Bu oyunda pasif"} */
  window.kunyeHtml = function(key, rows, opt){
    const byCat = new Map();
    rows.forEach(r => {
      const k = String(r.kategori || "").trim() || "Diğer";
      if(!byCat.has(k)) byCat.set(k, []);
      byCat.get(k).push(r);
    });
    if(!byCat.size) return `<div class="kn-note">Bu oyunda kayıt yok.</div>`;
    if(!OPEN.has(key)) OPEN.set(key, new Set([...byCat.keys()].slice(0, 1)));   /* ilk kategori açık gelir */
    const open = OPEN.get(key);
    const cats = [...byCat.entries()].map(([cat, rs]) => {
      const cards = [];
      rs.forEach(r => names(String(r.kisi || "")).forEach(raw => {
        const nm = stripTag(raw); if(!nm) return;
        const pas = opt.pas ? opt.pas(nm) : "";
        cards.push(`<button type="button" class="kn-p${pas ? " pas" : ""}" onclick="knPerson(${jq(nm)},${jq(opt.oyun)},${jq(opt.scope)})">
          <span class="kn-av">${PSVG}</span>
          <span class="kn-t"><span class="kn-role">${esc(r.gorev || "Kadro")}</span><span class="kn-name">${esc(nm)}</span>
          ${pas ? `<span class="chip">${esc(pas)}</span>` : ""}</span></button>`);
      }));
      return `<details class="kn-cat"${open.has(cat) ? " open" : ""} ontoggle="knToggle(this,${jq(key)},${jq(cat)})">
        <summary><span>${esc(cat)}</span><span class="sp"></span><span class="chip ${isFig(cat) ? "crim" : ""}">${cards.length} kişi</span></summary>
        <div class="kn-grid">${cards.join("") || `<div class="kn-note" style="grid-column:1/-1">Kayıtlı kişi yok.</div>`}</div></details>`;
    }).join("");
    return `<div data-kn="${esc(key)}">
      <div class="kn-tools"><button class="btn sm" onclick="knAll(${jq(key)},true)">▾ Tümünü aç</button>
        <button class="btn sm" onclick="knAll(${jq(key)},false)">▸ Tümünü kapat</button></div>${cats}</div>`;
  };

  /* ---------- Arşiv verisi yardımcıları ---------- */
  function arsivCols(){
    const h = ARSIV.heads, f = k => h.findIndex(x => has(x, k));
    let ik = f("kategori"), ig = f("görev"), ip = f("kişi");
    if(ik < 0) ik = 1; if(ig < 0) ig = 2; if(ip < 0) ip = h.length - 1;
    return {ik, ig, ip};
  }
  async function ensureArsiv(){
    if(ARSIV.loaded) return;
    const d = await sheet(ARSIV_SHEET);
    const heads = (d.headers && d.headers.length ? d.headers : ["Oyun Adı"]).filter(h => String(h || "").trim());
    ARSIV = {heads, rows:(d.rows || []).filter(r => r.some(c => String(c || "").trim())), loaded:true};
  }
  function personArsiv(name){
    const {ik, ig, ip} = arsivCols(), by = new Map();
    ARSIV.rows.forEach(r => {
      if(!names(unent(String(r[ip] ?? ""))).some(x => stripTag(x) === name)) return;
      const oyun = unent(String(r[0] ?? "").trim()) || "Belirtilmemiş";
      if(!by.has(oyun)) by.set(oyun, []);
      by.get(oyun).push({kategori:unent(String(r[ik] ?? "")), gorev:unent(String(r[ig] ?? ""))});

    return by;

  const roleText = rs => rs.map(r => [r.gorev, r.kategori].filter(Boolean)[0]).filter(Boolean).filter((v,i,a) => a.indexOf(v) === i).join(" · ");

  async function fillArsiv(id, name, curOyun, scope){

    try{ await ensureArsiv(); }catch(e){ el = document.getElementById(id); if(el) el.innerHTML = `<div class="kn-note">Arşiv okunamadı.</div>`; return; }
    el = document.getElementById(id); if(!el) return;
    const by = personArsiv(name);
    const cur = (scope === "arsiv") ? by.get(curOyun) : null;
    const curBox = document.getElementById("kn-cur");
    if(cur && curBox) curBox.innerHTML = `<h4>Bu oyundaki görevi (arşiv)</h4><div class="kn-pl"><div><div class="nm">${esc(curOyun)}</div><div class="mt">${esc(roleText(cur))}</div></div><span class="chip">Arşiv</span></div>`;
    const list = [...by.entries()].filter(([o]) => !(scope === "arsiv" && o === curOyun)).sort((a,b) => sortTr(a[0], b[0]));
    el.innerHTML = list.length ? list.map(([o, rs]) => `<div class="kn-pl"><div><div class="nm">${esc(o)}</div><div class="mt">${esc(roleText(rs))}</div></div><span class="chip">Arşiv</span></div>`).join("")
      : `<div class="kn-note">Arşiv oyunlarında kaydı yok.</div>`;
  }

  /* ---------- Kişi bilgi kartı ---------- */
  window.knClose = function(){ document.getElementById("kn-ov")?.remove(); };
  document.addEventListener("keydown", e => { if(e.key === "Escape") knClose(); });

  window.knPerson = function(name, oyun, scope){
    knClose();
    const p = PEOPLE.find(x => x.name === name);
    const rows = DATA.filter(r => names(r.kisi).some(x => stripTag(x) === name));
    const by = new Map(); rows.forEach(r => { if(!by.has(r.oyun)) by.set(r.oyun, []); by.get(r.oyun).push({kategori:r.kategori, gorev:r.gorev}); });
    const figOyun = new Set(FIGROWS.filter(r => r.kisi === name).map(r => r.oyun));
    const globalPas = isPasif(name);
    const curRep = scope === "rep" ? by.get(oyun) : null;
    const others = [...by.entries()].filter(([o]) => !(scope === "rep" && o === oyun)).sort((a,b) => sortTr(a[0], b[0]));
    const chips = [globalPas ? `<span class="chip">Pasif</span>` : "", figOyun.size ? `<span class="chip crim">Figüran</span>` : ""].join(" ");
    const ov = document.createElement("div");
    ov.className = "kn-ov"; ov.id = "kn-ov";
    ov.onclick = e => { if(e.target === ov) knClose(); };
    ov.innerHTML = `<div class="kn-win" role="dialog" aria-modal="true">
      <div class="hd"><span class="kn-av">${PSVG}</span>
        <div style="min-width:0"><h3>${esc(name)}</h3>
          <div class="mt">Repertuvarda ${by.size} oyun · ${rows.length} kayıt${figOyun.size ? ` · ${figOyun.size} figüran görevi` : ""}</div>
          <div style="margin-top:4px">${chips}</div></div>
        <button class="x" onclick="knClose()" aria-label="Kapat">✕</button></div>
      <div class="bd">
        ${curRep ? `<div class="kn-sec"><h4>Bu oyundaki görevi</h4><div class="kn-pl"><div><div class="nm">${esc(oyun)}</div><div class="mt">${esc(roleText(curRep))}</div></div>
          ${!globalPas && isPasifInPlay(name, oyun) ? `<span class="chip">Bu oyunda pasif</span>` : ""}</div></div>` : ""}
        <div class="kn-sec" id="kn-cur"></div>
        <div class="kn-sec"><h4>${curRep ? "Repertuvardaki diğer oyunları" : "Repertuvardaki oyunları"} (${others.length})</h4>
          ${others.length ? others.map(([o, rs]) => `<div class="kn-pl go" onclick="knClose();openPlay=${jq(o)};go('panel')">
            <div><div class="nm">${esc(o)}</div><div class="mt">${esc(roleText(rs))}</div></div>
            ${!globalPas && isPasifInPlay(name, o) ? `<span class="chip">Pasif</span>` : ""}</div>`).join("") : `<div class="kn-note">Başka oyunda görevi yok.</div>`}</div>
        <div class="kn-sec"><h4>Arşiv oyunlar</h4><div id="kn-arsiv"></div></div>
      </div>
      <div class="ft"><button class="btn sm" onclick="knClose();openPerson=${jq(name)};go('kisiler')">Kişi sayfasını aç</button>

  /* ---------- Oyun detayı: künye (Pasife al / turne yazıları yok) ---------- */
  window.playDetail = function(name){

    ${kunyeHtml("rep|" + name, rows, {oyun:name, scope:"rep", pas})}`;
  };

  /* ---------- Kişi detayı: arşiv görevleri de eklendi ---------- */
  window.personDetail = function(name){
    const rows = DATA.filter(r => names(r.kisi).some(x => stripTag(x) === name));

    rows.forEach(r => { if(!byPlay.has(r.oyun)) byPlay.set(r.oyun, []); byPlay.get(r.oyun).push(r); });
    const figOyun = new Set(FIGROWS.filter(r => r.kisi === name).map(r => r.oyun));

    return `<button class="back" onclick="openPerson=null;renderPeople()">← Kişi listesi</button>

      <div class="tools">${p && !p.aktif ? '<span class="chip">Pasif</span>' : ""}${figOyun.size ? '<span class="chip crim">Figüran</span>' : ""}
        <button class="btn sm ${p && p.aktif ? "dan" : "pri"}" onclick="setPersonActive(${jq(name)},${p && p.aktif ? "false" : "true"})">${p && p.aktif ? "Pasife al" : "Aktife al"}</button>
        <button class="btn sm" onclick="exportExcel([['Oyun','Kategori','Görev']].concat(${jq(rows.map(r => [r.oyun, r.kategori, r.gorev]))}),'kisi')">Excel</button>
        <button class="btn sm" onclick="exportPDF(${jq(name)},['Oyun','Kategori','Görev'],${jq(rows.map(r => [r.oyun, r.kategori, r.gorev]))})">PDF</button></div></div>
      <div class="card-b"><div class="kn-sec" style="padding:12px 14px 4px"><h4>Repertuvardaki oyunlar</h4></div>${[...byPlay.entries()].sort((a,b) => sortTr(a[0], b[0])).map(([play, rs]) => `
