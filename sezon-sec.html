<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sezon Seç · Turne Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=DM+Mono:wght@400;500;600&family=Playfair+Display:wght@700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=DM+Mono:wght@400;500;600&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet"></noscript>
<script>
  (function() {
    try {
      var t = localStorage.getItem('_tema') || 'light';
      if (t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch(e) {}
  })();
</script>
<style>
/* ─── Design tokens — Aydınlık Tema (turne.html ile birebir) ─── */
:root {
  --bg:            hsl(36, 18%, 91%);
  --fg:            #2C2C2C;
  --border:        hsl(36, 14%, 82%);
  --card:          #ffffff;
  --card-alt:      hsl(36, 14%, 95%);
  --primary:       hsl(38, 78%, 42%);
  --primary-h:     hsl(38, 78%, 34%);
  --primary-glow:  hsl(38, 80%, 58%);
  --primary-fg:    #ffffff;
  --accent-bg:     hsl(42, 60%, 88%);
  --accent-fg:     hsl(38, 70%, 20%);
  --muted:         hsl(36, 14%, 91%);
  --muted-fg:      #5C5652;
  --success:       hsl(142, 55%, 32%);
  --success-bg:    hsl(142, 45%, 93%);
  --info:          hsl(205, 65%, 38%);
  --info-bg:       hsl(205, 55%, 93%);
  --bg-glow:       hsl(42, 55%, 88%);
  --shadow-sm:     0 1px 2px rgba(44,30,10,.06), 0 3px 8px rgba(44,30,10,.05);
  --shadow-md:     0 2px 6px rgba(44,30,10,.07), 0 10px 24px rgba(44,30,10,.08);
  --shadow-lg:     0 4px 10px rgba(44,30,10,.08), 0 20px 44px rgba(44,30,10,.11);
  --radius:        16px;
  --radius-sm:     10px;
  --radius-xs:     6px;
  --bar-color:     hsl(38, 78%, 42%);
  --bar-bg:        hsl(36, 14%, 85%);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg:            hsl(222, 20%, 8%);
  --fg:            hsl(220, 15%, 96%);
  --border:        hsl(222, 14%, 20%);
  --card:          hsl(222, 17%, 11%);
  --card-alt:      hsl(222, 15%, 14%);
  --primary:       hsl(238, 75%, 68%);
  --primary-h:     hsl(238, 75%, 58%);
  --primary-glow:  hsl(238, 85%, 75%);
  --primary-fg:    hsl(220, 20%, 8%);
  --accent-bg:     hsl(238, 28%, 22%);
  --accent-fg:     hsl(238, 85%, 82%);
  --muted:         hsl(222, 14%, 14%);
  --muted-fg:      hsl(220, 12%, 58%);
  --success:       hsl(152, 60%, 55%);
  --success-bg:    hsl(152, 30%, 14%);
  --info:          hsl(199, 85%, 62%);
  --info-bg:       hsl(199, 40%, 16%);
  --bg-glow:       hsl(238, 40%, 16%);
  --shadow-sm:     0 1px 3px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.30);
  --shadow-md:     0 2px 8px rgba(0,0,0,.50), 0 12px 32px rgba(0,0,0,.38);
  --shadow-lg:     0 4px 16px rgba(0,0,0,.55), 0 24px 56px rgba(0,0,0,.44);
  --bar-bg:        hsl(222, 14%, 20%);
  color-scheme: dark;
}

/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; -webkit-text-size-adjust: 100%; }
body {
  font-family: "DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 70% 45% at 50% -10%, var(--bg-glow) 0%, transparent 55%);
  background-attachment: fixed;
  color: var(--fg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "kern" 1,"liga" 1,"ss01";
  min-height: 100dvh;
  transition: background-color .25s ease, color .15s ease;
}
.mono {
  font-family: "DM Mono","JetBrains Mono",ui-monospace,monospace;
  font-variant-numeric: tabular-nums;
}

/* ─── Page layout ─── */
.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: clamp(24px,4vw,48px) clamp(18px,4vw,44px) 80px;
  animation: fadeInUp .5s cubic-bezier(.18,.7,.2,1) both;
}

/* ─── Animations ─── */
@keyframes fadeInUp  { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }
@keyframes cardIn    { from { opacity:0; transform:translateY(12px) scale(.99) } to { opacity:1; transform:none } }
@keyframes slideDown { from { opacity:0; max-height:0 } to { opacity:1; max-height:2000px } }
@keyframes countUp   { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
@keyframes barGrow      { from { width:0 } to { width:var(--w) } }
@keyframes barGrowH     { from { transform:scaleY(0) } to { transform:scaleY(1) } }
@keyframes shimmer      { 0% { background-position:-400px 0 } 100% { background-position:400px 0 } }
@keyframes popIn     { 0% { opacity:0; transform:scale(.92) } 60% { transform:scale(1.02) } 100% { opacity:1; transform:scale(1) } }
@keyframes pulse     { 0%,100% { opacity:1 } 50% { opacity:.55 } }

/* ─── Header ─── */
.head-row {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.head-left { display: flex; align-items: center; gap: 14px; }

/* Karakter maskotu */
.head-char {
  height: 44px; width: 44px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 8px;
  background: transparent;
}

/* Dikey ayırıcı çizgi */
.brand-divider {
  width: 1px; height: 36px; background: var(--border); flex-shrink: 0;
}

/* Marka metinleri */
.head-text {}
.brand-name {
  font-size: 13px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--fg); line-height: 1.2;
  font-family: "Playfair Display","DM Sans",serif;
}
.brand-sub {
  font-size: 9.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  color: var(--primary); margin-top: 3px;
}

/* Sayfa başlığı (brand bar'ın altında) */
.page-title {
  font-size: clamp(16px, 2.2vw, 22px);
  font-weight: 800;
  letter-spacing: -.4px;
  line-height: 1.25;
  color: var(--fg);
  margin-top: 20px;
  margin-bottom: 0;
}
.page-title em {
  font-style: normal;
  color: var(--primary);
}

/* Eski h1 — artık .page-title kullanılıyor */
h1 { display: none; }
.subtitle { display: none; }
.eyebrow { display: none; }

.close-btn {
  border: 1px solid var(--border); background: var(--card);
  width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--muted-fg); line-height: 1;
  transition: all .18s ease; flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}
.close-btn:hover { color: var(--fg); border-color: var(--muted-fg); background: var(--card-alt); }
.close-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ─── Season grid ─── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
  gap: 20px;
  margin-top: 28px;
  align-items: start;
}

/* ─── Season card ─── */
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
  /* Kartın kendisine max-height YOK — sadece body sınırlandırılıyor */
  transition: transform .22s ease, box-shadow .22s ease;
  animation: cardIn .55s both;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.card:focus-within { outline: 2px solid var(--primary); outline-offset: 2px; }

/* accent stripe */
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--primary-glow));
  z-index: 1;
}
.card.empty::before {
  background: linear-gradient(90deg, var(--border), var(--muted));
}

/* Kart gövdesi: içerik uzarsa kaydırılır, footer hep altta görünür */
.card-body {
  padding: 22px 22px 8px;
  overflow-y: auto;
  max-height: clamp(380px, 58vh, 560px);
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.card-body::-webkit-scrollbar { width: 4px; }
.card-body::-webkit-scrollbar-track { background: transparent; }
.card-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

.card-body.is-scrolled {
  box-shadow: inset 0 -8px 14px -8px rgba(0,0,0,.07);
}

/* Footer: sınırın dışında, her zaman görünür */
.card-footer {
  padding: 14px 22px 20px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--card);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.btn-oda-durum {
  width: 100%; height: 38px; border-radius: 12px; cursor: pointer;
  font-size: 12px; font-weight: 700; letter-spacing: .2px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--muted); border: 1px solid var(--border); color: var(--fg);
  font-family: inherit; transition: all .18s ease;
}
.btn-oda-durum:hover { background: var(--card-alt); border-color: var(--muted-fg); }

/* ─── Card header ─── */
.card-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  margin-bottom: 14px;
}
.card-title-group {}
.card-season-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase;
  color: var(--muted-fg); margin-bottom: 4px;
}
.card-title {
  font-size: 20px; font-weight: 900; letter-spacing: -.4px; color: var(--fg);
  line-height: 1.1;
}
.chip {
  font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  margin-top: 2px;
}
.chip-current {
  background: var(--accent-bg); color: var(--accent-fg);
}
.chip-next {
  background: var(--muted); color: var(--muted-fg);
}
.chip-past {
  background: var(--info-bg); color: var(--info);
}

/* ─── Primary stats (4-grid) ─── */
.stats-primary {
  display: grid; grid-template-columns: repeat(2,1fr); gap: 8px;
  margin-bottom: 8px;
}
.stat-box {
  background: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px 10px;
  position: relative; overflow: hidden;
  transition: background .18s ease;
}
.stat-box:hover { background: var(--card-alt); }
.stat-box::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--primary) var(--progress,0%), transparent 0%);
  opacity: .6;
}
.stat-label {
  font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: var(--muted-fg); margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px;
}
.stat-icon {
  width: 16px; height: 16px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--primary); opacity: .85;
}
.stat-icon svg { display: block; }
.stat-value {
  font-size: 22px; font-weight: 900; color: var(--fg); line-height: 1;
  animation: countUp .4s both;
  letter-spacing: -.5px;
  font-family: "DM Sans","Segoe UI",system-ui,sans-serif;
}
.stat-sub {
  font-size: 10px; color: var(--muted-fg); margin-top: 3px; font-weight: 500;
}

/* ─── Ratio strip ─── */
.ratio-strip {
  display: flex; gap: 6px; margin-bottom: 10px;
}
.ratio-pill {
  flex: 1; background: var(--muted); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 10px;
  display: flex; flex-direction: column; gap: 1px;
}
.ratio-pill-label {
  font-size: 9px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
  color: var(--muted-fg); line-height: 1.3;
}
.ratio-pill-val {
  font-size: 13px; font-weight: 900; color: var(--fg); letter-spacing: -.3px; margin-top: 1px;
}
.ratio-pill-val .unit {
  font-size: 9px; font-weight: 600; color: var(--muted-fg); margin-left: 2px; letter-spacing: 0;
  text-transform: none;
}

/* ─── Highlights bar ─── */
.highlights {
  display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;
}
.highlight-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--muted); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 12px;
}
.highlight-icon {
  flex-shrink: 0; width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--primary);
}
.highlight-icon svg { display: block; }
.highlight-text {
  flex: 1; min-width: 0;
  font-size: 11.5px; color: var(--fg); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.highlight-badge {
  flex-shrink: 0;
  font-size: 10px; font-weight: 800; letter-spacing: .3px;
  background: var(--accent-bg); color: var(--accent-fg);
  padding: 2px 7px; border-radius: 999px;
}

/* ─── Detail toggle ─── */
.detay-toggle {
  width: 100%; background: transparent; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: inherit; font-size: 11.5px; font-weight: 700;
  color: var(--muted-fg); padding: 10px 4px 14px;
  transition: color .15s ease;
}
.detay-toggle:hover { color: var(--primary); }
.detay-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
.chev { transition: transform .22s ease; font-size: 9px; display: inline-block; }
.detay-toggle.open .chev { transform: rotate(180deg); }

/* ─── Detail panel ─── */
.detay-panel {
  overflow: hidden; max-height: 0;
  transition: max-height .32s cubic-bezier(.4,0,.2,1), opacity .2s ease;
  opacity: 0; visibility: hidden;
}
.detay-panel.open { max-height: 1200px; opacity: 1; visibility: visible; }

.detay-inner {
  border-top: 1px solid var(--border);
  padding: 18px 22px 20px;
  display: flex; flex-direction: column; gap: 20px;
}

/* Tabbed detail */
.detay-tabs {
  display: flex; gap: 4px; margin-bottom: 14px;
}
.detay-tab {
  font-size: 11.5px; font-weight: 700; letter-spacing: .2px;
  padding: 5px 13px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted-fg); font-family: inherit;
  transition: all .15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.detay-tab svg { opacity: .8; }
.detay-tab:hover { color: var(--fg); border-color: var(--fg); }
.detay-tab.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.detay-tab.active svg { opacity: 1; }

.detay-section { display: none; }
.detay-section.visible { display: block; }

/* Bar list */
.bar-list { display: flex; flex-direction: column; gap: 6px; }
.bar-item {
  display: flex; align-items: center; gap: 10px;
}
.bar-rank {
  width: 18px; text-align: right;
  font-size: 10px; font-weight: 700; color: var(--muted-fg); flex-shrink: 0;
}
.bar-label {
  flex: 0 0 auto; min-width: 0; max-width: 130px;
  font-size: 11.5px; font-weight: 600; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar-track {
  flex: 1; height: 6px; background: var(--bar-bg);
  border-radius: 999px; overflow: hidden; min-width: 40px;
}
.bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--primary-glow));
  width: var(--w, 0%);
  animation: barGrow .6s cubic-bezier(.4,0,.2,1) both;
  animation-delay: var(--delay, 0ms);
}
.bar-nums {
  flex-shrink: 0; display: flex; gap: 6px; align-items: center;
  font-size: 10.5px;
}
.bar-num-main {
  font-weight: 800; color: var(--fg);
}
.bar-num-sub {
  font-size: 9.5px; color: var(--muted-fg);
}

/* Show more */
.show-more-btn {
  width: 100%; background: transparent; border: 1px dashed var(--border);
  border-radius: var(--radius-xs); padding: 6px; cursor: pointer;
  font-size: 11px; font-weight: 700; color: var(--muted-fg);
  font-family: inherit; transition: all .15s ease; margin-top: 6px;
}
.show-more-btn:hover { color: var(--primary); border-color: var(--primary); }

/* Stats detail grid */
.stats-detail-grid {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
}
.stat-detail-cell {
  background: var(--muted); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.stat-detail-label {
  font-size: 9.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
  color: var(--muted-fg); margin-bottom: 3px;
}
.stat-detail-val {
  font-size: 17px; font-weight: 900; color: var(--fg); letter-spacing: -.3px;
}
.stat-detail-val .unit {
  font-size: 11px; font-weight: 600; color: var(--muted-fg); margin-left: 2px;
}

/* Monthly distribution mini chart */
.mini-chart-wrap {
  background: var(--muted); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px;
}
.mini-chart-title {
  font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
  color: var(--muted-fg); margin-bottom: 12px;
}
.mini-chart {
  display: flex; align-items: flex-end; gap: 4px; height: 48px;
}
.mini-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mini-bar {
  width: 100%; border-radius: 3px 3px 0 0;
  background: var(--primary); opacity: .75;
  transition: opacity .15s ease; cursor: default;
  min-height: 2px;
  transform-origin: bottom center;
  animation: barGrowH .55s cubic-bezier(.4,0,.2,1) both;
}
.mini-bar:hover { opacity: 1; }
.mini-bar-label {
  font-size: 9px; font-weight: 600; color: var(--muted-fg);
  text-align: center;
}

/* ─── Empty card ─── */
.empty-body {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 32px 16px 24px; gap: 8px;
}
.empty-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--muted); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 6px; color: var(--primary); opacity: .8;
}
.empty-icon svg { display: block; }
.empty-title { font-size: 14px; font-weight: 800; color: var(--fg); }
.empty-sub   { font-size: 12px; color: var(--muted-fg); max-width: 28ch; }

/* ─── Buttons ─── */
.btn {
  width: 100%; height: 44px; border-radius: 12px; cursor: pointer;
  font-size: 13px; font-weight: 800; letter-spacing: .2px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: all .18s ease; font-family: inherit; border: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-glow));
  color: var(--primary-fg);
  box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 35%, transparent);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px color-mix(in srgb, var(--primary) 42%, transparent);
}
.btn-primary:active { transform: none; }
.btn-outline {
  border: 1.5px solid var(--primary) !important;
  background: transparent;
  color: var(--primary);
}
.btn-outline:hover {
  background: var(--primary);
  color: var(--primary-fg);
  transform: translateY(-1px);
}
.btn-ghost {
  background: var(--muted); border: 1px solid var(--border) !important;
  color: var(--fg);
}
.btn-ghost:hover { background: var(--card-alt); }

/* ─── Season progress bar ─── */
.season-progress {
  margin-bottom: 18px;
}
.season-progress-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10.5px; font-weight: 700; color: var(--muted-fg); margin-bottom: 6px;
}
.season-progress-track {
  height: 5px; background: var(--bar-bg); border-radius: 999px; overflow: hidden;
}
.season-progress-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--primary), var(--primary-glow));
  width: var(--w, 0%);
  animation: barGrow .8s cubic-bezier(.4,0,.2,1) .1s both;
}

/* ─── Others ─── */
.other-seasons {
  margin-top: 32px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 22px;
  box-shadow: var(--shadow-sm);
  animation: cardIn .55s .15s both;
}
.other-seasons-title {
  font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--muted-fg); margin-bottom: 12px;
}
.other-seasons-list {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.season-pill {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 14px;
  cursor: pointer; text-decoration: none;
  transition: all .18s ease;
}
.season-pill:hover {
  background: var(--accent-bg); border-color: var(--primary);
  transform: translateY(-1px);
}
.season-pill-name {
  font-size: 12px; font-weight: 700; color: var(--fg);
}
.season-pill-meta {
  font-size: 10px; color: var(--muted-fg); font-weight: 600;
}

/* ─── Footer ─── */
.footer-note {
  margin-top: 52px; text-align: center; font-size: 11px; color: var(--muted-fg);
  letter-spacing: .4px; animation: fadeInUp .5s .3s both;
}
.footer-note strong { color: var(--primary); font-weight: 800; }

/* ─── Empty state (no data) ─── */
.empty-global {
  margin-top: 44px; text-align: center; padding: 56px 24px;
  background: var(--card); border: 1px dashed var(--border);
  border-radius: var(--radius); color: var(--muted-fg); font-size: 13px;
  grid-column: 1 / -1;
  animation: popIn .4s .1s both;
}
.empty-global a { color: var(--primary); font-weight: 700; text-decoration: none; }

/* ─── Responsive ─── */
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  h1 { font-size: 24px; }
  .stats-primary { grid-template-columns: repeat(2,1fr); }
  .ratio-strip { flex-wrap: wrap; }
  .stats-detail-grid { grid-template-columns: repeat(2,1fr); }
  .bar-label { max-width: 90px; }
}
@media (max-width: 400px) {
  .stats-detail-grid { grid-template-columns: 1fr 1fr; }
  .ratio-strip { flex-direction: column; }
}

/* ─── Reduced motion ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ─── Focus styles ─── */
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
</style>

<script>
(function(){
  'use strict';

  /* ── Kapat butonu ── */
  var qs = new URLSearchParams(location.search);
  var isFirst = qs.get('first') === '1';
  var closeBtn = document.getElementById('closeBtn');
  if (isFirst) closeBtn.style.display = 'none';
  closeBtn.onclick = geriDon;

  function geriDon() {
    if (document.referrer && /turne/.test(document.referrer)) { history.back(); return; }
    location.href = 'turne.html';
  }

  /* ── Sezon yardımcıları ── */
  function tarihSezon(tarihStr) {
    if (!tarihStr) return null;
    var p = tarihStr.split('-');
    if (p.length < 3) return null;
    var yil = +p[0], ay = +p[1], gun = +p[2];
    var yeni = (ay > 8) || (ay === 8 && gun >= 15);
    return yeni ? yil + '-' + String(yil+1).slice(2) : (yil-1) + '-' + String(yil).slice(2);
  }
  function bugunYerel() {
    var d = new Date();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function guncelSezon() { return tarihSezon(bugunYerel()); }
  function birSonrakiSezon(s) {
    var p = (s || guncelSezon()).split('-');
    var y = +p[0]+1;
    return y + '-' + String(y+1).slice(2);
  }
  function sezonLabel(s) {
    if (!s) return '?';
    var p = s.split('-');
    return p[0] + '–' + (p[0].slice(0,2) + p[1]);
  }
  function sezonTamLabel(s) { return sezonLabel(s) + ' Sezonu'; }

  /* ── Sezon tarih aralığı (15 Ağ → 14 Ağ) ── */
  function sezonAralik(s) {
    var p = s.split('-');
    var bas = new Date(+p[0], 7, 15); // Ağustos = ay 7
    var bit = new Date(+p[0]+1, 7, 14);
    return { bas: bas, bit: bit };
  }

  /* ── Sezon ilerleme yüzdesi ── */
  function sezonIlerleme(s) {
    var ar = sezonAralik(s);
    var now = new Date();
    if (now < ar.bas) return 0;
    if (now > ar.bit) return 100;
    var total = ar.bit - ar.bas;
    return Math.round((now - ar.bas) / total * 100);
  }

  /* ── Aylık dağılım hesapla ── */
  function aylikDagilim(turneler, sezonId) {
    var aylar = {};
    turneler.forEach(function(t){
      if (tarihSezon(t.baslangicTarih || t.tarih) !== sezonId) return;
      var ayKey = (t.baslangicTarih || t.tarih || '').slice(0,7);
      if (!ayKey) return;
      if (!aylar[ayKey]) aylar[ayKey] = 0;
      if (t.programSatirlar && t.programSatirlar.length) {
        t.programSatirlar.forEach(function(x){ if (x.program === 'Oyun') aylar[ayKey] += x.saat2 ? 2 : 1; });
      } else if (t.duraklar && t.duraklar.length) {
        t.duraklar.forEach(function(d){ aylar[ayKey] += +d.sayi || 1; });
      } else { aylar[ayKey]++; }
    });
    return aylar;
  }

  /* ── En uzun turne (gün) ── */
  function enUzunTurne(turneler, sezonId) {
    var max = 0, maxAd = '';
    turneler.forEach(function(t){
      if (tarihSezon(t.baslangicTarih || t.tarih) !== sezonId) return;
      if (t.baslangicTarih && t.bitisTarih) {
        var d = Math.round((new Date(t.bitisTarih) - new Date(t.baslangicTarih)) / 86400000) + 1;
        if (d > max) { max = d; maxAd = t.oyun || '—'; }
      }
    });
    return { gun: max, oyun: maxAd };
  }

  /* ── Aktif ay sayısı ── */
  function aktifAySayisi(turneler, sezonId) {
    var aySet = {};
    turneler.forEach(function(t){
      if (tarihSezon(t.baslangicTarih || t.tarih) !== sezonId) return;
      var ay = (t.baslangicTarih || t.tarih || '').slice(0,7);
      if (ay) aySet[ay] = 1;
    });
    return Object.keys(aySet).length;
  }

  /* ── Haftalık ortalama ── */
  function haftalikOrt(temsil, gun) {
    if (!gun) return 0;
    return +(temsil / (gun / 7)).toFixed(1);
  }

  /* ── İstatistikleri yükle & hesapla ── */
  function loadStats() {
    var turneler = [];
    try { turneler = JSON.parse(localStorage.getItem('turne_cache_data') || '[]'); } catch(e) {}

    var pre = null;
    try { pre = JSON.parse(localStorage.getItem('_sezonOzet') || 'null'); } catch(e) {}
    if (pre && pre.sezonlar && pre.sezonlar.length) {
      // Mevcut önhesaplı veriye ek istatistikler ekle
      pre.sezonlar.forEach(function(st){
        var ayDag = aylikDagilim(turneler, st.id);
        var uzun  = enUzunTurne(turneler, st.id);
        st.aylikDagilim = ayDag;
        st.enUzunTurneGun = uzun.gun;
        st.enUzunTurneAd  = uzun.oyun;
        st.aktifAy  = aktifAySayisi(turneler, st.id);
        st.haftaOrt = haftalikOrt(st.temsil, st.gun);
      });
      return pre;
    }

    /* Yoksa sıfırdan hesapla */
    var map = {};
    function bosSezon() {
      return { turne:0, temsil:0, il:{}, araliklar:[], oyunMap:{}, ilMap:{} };
    }
    function artir(m, key, val) {
      if (!key) return;
      if (!m[key]) m[key] = { turne:0, temsil:0 };
      m[key].temsil += val;
    }
    turneler.forEach(function(t){
      if (t.anaGrupId) return;
      var s = tarihSezon(t.baslangicTarih || t.tarih);
      if (!s) return;
      if (!map[s]) map[s] = bosSezon();
      var S = map[s];
      S.turne++;
      try {
        var b = t.baslangicTarih ? new Date(t.baslangicTarih) : null;
        var e = t.bitisTarih ? new Date(t.bitisTarih) : b;
        if (b) { if (!e || e < b) e = b; S.araliklar.push([b.getTime(), e.getTime()]); }
      } catch(er) {}
      var oyunlarBT = {}, illerBT = {};
      if (t.programSatirlar && t.programSatirlar.length) {
        t.programSatirlar.forEach(function(x){
          if (x.program !== 'Oyun') return;
          var a = x.saat2 ? 2 : 1;
          S.temsil += a;
          var oyun = (x.oyun || t.oyun || '').trim();
          var il = (x.sehir || '').split('/')[0].trim().toLocaleUpperCase('tr');
          if (oyun) { artir(S.oyunMap, oyun, a); oyunlarBT[oyun]=1; }
          if (il)   { artir(S.ilMap,   il,   a); illerBT[il]=1; }
        });
      } else if (t.duraklar && t.duraklar.length) {
        t.duraklar.forEach(function(d){
          var a = +d.sayi || 1;
          S.temsil += a;
          var oyun = (d.oyun || t.oyun || '').trim();
          var il = (d.il||'').replace(/\/MERKEZ/gi,'').split('/')[0].trim().toLocaleUpperCase('tr');
          if (oyun) { artir(S.oyunMap, oyun, a); oyunlarBT[oyun]=1; }
          if (il)   { artir(S.ilMap,   il,   a); illerBT[il]=1; }
        });
        (t.duraklar||[]).forEach(function(d){
          if (!d.il) return;
          var k = d.il.toLocaleUpperCase('tr').replace(/\s+/g,'').replace(/\/MERKEZ/g,'').split('/')[0];
          if (k) S.il[k] = 1;
        });
      } else if (t.oyun) {
        S.temsil++;
        t.oyun.split('/').forEach(function(o){ var ot=o.trim(); if(ot){ artir(S.oyunMap, ot, 1); oyunlarBT[ot]=1; } });
      }
      Object.keys(oyunlarBT).forEach(function(k){ S.oyunMap[k].turne++; });
      Object.keys(illerBT).forEach(function(k){ S.ilMap[k].turne++; });
    });

    function benzersizGun(ar) {
      if (!ar.length) return 0;
      var a = ar.slice().sort(function(x,y){ return x[0]-y[0]; });
      var birl = [a[0].slice()];
      for (var i=1;i<a.length;i++){
        var son = birl[birl.length-1], cur = a[i];
        if (cur[0] <= son[1] + 86400000) { if (cur[1]>son[1]) son[1]=cur[1]; }
        else birl.push(cur.slice());
      }
      return birl.reduce(function(s,r){ return s + Math.round((r[1]-r[0])/86400000)+1; },0);
    }
    function sirali(m) {
      return Object.keys(m).map(function(k){ return { ad:k, turne:m[k].turne, temsil:m[k].temsil }; })
        .sort(function(a,b){ return b.temsil-a.temsil || b.turne-a.turne || a.ad.localeCompare(b.ad,'tr'); });
    }

    var guncel = guncelSezon();
    var sezonlar = Object.keys(map).map(function(s){
      var S = map[s];
      var gun = benzersizGun(S.araliklar);
      var ayDag = aylikDagilim(turneler, s);
      var uzun  = enUzunTurne(turneler, s);
      return {
        id: s,
        turne:  S.turne,
        temsil: S.temsil,
        il:     Object.keys(S.il).length || Object.keys(S.ilMap).length,
        gun:    gun,
        aktifAy:    aktifAySayisi(turneler, s),
        haftaOrt:   haftalikOrt(S.temsil, gun),
        enUzunTurneGun: uzun.gun,
        enUzunTurneAd:  uzun.oyun,
        aylikDagilim: ayDag,
        detay: { oyunlar: sirali(S.oyunMap), iller: sirali(S.ilMap) }
      };
    });
    return { sezonlar: sezonlar, guncel: guncel, sonraki: birSonrakiSezon(guncel) };
  }

  var _iconPaths = {

  function svgIcon(name, size) {
    size = size || 14;
    var p = _iconPaths[name] || '';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }

  /* ── HTML yardımcıları ── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmt(n) {
    if (n === undefined || n === null) return '0';
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  /* ── Bar listesi oluştur ── */
  function barListHTML(list, maxVal, limitDefault) {
    if (!list || !list.length) return '<p style="text-align:center;padding:20px 0;font-size:12px;color:var(--muted-fg)">Veri yok</p>';
    var limit = limitDefault || 8;
    var shown = list.slice(0, limit);
    var hidden = list.slice(limit);
    var html = '<div class="bar-list">';
    shown.forEach(function(x, i){
      var pct = maxVal > 0 ? Math.round(x.temsil / maxVal * 100) : 0;
      var delay = i * 40;
      html += '<div class="bar-item" role="listitem" aria-label="' + esc(x.ad) + ': ' + x.temsil + ' temsil, ' + x.turne + ' turne">' +
        '<span class="bar-rank" aria-hidden="true">' + (i+1) + '</span>' +
        '<span class="bar-label" title="' + esc(x.ad) + '">' + esc(x.ad) + '</span>' +
        '<div class="bar-track" role="presentation"><div class="bar-fill" style="--w:' + pct + '%;--delay:' + delay + 'ms" aria-hidden="true"></div></div>' +
        '<div class="bar-nums">' +
          '<span class="bar-num-main">' + fmt(x.temsil) + '</span>' +
          '<span class="bar-num-sub">temsil</span>' +
          '<span class="bar-num-main">' + x.turne + '</span>' +
          '<span class="bar-num-sub">turne</span>' +
        '</div>' +
      '</div>';
    });
    html += '</div>';
    if (hidden.length) {
      html += '<button class="show-more-btn" onclick="toggleMore(this)" data-more="hidden" aria-expanded="false">' +
        '+ ' + hidden.length + ' daha göster' +
      '</button>' +
      '<div class="more-rows" hidden style="margin-top:6px"><div class="bar-list">';
      hidden.forEach(function(x, i){
        var pct = maxVal > 0 ? Math.round(x.temsil / maxVal * 100) : 0;
        html += '<div class="bar-item">' +
          '<span class="bar-rank">' + (limit+i+1) + '</span>' +
          '<span class="bar-label" title="' + esc(x.ad) + '">' + esc(x.ad) + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="--w:' + pct + '%;--delay:0ms"></div></div>' +
          '<div class="bar-nums">' +
            '<span class="bar-num-main">' + fmt(x.temsil) + '</span>' +
            '<span class="bar-num-sub">temsil</span>' +
            '<span class="bar-num-main">' + x.turne + '</span>' +
            '<span class="bar-num-sub">turne</span>' +
          '</div>' +
        '</div>';
      });
      html += '</div></div>';
    }
    return html;
  }

  window.toggleMore = function(btn) {
    var moreDiv = btn.nextElementSibling;
    var isHidden = moreDiv.hidden;
    moreDiv.hidden = !isHidden;
    btn.setAttribute('aria-expanded', String(isHidden));
    btn.textContent = isHidden ? '▴ Daha azını göster' : '+ ' + moreDiv.querySelectorAll('.bar-item').length + ' daha göster';
  };

  /* ── Aylık mini çubuk grafik ── */
  function miniChartHTML(aylikDagilim) {
    if (!aylikDagilim || !Object.keys(aylikDagilim).length) return '';
    var aylar = Object.keys(aylikDagilim).sort();
    var maxVal = Math.max.apply(null, aylar.map(function(a){ return aylikDagilim[a]; }));
    var AY_ADLARI = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
    var html = '<div class="mini-chart-wrap">' +
      '<div class="mini-chart-title" id="chart-title-' + Math.random().toString(36).slice(2) + '">Aylık Temsil Dağılımı</div>' +
      '<div class="mini-chart" role="img" aria-label="Aylık temsil dağılımı grafiği">';
    aylar.forEach(function(ay, i){
      var val = aylikDagilim[ay];
      var pct = maxVal > 0 ? val / maxVal : 0;
      var barH = Math.max(4, Math.round(pct * 44));
      var ayNo = +ay.split('-')[1] - 1;
      var ayAd = AY_ADLARI[ayNo] || ay.slice(5);
      html += '<div class="mini-bar-col" title="' + ayAd + ': ' + val + ' temsil">' +
        '<div class="mini-bar" style="height:' + barH + 'px" aria-label="' + ayAd + ' ' + val + ' temsil"></div>' +
        '<span class="mini-bar-label">' + ayAd + '</span>' +
      '</div>';
    });
    html += '</div></div>';
    return html;
  }

  /* ── Tab sistemi — ARIA-tam, ok-tuşu navigasyonu ── */
  window.switchTab = function(btn) {
    var inner = btn.closest('.detay-inner');
    inner.querySelectorAll('.detay-tab').forEach(function(t){
      t.classList.remove('active');
      t.setAttribute('aria-selected','false');
      t.setAttribute('tabindex','-1');
    });
    inner.querySelectorAll('.detay-section').forEach(function(s){ s.classList.remove('visible'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    btn.setAttribute('tabindex','0');
    var target = btn.dataset.tab;
    var sec = inner.querySelector('[data-section="' + target + '"]');
    if (sec) sec.classList.add('visible');
    btn.focus();
  };

  /* Arrow-key navigation for tablist */
  document.addEventListener('keydown', function(e) {
    if (!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
    var tab = e.target;
    if (!tab.classList.contains('detay-tab')) return;
    e.preventDefault();
    var list = tab.closest('[role="tablist"]');
    if (!list) return;
    var tabs = Array.from(list.querySelectorAll('.detay-tab'));
    var idx = tabs.indexOf(tab);
    var next;
    if (e.key === 'ArrowRight') next = (idx + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') next = (idx - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') next = 0;
    else next = tabs.length - 1;
    window.switchTab(tabs[next]);
  });

      '<div class="card-footer">' +
        '<button class="btn btn-outline" data-action="go" aria-label="' + sezonTamLabel(st.id) + ' sayfasına git">Bu sezona git →</button>' +
        '<button class="btn-oda-durum" data-action="oda" aria-label="' + sezonTamLabel(st.id) + ' için oda eşleme durumu">🛏 Oda Eşleme Durumu</button>' +
      '</div>';
    }

    /* Event listener'lar */
    el.querySelectorAll('[data-action]').forEach(function(actionBtn){
      actionBtn.addEventListener('click', function(){
        if (this.dataset.action === 'oda') {
          location.href = 'oda-durum.html?sezon=' + encodeURIComponent(st.id);
          return;
        }
        sezonSec(st.id, this.dataset.action === 'new');
      });
    });
    var toggle = el.querySelector('.detay-toggle');
    if (toggle) {
      // start closed: inert + aria-hidden so nothing inside is keyboard-reachable
      var initPanel = document.getElementById(toggle.dataset.detay);
      if (initPanel) { initPanel.inert = true; initPanel.setAttribute('aria-hidden','true'); }
      toggle.addEventListener('click', function(){
        var panel = document.getElementById(this.dataset.detay);
        var willOpen = !panel.classList.contains('open');
        panel.classList.toggle('open', willOpen);
        this.classList.toggle('open', willOpen);
        this.setAttribute('aria-expanded', String(willOpen));
        this.querySelector('.txt').textContent = willOpen ? 'Daha azını göster' : 'Detaylı istatistikler';
        panel.inert = !willOpen;
        panel.setAttribute('aria-hidden', String(!willOpen));
      });
    }
    return el;
  }

  function statBoxHTML(label, val, iconName, ariaDesc) {
    return '<div class="stat-box" title="' + ariaDesc + '">' +
      '<div class="stat-label"><span class="stat-icon">' + svgIcon(iconName, 14) + '</span>' + label + '</div>' +
      '<div class="stat-value" aria-label="' + ariaDesc + ': ' + fmt(val) + '">' + fmt(val) + '</div>' +
    '</div>';
  }

  function detailCellHTML(label, val, unit) {
    return '<div class="stat-detail-cell">' +
      '<div class="stat-detail-label">' + esc(label) + '</div>' +
      '<div class="stat-detail-val">' + fmt(val) + (unit ? '<span class="unit">' + esc(unit) + '</span>' : '') + '</div>' +
    '</div>';
  }

  /* ── Ana render ── */
  function render() {
    var data   = loadStats();
    var guncel  = data.guncel  || guncelSezon();
    var sonraki = data.sonraki || birSonrakiSezon(guncel);
    var idx = {};
    data.sezonlar.forEach(function(x){ idx[x.id] = x; });

    var grid  = document.getElementById('grid');
    var other = document.getElementById('other');
    grid.innerHTML = '';
    other.innerHTML = '';

    if (!data.sezonlar.length && !localStorage.getItem('turne_cache_data')) {
      var emEl = document.createElement('div');
      emEl.className = 'empty-global';
      emEl.innerHTML = '<div style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:var(--muted);border:1px solid var(--border);border-radius:50%;margin-bottom:12px;color:var(--primary)">' + svgIcon('theater', 22) + '</div><br>Henüz turne verisi bulunamadı.<br><a href="turne.html">Turne Takip\'i aç</a> ve ilk turneni ekle — sonra buraya döndüğünde sezon istatistiklerin burada listelenecek.';
      grid.appendChild(emEl);
      return;
    }

    /* Önce güncel + sonraki sezonu göster */
    var onePlan = [guncel, sonraki];
    onePlan.forEach(function(sid, i){
      var st = idx[sid] || { id:sid, turne:0, temsil:0, il:0, gun:0, aktifAy:0, haftaOrt:0, detay:{oyunlar:[],iller:[]}, aylikDagilim:{} };
      var isG = sid === guncel;
      var isN = sid === sonraki;
      grid.appendChild(cardEl(st, i, isG, isN));
    });

    /* Geçmiş sezonlar */
    var others = data.sezonlar
      .filter(function(x){ return onePlan.indexOf(x.id) < 0; })
      .sort(function(a,b){ return a.id < b.id ? 1 : -1; });

    if (others.length) {
      var wrap = document.createElement('div');
      wrap.className = 'other-seasons';
      wrap.setAttribute('aria-label', 'Geçmiş sezonlar');
      var titleDiv = document.createElement('div');
      titleDiv.className = 'other-seasons-title';
      titleDiv.textContent = 'Geçmiş Sezonlar';
      wrap.appendChild(titleDiv);
      var list = document.createElement('div');
      list.className = 'other-seasons-list';
      others.forEach(function(x){
        var pill = document.createElement('button');
        pill.className = 'season-pill';
        pill.setAttribute('aria-label', sezonTamLabel(x.id) + ': ' + x.turne + ' turne, ' + x.temsil + ' temsil');
        pill.innerHTML = '<span class="season-pill-name">' + sezonLabel(x.id) + '</span>' +
          '<span class="season-pill-meta">' + x.turne + ' turne · ' + fmt(x.temsil) + ' temsil</span>';
        pill.addEventListener('click', function(){ sezonSec(x.id, false); });
        list.appendChild(pill);
      });
      wrap.appendChild(list);
      other.appendChild(wrap);
    }
  }

  function sezonSec(sid, yeniTurneMi) {
    try {
      localStorage.setItem('_secilSezon', sid);
      if (yeniTurneMi) localStorage.setItem('_sezonYeniTurne', '1');
    } catch(e) {}
    location.href = 'turne.html' + (yeniTurneMi ? '?yeniTurne=1' : '');
  }

  render();

  /* Kart gövdesi kaydırıldığında üst gölgeyi aç/kapat */
  document.querySelectorAll('.card-body').forEach(function(body) {
    body.addEventListener('scroll', function() {
      this.classList.toggle('is-scrolled', this.scrollTop > 4);
    }, { passive: true });
  });
})();
</script>
</body>
</html>
