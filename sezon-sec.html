<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sezon Seç · Turne Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"></noscript>
<script>
  // Tema tercihini ana site ile aynı anahtardan oku (_tema) — flash of wrong theme olmasın
  (function() {
    try {
      var t = localStorage.getItem('_tema') || 'light';
      if (t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch(e) {}
  })();
</script>
<style>
  :root {
    --background: hsl(36, 18%, 91%);
    --foreground: #2C2C2C;
    --border: hsl(36, 14%, 82%);
    --card: #ffffff;
    --card-elevated: hsl(36, 14%, 95%);
    --sidebar-primary: hsl(42, 88%, 52%);
    --primary: hsl(38, 78%, 42%);
    --primary-foreground: #fff;
    --muted: hsl(36, 14%, 91%);
    --muted-foreground: #5C5652;
    --accent: hsl(42, 60%, 88%);
    --accent-foreground: hsl(38, 70%, 20%);
    --shadow-card: 0 1px 4px rgba(30,20,10,.06), 0 8px 24px rgba(30,20,10,.06);
    --shadow-card-hover: 0 2px 8px rgba(30,20,10,.08), 0 18px 42px rgba(30,20,10,.12);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --background: hsl(222, 20%, 8%);
    --foreground: hsl(220, 15%, 96%);
    --border: hsl(222, 14%, 20%);
    --card: hsl(222, 17%, 11%);
    --card-elevated: hsl(222, 15%, 14%);
    --sidebar-primary: hsl(42, 92%, 55%);
    --primary: hsl(238, 75%, 68%);
    --primary-foreground: hsl(220, 20%, 8%);
    --muted: hsl(222, 14%, 14%);
    --muted-foreground: hsl(220, 12%, 58%);
    --accent: hsl(238, 28%, 22%);
    --accent-foreground: hsl(238, 85%, 82%);
    --shadow-card: 0 1px 4px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-card-hover: 0 2px 8px rgba(0,0,0,.35), 0 18px 42px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    font-family:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--background);
    color:var(--foreground);
    font-size:13px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"kern" 1, "liga" 1, "ss01";
    min-height:100dvh;
    transition:background-color .2s ease, color .15s ease;
  }
  .mono { font-family:"DM Mono","JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  .page {
    max-width:1080px;
    margin:0 auto;
    padding:clamp(28px,6vw,64px) clamp(18px,4vw,40px) 64px;
    animation:fadeInUp .45s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:none;} }
  @keyframes cardIn   { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
  @keyframes panelIn  { from { opacity:0; transform:translateY(-4px); max-height:0;} to { opacity:1; transform:none; max-height:600px;} }

  .head-row {
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    margin-bottom:6px;
  }
  .eyebrow {
    font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase;
    color:var(--muted-foreground);
  }
  h1 {
    font-size:clamp(22px,3.4vw,32px);
    font-weight:800;
    letter-spacing:-.8px;
    line-height:1.15;
    color:var(--foreground);
    margin-top:6px;
  }
  h1 em {
    font-style:normal;
    color:var(--primary);
    background:linear-gradient(180deg, transparent 62%, hsl(42,80%,55%,.35) 62%);
    padding:0 4px;
  }
  .subtitle {
    font-size:14px; color:var(--muted-foreground); margin-top:10px; max-width:52ch;
  }
  .close-btn {
    border:1px solid var(--border); background:var(--card);
    width:36px; height:36px; border-radius:10px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--muted-foreground); font-size:20px; line-height:1;
    transition:all .18s ease;
    flex-shrink:0;
  }
  .close-btn:hover { color:var(--foreground); border-color:var(--foreground); }

  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
    margin-top:32px;
    align-items:start;
  }
  .card {
    position:relative;
    background:var(--card);
    border:1px solid var(--border);
    border-left:5px solid var(--sidebar-primary);
    border-radius:var(--radius);
    padding:22px 22px 20px;
    box-shadow:var(--shadow-card);
    display:flex; flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, background-color .2s ease;
    animation:cardIn .5s both;
  }
  .card:hover { transform:translateY(-2px); box-shadow:var(--shadow-card-hover); }
  .card.empty { border-left-style:solid; border-style:dashed; border-left:5px solid var(--sidebar-primary); background:linear-gradient(180deg,var(--card),var(--card-elevated)); }

  .card-head {
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    margin-bottom:16px;
  }
  .card-title {
    font-size:17px; font-weight:800; letter-spacing:-.3px; color:var(--foreground);
  }
  .card-chip {
    font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
    padding:3px 8px; border-radius:999px;
    background:var(--accent); color:var(--accent-foreground);
    white-space:nowrap;
  }
  .card-chip.next { background:var(--muted); color:var(--muted-foreground); }

  .stats {
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
    margin-bottom:14px;
  }
  .stat {
    background:var(--muted);
    border-radius:10px;
    padding:10px 12px;
  }
  .stat-label {
    font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
    color:var(--muted-foreground);
  }
  .stat-value {
    font-size:24px; font-weight:800; color:var(--foreground); line-height:1.1; margin-top:2px;
  }

  .empty-body {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:26px 8px 22px; gap:6px;
  }
  .empty-title { font-size:14px; font-weight:700; color:var(--foreground); }
  .empty-sub   { font-size:12px; color:var(--muted-foreground); }

  .btn {
    width:100%; height:42px; border-radius:10px; cursor:pointer;
    font-size:13px; font-weight:700; letter-spacing:.2px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:all .18s ease;
    font-family:inherit;
  }
  .btn-primary {
    border:1.5px solid var(--primary);
    background:var(--primary);
    color:var(--primary-foreground);
  }
  .btn-primary:hover { filter:brightness(1.06); box-shadow:0 6px 16px hsl(38 72% 42% / .28); }
  .btn-outline {
    border:1.5px solid var(--primary);
    background:transparent;
    color:var(--primary);
  }
  .btn-outline:hover { background:var(--primary); color:var(--primary-foreground); }

  .detay-toggle {
    width:100%;
    background:transparent; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-family:inherit; font-size:11.5px; font-weight:700;
    color:var(--muted-foreground);
    padding:9px 4px 12px;
    transition:color .15s ease;
  }
  .detay-toggle:hover { color:var(--primary); }
  .detay-toggle .chev { transition:transform .2s ease; font-size:9px; }
  .detay-toggle.open .chev { transform:rotate(180deg); }

  .detay-panel {
    overflow:hidden;
    max-height:0;
    transition:max-height .28s ease;
  }
  .detay-panel.open { max-height:600px; }
  .detay-inner {
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    padding-top:2px; padding-bottom:14px;
  }
  .detay-col-title {
    font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:var(--muted-foreground); margin-bottom:7px;
  }
  .detay-list {
    max-height:220px; overflow-y:auto;
    border:1px solid var(--border); border-radius:8px;
    background:var(--card-elevated);
    scrollbar-width:thin; scrollbar-color:var(--border) transparent;
  }
  .detay-row {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 9px;
    border-bottom:1px solid var(--border);
    font-size:11px;
  }
  .detay-row:last-child { border-bottom:none; }
  .detay-name {
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:600; color:var(--foreground);
  }
  .detay-nums {
    flex-shrink:0; display:flex; gap:6px; align-items:baseline;
  }
  .detay-nums b { font-size:12px; color:var(--foreground); }
  .detay-nums span { font-size:9px; color:var(--muted-foreground); text-transform:uppercase; letter-spacing:.3px; }
  .detay-empty { padding:14px 10px; text-align:center; font-size:11px; color:var(--muted-foreground); }

  .other {
    margin-top:28px; text-align:center; font-size:12.5px; color:var(--muted-foreground);
  }
  .other a {
    color:var(--primary); text-decoration:none; font-weight:700;
    margin:0 6px; border-bottom:1px dashed transparent;
  }
  .other a:hover { border-bottom-color:var(--primary); }

  .footer-note {
    margin-top:44px; text-align:center; font-size:11px; color:var(--muted-foreground);
    letter-spacing:.4px;
  }

  .empty-state {
    margin-top:40px; text-align:center; padding:48px 20px;
    background:var(--card); border:1px dashed var(--border); border-radius:var(--radius);
    color:var(--muted-foreground); font-size:13px;
  }
  .empty-state a { color:var(--primary); font-weight:700; text-decoration:none; }

  @media (max-width:560px) {
    .grid { grid-template-columns:1fr; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .detay-inner { grid-template-columns:1fr; }
    h1 { font-size:22px; }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="head-row">
      <div>
        <div class="eyebrow">Turne Takip</div>
        <h1>Hangi <em>sezona</em> bakmak istersin?</h1>
        <p class="subtitle">Bir sezon seç — o sezonun turne listesine, haritasına ve takvimine anında geçersin.</p>
      </div>
      <button id="closeBtn" class="close-btn" title="Kapat" aria-label="Kapat">×</button>
    </div>

    <div id="grid" class="grid"></div>
    <div id="other" class="other"></div>

    <p class="footer-note">Turne Takip · Sezon 15 Ağustos'ta başlar</p>
  </main>

<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var isFirst = qs.get('first') === '1';

  // Kapat butonu davranışı
  var closeBtn = document.getElementById('closeBtn');
  if (isFirst) closeBtn.style.display = 'none';
  closeBtn.onclick = geriDon;

  function geriDon() {
    if (document.referrer && /turne/.test(document.referrer)) { history.back(); return; }
    location.href = 'turne.html';
  }

  // ---------- Sezon yardımcıları (turne.html ile birebir aynı kural) ----------
  function tarihSezon(tarihStr) {
    if (!tarihStr) return null;
    var p = tarihStr.split('-'); if (p.length<3) return null;
    var yil = +p[0], ay = +p[1], gun = +p[2];
    var yeniBasladi = (ay > 8) || (ay === 8 && gun >= 15);
    if (yeniBasladi) return yil + '-' + String(yil+1).slice(2);
    return (yil-1) + '-' + String(yil).slice(2);
  }
  function guncelSezon() { return tarihSezon(new Date().toISOString().slice(0,10)); }
  function birSonrakiSezon(s) {
    var p = (s||guncelSezon()).split('-');
    var y = +p[0]+1; return y + '-' + String(y+1).slice(2);
  }
  function sezonLabel(s) {
    if (!s) return '?';
    var p = s.split('-');
    return p[0] + '–' + (p[0].slice(0,2) + p[1]) + ' Sezonu';
  }

  // ---------- Veri kaynağı ----------
  // 1) Öncelik: turne.html'in yazdığı önhesaplanmış özet (detaylı oyun/il dökümü dahil)
  // 2) Yoksa turne_cache_data'dan hesapla
  function loadStats() {
    try {
      var pre = JSON.parse(localStorage.getItem('_sezonOzet') || 'null');
      if (pre && pre.sezonlar && pre.sezonlar.length) return pre;
    } catch(e) {}
    var turneler = [];
    try { turneler = JSON.parse(localStorage.getItem('turne_cache_data') || '[]'); } catch(e){}
    var map = {};
    function bosSezon() { return { turne:0, temsil:0, il:{}, araliklar:[], oyunMap:{}, ilMap:{} }; }
    function detayArtir(m, key, temsilArtis) {
      if (!key) return;
      if (!m[key]) m[key] = { turne:0, temsil:0 };
      m[key].temsil += temsilArtis;
    }
    turneler.forEach(function(t){
      if (t.anaGrupId) return;
      var s = tarihSezon(t.baslangicTarih || t.tarih);
      if (!s) return;
      if (!map[s]) map[s] = bosSezon();
      var S = map[s];
      S.turne++;
      // gün — aralığı biriktir, tekilleştirme render sırasında yapılacak (üst üste binen/ardışık turneler çift sayılmasın)
      try {
        var b = t.baslangicTarih ? new Date(t.baslangicTarih) : null;
        var e = t.bitisTarih ? new Date(t.bitisTarih) : b;
        if (b) { if (!e || e < b) e = b; S.araliklar.push([b.getTime(), e.getTime()]); }
      } catch(e){}
      // temsil (toplam) + oyun/il bazında detay
      var oyunlarBuTurne = {}, illerBuTurne = {};
      if (t.programSatirlar && t.programSatirlar.length) {
        t.programSatirlar.forEach(function(x){
          if (x.program !== 'Oyun') return;
          var artis = x.saat2 ? 2 : 1;
          S.temsil += artis;
          var oyunAdi = (x.oyun || t.oyun || '').trim();
          var ilAdi = (x.sehir || '').split('/')[0].trim().toLocaleUpperCase('tr');
          if (oyunAdi) { detayArtir(S.oyunMap, oyunAdi, artis); oyunlarBuTurne[oyunAdi]=1; }
          if (ilAdi) { detayArtir(S.ilMap, ilAdi, artis); illerBuTurne[ilAdi]=1; }
        });
      } else if (t.duraklar && t.duraklar.length) {
        t.duraklar.forEach(function(d){
          var artis = +d.sayi || 1;
          S.temsil += artis;
          var oyunAdi = (d.oyun || t.oyun || '').trim();
          var ilAdi = (d.il || '').replace(/\/MERKEZ/gi,'').split('/')[0].trim().toLocaleUpperCase('tr');
          if (oyunAdi) { detayArtir(S.oyunMap, oyunAdi, artis); oyunlarBuTurne[oyunAdi]=1; }
          if (ilAdi) { detayArtir(S.ilMap, ilAdi, artis); illerBuTurne[ilAdi]=1; }
        });
      } else if (t.oyun) {
        var artis2 = 1;
        S.temsil += artis2;
        t.oyun.split('/').forEach(function(o){ var ot=o.trim(); if(ot){ detayArtir(S.oyunMap, ot, artis2); oyunlarBuTurne[ot]=1; } });
      }
      Object.keys(oyunlarBuTurne).forEach(function(k){ S.oyunMap[k].turne++; });
      Object.keys(illerBuTurne).forEach(function(k){ S.ilMap[k].turne++; });
      // il seti (özet kutusu için)
      (t.duraklar || []).forEach(function(d){
        if (!d.il) return;
        var key = d.il.toLocaleUpperCase('tr').replace(/\s+/g,'').replace(/\/MERKEZ/g,'').split('/')[0];
        if (key) S.il[key] = 1;
      });
    });
    function benzersizGunSay(araliklar) {
      if (!araliklar.length) return 0;
      var a = araliklar.slice().sort(function(x,y){ return x[0]-y[0]; });
      var birl = [a[0]];
      for (var i=1;i<a.length;i++){
        var son = birl[birl.length-1], cur = a[i];
        if (cur[0] <= son[1] + 86400000) { if (cur[1] > son[1]) son[1] = cur[1]; }
        else birl.push(cur);
      }
      return birl.reduce(function(s2,r){ return s2 + Math.round((r[1]-r[0])/86400000) + 1; }, 0);
    }
    function siraliListe(m) {
      return Object.keys(m).map(function(k){ return { ad:k, turne:m[k].turne, temsil:m[k].temsil }; })
        .sort(function(a,b){ return b.temsil - a.temsil || b.turne - a.turne || a.ad.localeCompare(b.ad,'tr'); });
    }
    var sezonlar = Object.keys(map).map(function(s){
      var S = map[s];
      return {
        id:s, turne:S.turne, temsil:S.temsil, il:Object.keys(S.il).length, gun:benzersizGunSay(S.araliklar),
        detay: { oyunlar: siraliListe(S.oyunMap), iller: siraliListe(S.ilMap) }
      };
    });
    return { sezonlar:sezonlar, guncel:guncelSezon(), sonraki:birSonrakiSezon(guncelSezon()) };
  }

  function render() {
    var data = loadStats();
    var guncel = data.guncel || guncelSezon();
    var sonraki = data.sonraki || birSonrakiSezon(guncel);
    var idx = {};
    data.sezonlar.forEach(function(x){ idx[x.id] = x; });
    // Ana iki kart: bu sezon + sonraki
    var onePlan = [guncel, sonraki];
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    onePlan.forEach(function(sid, i){
      var st = idx[sid] || { id:sid, turne:0, temsil:0, il:0, gun:0, detay:{oyunlar:[],iller:[]} };
      grid.appendChild(cardEl(st, i, sid === guncel));
    });
    // Diğer sezonlar
    var others = data.sezonlar
      .filter(function(x){ return onePlan.indexOf(x.id) < 0; })
      .sort(function(a,b){ return a.id < b.id ? 1 : -1; });
    var other = document.getElementById('other');
    if (others.length) {
      other.innerHTML = '<span style="opacity:.7">Diğer sezonlar:</span> ' +
        others.map(function(x){ return '<a href="#" data-sid="'+x.id+'">'+sezonLabel(x.id)+'</a>'; }).join(' · ');
      other.querySelectorAll('a').forEach(function(a){
        a.addEventListener('click', function(e){ e.preventDefault(); sezonSec(a.dataset.sid); });
      });
    } else other.innerHTML = '';

    if (!data.sezonlar.length && !localStorage.getItem('turne_cache_data')) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Henüz turne verisi bulunamadı. <a href="turne.html">Turne Takip\'i aç</a> ve ilk turneni ekle — sonra buraya döndüğünde sezon istatistiklerin burada listelenecek.</div>';
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function detayListHTML(list, birim) {
    if (!list || !list.length) return '<div class="detay-empty">Veri yok</div>';
    return list.map(function(x){
      return '<div class="detay-row">' +
        '<div class="detay-name" title="'+esc(x.ad)+'">'+esc(x.ad)+'</div>' +
        '<div class="detay-nums mono">' +
          '<span><b>'+x.turne+'</b> trn</span>' +
          '<span><b>'+x.temsil+'</b> tms</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function cardEl(st, i, isGuncel) {
    var el = document.createElement('div');
    el.className = 'card' + (st.turne === 0 ? ' empty' : '');
    el.style.animationDelay = (i * 70) + 'ms';
    var detay = st.detay || { oyunlar:[], iller:[] };
    var detayId = 'detay-' + st.id.replace(/[^a-z0-9]/gi,'');

    if (st.turne === 0) {
      el.innerHTML =
        '<div class="card-head">' +
          '<div class="card-title">'+sezonLabel(st.id)+'</div>' +
          '<div class="card-chip '+(isGuncel?'':'next')+'">'+(isGuncel?'Bu sezon':'Yaklaşan')+'</div>' +
        '</div>' +
        '<div class="empty-body">' +
          '<div class="empty-title">Henüz turne yok</div>' +
          '<div class="empty-sub">Yeni sezonu ilk turneyle başlat</div>' +
        '</div>' +
        '<button class="btn btn-primary" data-action="new">+ Yeni turne ekle</button>';
    } else {
      el.innerHTML =
        '<div class="card-head">' +
          '<div class="card-title">'+sezonLabel(st.id)+'</div>' +
          '<div class="card-chip '+(isGuncel?'':'next')+'">'+(isGuncel?'Bu sezon':'Yaklaşan')+'</div>' +
        '</div>' +
        '<div class="stats">' +
          statBox('Turne',  st.turne)  +
          statBox('Temsil', st.temsil) +
          statBox('Şehir',  st.il)     +
          statBox('Gün',    st.gun)    +
        '</div>' +
        '<button class="detay-toggle" data-detay="'+detayId+'" type="button">' +
          '<span class="txt">Detaylı istatistik</span><span class="chev">▾</span>' +
        '</button>' +
        '<div class="detay-panel" id="'+detayId+'">' +
          '<div class="detay-inner">' +
            '<div>' +
              '<div class="detay-col-title">Oyun bazında</div>' +
              '<div class="detay-list">'+detayListHTML(detay.oyunlar)+'</div>' +
            '</div>' +
            '<div>' +
              '<div class="detay-col-title">Şehir bazında</div>' +
              '<div class="detay-list">'+detayListHTML(detay.iller)+'</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn-outline" data-action="go">Bu sezona git →</button>';
    }
    el.querySelector('[data-action]').addEventListener('click', function(){
      var action = this.dataset.action;
      if (action === 'new') sezonSec(st.id, true);
      else sezonSec(st.id, false);
    });
    var toggle = el.querySelector('.detay-toggle');
    if (toggle) {
      toggle.addEventListener('click', function(){
        var panel = document.getElementById(this.dataset.detay);
        var willOpen = !panel.classList.contains('open');
        panel.classList.toggle('open', willOpen);
        this.classList.toggle('open', willOpen);
        this.querySelector('.txt').textContent = willOpen ? 'Detayı gizle' : 'Detaylı istatistik';
      });
    }
    return el;
  }

  function statBox(label, val) {
    return '<div class="stat"><div class="stat-label">'+label+'</div>' +
           '<div class="stat-value mono">'+val+'</div></div>';
  }

  function sezonSec(sid, yeniTurneMi) {
    try {
      localStorage.setItem('_secilSezon', sid);
      if (yeniTurneMi) localStorage.setItem('_sezonYeniTurne', '1');
    } catch(e){}
    location.href = 'turne.html' + (yeniTurneMi ? '?yeniTurne=1' : '');
  }

  render();
})();
</script>
</body>
</html>
