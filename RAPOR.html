<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İzmir Devlet Tiyatrosu – Raporlar</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2433;--mut:#5d6778;--line:#dfe3ea;--acc:#8a1f3d;--soft:#f3e4e8;--head:#eef0f4}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--ink:#e8ebf0;--mut:#9aa4b5;--line:#2e3542;--acc:#e0839c;--soft:#3a2530;--head:#252b36}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Source Sans 3",system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0;font-weight:700}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
nav{display:flex;gap:4px;padding:12px 20px 0;overflow-x:auto}
nav button{border:0;background:none;padding:10px 16px;border-bottom:3px solid transparent;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{padding:16px 20px 40px;max-width:1200px;margin:0 auto}
.drop{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--mut);background:var(--card)}
.drop b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.chips span{background:var(--soft);color:var(--acc);padding:2px 10px;border-radius:99px;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:6px 0 14px}
.bar label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:160px}
.bar .sp{flex:1}
.sum{font-weight:600;margin:0 0 8px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--head);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--mut)}
.sub{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:99px;font-weight:600;cursor:pointer;color:var(--mut)}
.sub button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#pr{display:none}
.mg{width:52px;text-align:center}
.mgb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:16px}
.mgb:hover{border-color:var(--acc)}
.mt{display:none}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.md[hidden]{display:none}
.mc{background:var(--card);color:var(--ink);border-radius:14px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh b{font-size:18px}
.mh div div{color:var(--mut);font-size:14px}
.cnt{padding:10px 16px 0;font-size:14px;color:var(--mut)}
.mb{overflow:auto;padding:8px 16px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.pp b{font-weight:600}
.pp span{color:var(--mut);font-size:14px}
.pp em{grid-column:1/-1;font-size:13px;color:var(--acc);font-style:normal}
.mf{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);justify-content:flex-end}
.sh{display:none}
.bar .act{display:flex;gap:10px}
.btn.more{display:block;margin:12px auto}
.sheet{width:186mm;background:#fff;color:#000;font-family:Arial,"Segoe UI",Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;border-bottom:.8mm solid #000;padding-bottom:2.5mm;margin-bottom:2mm}
.sheet .org{font-size:9pt;font-weight:700;letter-spacing:.02em}
.sheet h2{font-size:16pt;margin:1mm 0 0;font-weight:700;line-height:1.15}
.sheet .sm{font-size:10pt;font-weight:700;text-align:right}
.sheet .meta{font-size:8.5pt;color:#333;margin-bottom:3mm}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--pfs,9pt);line-height:1.25}
.sheet th,.sheet td{border:.25mm solid #666;padding:1.1mm 1.8mm;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.sheet th{background:#e4e4e4;font-weight:700}
.sheet tbody tr:nth-child(even) td{background:#f4f4f4}
.sheet .c{text-align:center}
.sheet tr{break-inside:avoid}
.sheet thead{display:table-header-group}
@media print{
  body>*:not(#pr){display:none!important}
  html,body{background:#fff!important}
  #pr{display:block}
  @page{size:A4 portrait;margin:12mm;@bottom-right{content:"Sayfa " counter(page) " / " counter(pages);font-size:8pt;color:#444}}
}
@media (max-width:700px){
  body{padding-bottom:84px}
  header{padding:10px 14px}
  h1{font-size:17px}
  h1 small{display:none}
  nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 12px 0;overflow:visible}
  nav button{padding:11px 2px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;color:var(--ink)}
  nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .lg{display:none}
  .sh{display:inline}
  main{padding:10px 12px 20px}
  .chips{font-size:12px;margin-bottom:6px}
  .bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bar label{min-width:0}
  .bar .sr{grid-column:1/-1}
  .bar input,.bar select{width:100%;min-width:0;font-size:16px;padding:11px 10px}
  .bar .clr{grid-column:1/-1;padding:10px}
  .bar .sp{display:none}
  .act{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
  .act .btn{flex:1;padding:13px 8px;font-size:16px}
  .btn.more{width:100%;padding:13px}
  .wrap{border:0;background:none;max-height:none;overflow:visible}
  .wrap table,.wrap thead,.wrap tbody,.wrap tr,.wrap td{display:block;width:100%}
  .wrap thead{display:none}
  .wrap tr{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .wrap td{border:0;padding:2px 0;display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:15px}
  .wrap td::before{content:attr(data-l);color:var(--mut);font-size:13px}
  .wrap td:empty{display:none}
  .wrap td.t{order:-1;display:block;font-size:17px;font-weight:700;padding-bottom:4px}
  .wrap td.t::before,.wrap td.empty::before{content:none}
  .wrap td.empty{display:block}
  .wrap td.mg{order:9;display:block;padding-top:8px;width:100%;text-align:left}
  .wrap td.mg::before{content:none}
  .wrap .mgb{width:100%;padding:11px;font-size:16px}
  .mt{display:inline}
  .md{padding:0;align-items:flex-end}
  .mc{max-height:94vh;border-radius:14px 14px 0 0}
  .mf .btn{flex:1;padding:12px 8px}
  .pp{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>İzmir Devlet Tiyatrosu<small>Raporlar · salt okunur</small></h1>
  <div>
    <input type="file" id="fl" accept=".xlsx,.xls" multiple hidden>
    <button class="btn main" id="lv" onclick="loadLive(true)" hidden>Güncelle</button>
    <button class="btn" id="fb" onclick="fl.click()">Excel dosyalarını aç</button>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div class="chips" id="chips"></div>
  <div id="app"></div>
</main>
<div id="pr"></div>
<div id="md" class="md" hidden onclick="if(event.target===this)closeMd()"></div>

<script>
/* ---- VERİ KAYNAĞI -------------------------------------------------
   Canlı veri: iki Vercel backend'inden SADECE OKUMA (GET) yapılır.
   Aşağıdaki iki adresi doldur (örn. "https://xxxx.vercel.app", sonunda / olmadan).
   Boş bırakılırsa Excel dosyası yükleme yolu kullanılır. */
const BACKENDS = {
  tiyatro: "https://tiyatro-backend.vercel.app",  /* BÜTÜN OYUNLAR, FİGÜRAN LİSTESİ */
  turne: "https://turne-backend.vercel.app"       /* TURNE_KAYITLARI */
};
/* Sadece bu sekmeler okunur; KULLANICILAR gibi diğer sekmelere hiç istek atılmaz. */
const LIVE = [
  {be: 'tiyatro', sheet: 'FİGÜRAN LİSTESİ', key: 'fig',   ok: r => r['Kişi']},
  {be: 'tiyatro', sheet: 'BÜTÜN OYUNLAR',   key: 'kadro', ok: r => r['Oyun Adı'] && r['Kişi']},
  {be: 'turne',   sheet: 'TURNE_KAYITLARI', key: 'turne', ok: r => r['Oyun Adı'] && r['Şehir/İl']}
];
const DB = {fig:[], turne:[], kadro:[], aylik:[], haftalik:[]};
const LOADED = {};

/* Yalnız gerçekleşmiş turneler: Tamamlandı ve Yarıda kesildi. Taslak ve İptal hiçbir raporda yer almaz. */
const TURNE_OK = r => !/taslak|iptal/.test(tr(r['Statü']));
const STAT = {tamamlandi:'Tamamlandı', taslak:'Taslak', 'yarida-kesildi':'Yarıda kesildi', iptal:'İptal'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tr = s => String(s ?? '').toLocaleLowerCase('tr');
/* Tarih: Excel'den Date, Sheets API'den "2026-03-09" veya "09.03.2026" metni gelebilir */
const toDate = v => {
  if (v instanceof Date) return new Date(v.getTime() + 432e5);
  let m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  m = String(v || '').match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  return m ? new Date(Date.UTC(+m[3], +m[2] - 1, +m[1])) : null;
};
const fmt = v => {
  const x = toDate(v);
  if (!x) return v || '';
  return String(x.getUTCDate()).padStart(2,'0') + '.' + String(x.getUTCMonth()+1).padStart(2,'0') + '.' + x.getUTCFullYear();
};
const parts = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);

/* ---- RAPOR TANIMLARI ---------------------------------------------- */
const REPORTS = {
  fig: {
    s: 'Figüran', t: 'Ad soyad',
    w: [6,24,36,34],
    title: 'Figüran listesi', db: 'fig', multi: ['Oyun'],
    filters: ['Oyun'],
    map: r => ({'Sıra': r['Sıra No'], 'Ad soyad': r['Kişi'], 'Görevler': r['Görevler'], 'Oyun': r['Görev Aldığı Oyunlar']}),
    sum: rows => rows.length + ' figüran'
  },
  turne: {
    s: 'Turne', t: 'Oyun',
    w: [20,11,9,9,7,10,18,16],
    title: 'Turne raporu', db: 'turne', filters: ['Oyun', 'Durum'],
    map: r => Object.defineProperty({'Oyun': r['Oyun Adı'], 'İl': r['Şehir/İl'], 'Başlangıç': fmt(r['Başlangıç Tarihi']), 'Bitiş': fmt(r['Bitiş Tarihi']),
      'Temsil': Number(r['Temsil Sayısı']) || 0, 'Durum': STAT[r['Statü']] || r['Statü'], 'Mekan': r['Sahne/Mekan'], 'Otel': r['Otel Adı']}, '_r', {value: r}),
    sum: rows => {
      const il = new Set(); rows.forEach(r => parts(r['İl']).forEach(i => il.add(i)));
      return rows.length + ' turne · ' + rows.reduce((a, r) => a + r['Temsil'], 0) + ' temsil · ' + il.size + ' il';
    }
  },
  tkisi: {
    s: 'İş yükü', t: 'Kişi',
    w: [34,22,12,12,10,10],
    title: 'Turne iş yükü', db: 'turne', filters: ['Sezon', 'Oyun', 'Kişi', 'Kategori'], pre: ['Sezon', 'Oyun'], desc: ['Sezon'], multi: ['Kategori'],
    rawMap: r => ({...r, 'Sezon': sezonOf(r['Başlangıç Tarihi']), 'Oyun': r['Oyun Adı']}),
    prep: aggTurneKisi, detail: true, dl: 'Turneler', dtip: 'Turnelerini gör',
    sum: rows => rows.length + ' kişi · ' + rows.reduce((a, r) => a + r['Turne'], 0) + ' turne katılımı'
  },
  kadro: {
    s: 'Kadro', t: 'Kişi',
    w: [26,15,26,21,12],
    title: 'Oyun kadrosu', db: 'kadro', filters: ['Oyun', 'Kategori'],
    map: r => ({'Oyun': r['Oyun Adı'], 'Kategori': r['Kategori'], 'Görev': r['Görev'], 'Kişi': r['Kişi'], 'Turneye gider': r['Turneye Gider']}),
    sum: rows => new Set(rows.map(r => r['Kişi'])).size + ' kişi · ' + rows.length + ' görev'
  },
  gorev: {
    s: 'Görev', t: 'Kişi',
    w: [20,13,20,8,39],
    title: 'Görev bazlı', db: 'kadro', filters: ['Görev', 'Kategori'], prep: byGorev,
    sum: rows => new Set(rows.map(r => r['Görev'])).size + ' görev · ' + new Set(rows.map(r => r['Kişi'])).size + ' kişi'
  },
  kisi: {
    s: 'Kişi', t: 'Kişi',
    w: [20,8,14,27,31],
    title: 'Kişi bazlı', db: 'kadro', filters: ['Kişi', 'Kategori', 'Oyunlar'], multi: ['Kategori', 'Oyunlar'], prep: byKisi,
    sum: rows => rows.length + ' kişi'
  },
  aylik: {
    s: 'Aylık', t: 'Oyun',
    w: [34,10,56],
    title: 'Aylık program', db: 'aylik', filters: ['Ay', 'Sahne', 'Oyun'], pre: ['Ay', 'Sahne'], keep: ['Ay'],
    prep: aggAylik, detail: true, dl: 'Temsiller', dtip: 'Temsilleri gör',
    empty: 'Kesinleştirilmiş aylık program bulunamadı.<br>Aylık Program sayfasında bir ayı “Kesinleştir” ile yayınlayınca burada görünür.',
    sum: rows => rows.length + ' oyun · ' + rows.reduce((a, r) => a + r['Temsil'], 0) + ' temsil'
  },
  haftalik: {
    s: 'Haftalık', t: 'Kişi',
    w: [22,34,14,14,16],
    title: 'Haftalık program', db: 'haftalik', filters: ['Birim', 'Hafta', 'Kişi'], pre: ['Birim', 'Hafta'], keep: ['Hafta'],
    prep: aggHaftalik, detail: true, dl: 'Çalışmalar', dtip: 'Çalışmaları gör',
    empty: 'Onaylanmış haftalık program bulunamadı.<br>Haftalık Program sayfasında “✔ Haftalığı Onayla” denince hafta burada görünür.',
    sum: rows => rows.length + ' kişi · ' + new Set(rows.map(r => r['Birim'])).size + ' birim · ' + rows.reduce((a, r) => a + r['Görev'], 0) + ' görev'
  }
};
/* Aylık ve Haftalık raporlar tek “Programlar” başlığı altında toplanır */
const GROUPS = {trn: {t: 'Turne', s: 'Turne', tabs: ['turne', 'tkisi']}, prog: {t: 'Programlar', s: 'Program', tabs: ['aylik', 'haftalik']}};
const GSEL = {trn: 'turne', prog: 'aylik'}; /* her grupta en son açık sekme */
const groupOf = k => Object.keys(GROUPS).find(g => GROUPS[g].tabs.includes(k));

/* Sahne Yönetimi kategorisindeki Sahne Amirlerini ayrı kategoriye alır (Süflör vb. olduğu gibi kalır) */
const ayirSahneAmiri = r => (tr(r['Kategori']).includes('sahne') && tr(r['Görev']).includes('amir')) ? {...r, 'Kategori': 'Sahne Amirleri'} : r;

/* Kadro satırlarını görev veya kişi başına toplar (virgülle yazılmış çoklu isimler ayrılır) */
const srt = a => a.sort((x, y) => String(x).localeCompare(String(y), 'tr'));
function byGorev(raw) {
  const m = new Map();
  raw.forEach(r => parts(r['Kişi']).forEach(p => {
    const k = r['Görev'] + '|' + p;
    if (!m.has(k)) m.set(k, {g: r['Görev'], c: r['Kategori'], p, o: new Set()});
    m.get(k).o.add(r['Oyun Adı']);
  }));
  return [...m.values()]
    .sort((a, b) => String(a.g).localeCompare(String(b.g), 'tr') || a.p.localeCompare(b.p, 'tr'))
    .map(x => ({'Görev': x.g, 'Kategori': x.c, 'Kişi': x.p, 'Oyun sayısı': x.o.size, 'Oyunlar': srt([...x.o]).join(', ')}));
}
function byKisi(raw) {
  const m = new Map();
  raw.forEach(r => parts(r['Kişi']).forEach(p => {
    if (!m.has(p)) m.set(p, {o: new Set(), g: new Set(), c: new Set()});
    const x = m.get(p); x.o.add(r['Oyun Adı']); x.g.add(r['Görev']); x.c.add(r['Kategori']);
  }));
  return srt([...m.keys()]).map(p => {
    const x = m.get(p);
    return {'Kişi': p, 'Oyun sayısı': x.o.size, 'Kategori': srt([...x.c]).join(', '),
      'Görevler': srt([...x.g]).join(', '), 'Oyunlar': srt([...x.o]).join(', ')};
  });
}

/* ---- AYLIK PROGRAM (yalnızca KESİNLEŞTİRİLMİŞ aylar) ---------------
   Aylık Program sayfasında “Kesinleştir” denince ay ortak sunucuya “apub_<ay>_<zaman>” satırlarıyla yazılır;
   kesinleştirme geri alınınca bu satırlar silinir. Taslak (“adraft_”) satırları okunmaz. */
const AY_SHEET = 'AYLIK PROGRAM';
const AY_ADLARI = ['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
function b64ToUtf8(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
/* E-Tablonun 1. satırı başlık sanılıp kayıt kaybolmasın: veri gibi görünen başlık satırını geri ekle */
const sheetRows = d => { const r = (d && d.rows) || [], h = d && d.headers; return Array.isArray(h) && /^(apub|hpub)_/.test(String(h[0] || '')) ? [h].concat(r) : r; };
function aylikRows(raw) {
  const groups = new Map();
  raw.forEach(row => {
    const id = String(row[0] || '');
    if (!id.startsWith('apub_')) return;
    if (!groups.has(id)) groups.set(id, {ts: +row[1] || 0, parts: []});
    groups.get(id).parts.push(row);
  });
  const bySlug = new Map();
  for (const [id, g] of groups) {
    const mm = id.match(/^apub_(.+)_(\d+)$/); if (!mm) continue;
    const ex = bySlug.get(mm[1]);
    if (!ex || g.ts > ex.ts) bySlug.set(mm[1], g); /* her ayın en güncel sürümü */
  }
  const months = [];
  for (const g of bySlug.values()) {
    const parts = g.parts.slice().sort((a, b) => (+a[2] || 0) - (+b[2] || 0));
    const total = +parts[0][3] || parts.length;
    if (parts.length < total) continue; /* parça eksik: güvenilmez, atla */
    try { months.push({ts: g.ts, d: JSON.parse(b64ToUtf8(parts.slice(0, total).map(r => String(r[4] || '')).join('')))}); } catch (e) {}
  }
  const sk = m => {
    const t = tr(m.d.month && m.d.month.name).split(/\s+/), i = AY_ADLARI.indexOf(t[0]), y = parseInt(t[1], 10);
    return i >= 0 && y ? y * 12 + i : 1e9 + m.ts;
  };
  months.sort((a, b) => sk(a) - sk(b));
  return months.flatMap(m => monthToRows(m.d));
}
/* Ad karşılaştırması: Aylık Program'daki normNameKey ile aynı (İ/I, Ş, Ğ… farkları ve fazla boşluk yok sayılır) */
const nn = s => String(s || '').replace(/\u00A0/g, ' ').replace(/[İIı]/g, 'I').replace(/i/g, 'I').replace(/[Şş]/g, 'S').replace(/[Ğğ]/g, 'G')
  .replace(/[Üü]/g, 'U').replace(/[Öö]/g, 'O').replace(/[Çç]/g, 'C').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
/* Hücre metninden oyun adı + not (Aylık Program'daki parseGame ile aynı mantık) */
function parseKey(txt) {
  let body = String(txt || '').trim().replace(/^\*\s*/, '');
  const notes = [];
  body = body.replace(/[(\[][^)\]]*[)\]]/g, x => { notes.push(x.replace(/^[(\[]|[)\]]$/g, '').trim()); return ' '; });
  const dash = body.match(/\s[-–—]\s*(\S.*)$/);
  if (dash) { notes.push(dash[1].trim()); body = body.slice(0, dash.index); }
  return {key: body.replace(/\s+/g, ' ').trim(), notes: notes.filter(Boolean)};
}
/* Bir ayın TEMSİLLERİ: Aylık Program'ın “gösterim” kuralıyla birebir —
   boş hücre, serbest metin (turne başlığı, “(…)”, “// …”), “PRÖMİYER” etiketi, arşiv oyun ve turne dönüş günü SAYILMAZ. */
function monthToRows(d) {
  const m = d.month; if (!m || !m.rows) return [];
  const cells = {};
  if (Array.isArray(m.cells)) m.cells.forEach(([r, c, v]) => { cells[r + '_' + c] = {v: String(v)}; });
  else Object.assign(cells, m.cells || {});
  const merges = m.merges || [];
  const covered = (r, c) => merges.some(([r1, c1, r2, c2]) => r >= r1 && r <= r2 && c >= c1 && c <= c2 && !(r === r1 && c === c1));
  const val = (r, c) => String((cells[r + '_' + c] || {}).v || '');
  const dateOf = r => {
    const v = val(r, 0); if (/\d/.test(v)) return v;
    for (const [r1, c1, r2] of merges) if (c1 === 0 && r >= r1 && r <= r2) return val(r1, 0);
    return '';
  };
  const arch = new Set((d.playsArchived || []).map(x => nn(parseKey(x).key || x)).filter(Boolean));
  const out = [];
  for (let r = 2; r < m.rows; r++) {
    const tarih = dateOf(r);
    for (let c = 2; c < m.cols - 1; c++) {
      if (covered(r, c)) continue;
      const cell = cells[r + '_' + c] || {}, raw = String(cell.v || '').trim();
      if (!raw || cell.archive || cell.tourReturn || cell.tourHead || cell.tourLeg) continue; /* turne başlığı / durak / dönüş günü temsil değildir */
      const free = cell.notFree ? false : (!!cell.freeText || /^(\/\/|#|!|>|\+)/.test(raw) || /^\(.*\)$/.test(raw) || /^\[.*\]$/.test(raw));
      if (free) continue;
      const u = raw.toLocaleUpperCase('tr'); if (u === 'PRÖMİYER' || u === '* PRÖMİYER' || u === '*PRÖMİYER') continue;
      const g = parseKey(raw); if (!g.key || arch.has(nn(g.key))) continue;
      const rng = raw.match(/(\d{1,2})[.:](\d{2})\s*[-–]\s*(\d{1,2})[.:](\d{2})/);
      const one = raw.match(/(\d{1,2})[.:](\d{2})/) || val(r, 1).match(/(\d{1,2})[.:](\d{2})/);
      const saat = rng ? rng[1].padStart(2, '0') + '.' + rng[2] + '–' + rng[3].padStart(2, '0') + '.' + rng[4]
        : one ? one[1].padStart(2, '0') + '.' + one[2] : '';
      const notes = g.notes.slice(); if (raw.startsWith('*') || cell.premiere) notes.unshift('Prömiyer'); if (cell.note) notes.push(String(cell.note));
      out.push({'Ay': m.name, 'Tarih': tarih || ('Satır ' + (r + 1)), 'Saat': saat,
        'Sahne': val(1, c).trim().toLocaleUpperCase('tr') || ('Sütun ' + (c + 1)), 'Oyun': g.key, 'Not': notes.join(' · ')});
    }
  }
  return out;
}

/* ---- HAFTALIK PROGRAM (yalnızca ONAYLANMIŞ haftalar) ---------------
   Haftalık Program sayfasında “✔ Haftalığı Onayla” denince hafta “HAFTALIK PROGRAM” sekmesine
   “hpub_<birim>_<pazartesi>_<zaman>” kaydı olarak yazılır; onay geri alınınca kayıt silinir.
   Taslak/eşitleme kayıtları (hweek_, hdel_, hmeta_, hstaff_) okunmaz. */
const HF_SHEET = 'HAFTALIK PROGRAM';
const HF_BIRIM = {dekor: 'Dekor Aksesuar', kondvit: 'Kondüvit', isik: 'Işık', erkek: 'Erkek Terzi', kadin: 'Kadın Terzi', peruka: 'Peruka'};
function haftalikRows(raw) {
  const groups = new Map();
  raw.forEach(row => {
    const id = String(row[0] || '');
    if (!id.startsWith('hpub_')) return;
    if (!groups.has(id)) groups.set(id, []);
    groups.get(id).push(row);
  });
  const best = new Map(); /* birim + hafta başına en güncel EKSİKSİZ onay */
  for (const [id, rs] of groups) {
    const m = id.match(/^hpub_([a-z]+)_(\d{4}-\d{2}-\d{2})_(\d+)$/); if (!m) continue;
    const total = +rs[0][3] || rs.length;
    if (new Set(rs.map(r => +r[2])).size < total) continue; /* parça eksik: güvenilmez, atla */
    const k = m[1] + '|' + m[2], ts = +m[3], c = best.get(k);
    if (!c || ts > c.ts) best.set(k, {unit: m[1], week: m[2], ts, rs});
  }
  const order = Object.keys(HF_BIRIM), list = [];
  for (const b of best.values()) {
    let o; try { o = JSON.parse(b64ToUtf8(b.rs.slice().sort((x, y) => x[2] - y[2]).map(x => String(x[4] || '')).join(''))); } catch (e) { continue; }
    if (o && o.doc && Array.isArray(o.doc.days)) list.push({...b, o});
  }
  list.sort((a, b) => b.week.localeCompare(a.week) || order.indexOf(a.unit) - order.indexOf(b.unit)); /* yeni hafta üstte */
  const out = [];
  list.forEach(({unit, week, o}) => o.doc.days.forEach(day => (day.rows || []).forEach(row => {
    const c = row.cells || {}, t = k => (c[k] && !c[k].skip && String(c[k].t || '').trim()) || '';
    if (!t('time') && !t('place') && !t('task') && !t('ppl')) return;
    out.push({'Birim': HF_BIRIM[unit] || o.unit || unit, 'Hafta': o.label || week, 'Tarih': day.label || '',
      'Saat': t('time'), 'Yer': t('place'), 'Yapılacak iş': t('task'), 'Görevliler': t('ppl')});
  })));
  return out;
}

    if (!res.ok) throw new Error('HTTP ' + res.status);

/* ---- Programlar: özet (oyun başına temsil / kişi başına çalışma) ---- */
const sorTr = (a, b) => String(a).localeCompare(String(b), 'tr');
function aggAylik(raw) {
  const m = new Map();
  raw.forEach(r => {
    const k = nn(r['Oyun']); if (!m.has(k)) m.set(k, {name: r['Oyun'], list: [], st: new Map()});
    const o = m.get(k), g = String(r['Sahne']).includes('TURNE') ? 'TURNE' : r['Sahne'];
    o.list.push(r); o.st.set(g, (o.st.get(g) || 0) + 1);
  });
  return [...m.values()].sort((a, b) => b.list.length - a.list.length || sorTr(a.name, b.name)).map(o => {
    const row = {'Oyun': o.name, 'Temsil': o.list.length,
      'Sahne dağılımı': [...o.st].sort((a, b) => b[1] - a[1]).map(([k, n]) => k + ' ' + n).join(' · ')};
    return Object.defineProperty(row, '_d', {value: {
      title: o.name + ' – temsiller', w: [32, 12, 32, 24], sum: x => x.length + ' temsil',
      sub: o.list.length + ' temsil · ' + o.st.size + ' sahne · ' + new Set(o.list.map(r => r['Ay'])).size + ' ay',
      rows: o.list.map(r => ({'Tarih': r['Tarih'], 'Saat': r['Saat'], 'Sahne': r['Sahne'], 'Not': r['Not']}))}});
  });
}
function aggHaftalik(raw) {
  const m = new Map(), ord = Object.values(HF_BIRIM), split = s => String(s || '').split(/\s*[–—,]\s*|\s*-\s*/).map(x => x.trim()).filter(Boolean);
  raw.forEach(r => split(r['Görevliler']).forEach(p => {
    const k = r['Birim'] + '|' + nn(p);
    if (!m.has(k)) m.set(k, {birim: r['Birim'], name: p, list: [], days: new Set(), weeks: new Set()});
    const o = m.get(k); o.list.push(r); o.days.add(r['Hafta'] + '|' + r['Tarih']); o.weeks.add(r['Hafta']);
  }));
  return [...m.values()].sort((a, b) => ord.indexOf(a.birim) - ord.indexOf(b.birim) || b.days.size - a.days.size || sorTr(a.name, b.name)).map(o => {
    const row = {'Birim': o.birim, 'Kişi': o.name, 'Çalışılan gün': o.days.size, 'Görev': o.list.length, 'Hafta sayısı': o.weeks.size};
    return Object.defineProperty(row, '_d', {value: {
      title: o.name + ' – ' + o.birim, w: [18, 22, 9, 20, 31], sum: x => x.length + ' görev',
      sub: o.days.size + ' gün · ' + o.list.length + ' görev · ' + o.weeks.size + ' hafta',
      rows: o.list.map(r => ({'Hafta': r['Hafta'], 'Tarih': r['Tarih'], 'Saat': r['Saat'], 'Yer': r['Yer'], 'Yapılacak iş': r['Yapılacak iş']}))}});
  });
}

/* Sezon: Eylül–Ağustos (Turne Takip ile aynı sınır) */
function sezonOf(v) {
  const d = toDate(v); if (!d) return '';
  const y = d.getUTCFullYear(), m = d.getUTCMonth();
  return m >= 8 ? y + '–' + (y + 1) : (y - 1) + '–' + y;
}
/* Kişi başına turne iş yükü: katıldığı turne, temsil, gün (çakışan günler bir kez), il */
function aggTurneKisi(raw) {
  const m = new Map(), DAY = 864e5;
  raw.forEach((r, ti) => {
    let ppl = []; try { ppl = JSON.parse(r['Katılımcılar'] || '[]'); } catch (e) {}
    ppl.forEach(x => {
      const name = String(x.kisi || '').trim(); if (!name) return;
      const k = nn(name); if (!m.has(k)) m.set(k, {name, cat: new Set(), t: new Map()});
      const o = m.get(k); if (x.kategori) o.cat.add(x.kategori);
      if (!o.t.has(ti)) o.t.set(ti, {r, notes: new Set()});
      const e = o.t.get(ti);
      if (x.gorev) e.notes.add(x.gorev);
      if (x.dis) e.notes.add('Dış katılımcı'); if (x.erkenAyrildi) e.notes.add('Erken ayrıldı'); if (x.gecAyrildi) e.notes.add('Geç ayrıldı');
    });
  });
  const span = r => { const a = toDate(r['Başlangıç Tarihi']), b = toDate(r['Bitiş Tarihi']) || a; return a ? [a.valueOf(), Math.max(a.valueOf(), b.valueOf())] : null; };
  return [...m.values()].map(o => {
    const list = [...o.t.values()], iv = list.map(e => span(e.r)).filter(Boolean).sort((a, b) => a[0] - b[0]);
    let days = 0, cur = null; /* aralık birleştirme: çakışan günler iki kez sayılmaz */
    iv.forEach(([a, b]) => { if (cur && a <= cur[1] + DAY) cur[1] = Math.max(cur[1], b); else { if (cur) days += (cur[1] - cur[0]) / DAY + 1; cur = [a, b]; } });
    if (cur) days += (cur[1] - cur[0]) / DAY + 1;
    const il = new Set(); list.forEach(e => parts(e.r['Şehir/İl']).forEach(i => il.add(i)));
    const temsil = list.reduce((a, e) => a + (Number(e.r['Temsil Sayısı']) || 0), 0);
    const row = {'Kişi': o.name, 'Kategori': srt([...o.cat]).join(', '), 'Turne': list.length, 'Temsil': temsil, 'Gün': Math.round(days), 'İl sayısı': il.size};
    const det = list.slice().sort((a, b) => (toDate(b.r['Başlangıç Tarihi']) || 0) - (toDate(a.r['Başlangıç Tarihi']) || 0)).map(e => ({
      'Oyun': e.r['Oyun Adı'], 'İl': e.r['Şehir/İl'],
      'Tarih': fmt(e.r['Başlangıç Tarihi']) + (e.r['Bitiş Tarihi'] && fmt(e.r['Bitiş Tarihi']) !== fmt(e.r['Başlangıç Tarihi']) ? ' – ' + fmt(e.r['Bitiş Tarihi']) : ''),
      'Temsil': Number(e.r['Temsil Sayısı']) || 0, 'Durum': STAT[e.r['Statü']] || e.r['Statü'], 'Not': [...e.notes].join(' · ')}));
    return Object.defineProperty(row, '_d', {value: {title: o.name + ' – turneler', w: [24,22,20,8,12,14], sum: x => x.length + ' turne',
      sub: list.length + ' turne · ' + temsil + ' temsil · ' + Math.round(days) + ' gün · ' + il.size + ' il', rows: det}});
  }).sort((a, b) => b['Turne'] - a['Turne'] || b['Gün'] - a['Gün'] || sorTr(a['Kişi'], b['Kişi']));
}

async function readFiles(files) {
  for (const f of files) {
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array', cellDates:true});
    for (const n of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:''});
      const name = n.trim();
      if (name === 'FİGÜRAN LİSTESİ') put('fig', rows.filter(r => r['Kişi']), f.name);
      else if (name === 'TURNE_KAYITLARI') put('turne', rows.filter(r => r['Oyun Adı'] && r['Şehir/İl']), f.name);
      else if (name === 'BÜTÜN OYUNLAR') put('kadro', rows.filter(r => r['Oyun Adı'] && r['Kişi']), f.name);
    }
  }
  render();
}
function put(key, rows, file) {
  if (rows.length > DB[key].length) { DB[key] = rows; LOADED[key] = file; }
}
async function loadLive(fresh) {
  const btn = document.getElementById('lv'), err = [];
  btn.disabled = true; btn.textContent = 'Yükleniyor…';
  await Promise.all([loadAylik(fresh, err), loadHaftalik(fresh, err), ...LIVE.map(async L => {

      const url = BACKENDS[L.be] + '/api/sheets/' + encodeURIComponent(L.sheet) + (L.be === 'tiyatro' && fresh ? '?fresh=1' : '');
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      const rows = (d.rows || []).map(r => Object.fromEntries((d.headers || []).map((h, i) => [h, r[i] ?? ''])));
      DB[L.key] = rows.filter(L.ok); LOADED[L.key] = 'canlı';
    } catch (e) { err.push(L.sheet + ': ' + e.message); }
  })]);
  btn.disabled = false; btn.textContent = 'Güncelle';
  LIVE_INFO = err.length ? 'Okunamadı → ' + err.join(' · ') : 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
  render();
}

let OVR = null, MD = null, LAST = [];
function view() {
  if (OVR) return OVR;
  const R = REPORTS[tab], S = ST[tab];
  let raw = DB[R.db].slice();
  if (R.db === 'turne') raw = raw.filter(TURNE_OK); /* taslak ve iptal edilen turneler raporlarda görünmez */
  if (R.rawMap) raw = raw.map(R.rawMap);
  if (R.db === 'kadro') raw = raw.map(ayirSahneAmiri);
  if (tab === 'turne') { const t = r => (toDate(r['Başlangıç Tarihi']) || 0).valueOf(); raw.sort((a, b) => t(b) - t(a)); }
  const pre = R.pre || [], optsPre = {};
  pre.forEach(k => { const set = new Set(); raw.forEach(r => r[k] && set.add(r[k])); optsPre[k] = (R.keep || []).includes(k) ? [...set] : (R.desc || []).includes(k) ? [...set].sort(sorTr).reverse() : [...set].sort(sorTr); });
  raw = raw.filter(r => pre.every(k => !S.f[k] || r[k] === S.f[k])); /* temsil/çalışma sayıları seçime göre yeniden hesaplanır */
  const all = R.prep ? R.prep(raw) : raw.map(R.map);
  const opts = {};
  R.filters.forEach(k => {
    if (pre.includes(k)) { opts[k] = optsPre[k]; return; }
    const set = new Set(); all.forEach(r => (R.multi && R.multi.includes(k) ? parts(r[k]) : [r[k]]).forEach(v => v && set.add(v)));
    opts[k] = (R.keep || []).includes(k) ? [...set] : [...set].sort((a, b) => a.localeCompare(b, 'tr'));
  });
  const rows = all.filter(r =>
    R.filters.every(k => pre.includes(k) || !S.f[k] || (R.multi && R.multi.includes(k) ? parts(r[k]).includes(S.f[k]) : r[k] === S.f[k])) &&
    (!S.q || tr(Object.values(r).join(' ')).includes(tr(S.q))));
  return {R, S, all, rows, opts};
}

  app.innerHTML = sub + `
    <div class="bar">
      <label class="sr">Ara<input id="q" type="search" value="${esc(S.q)}" placeholder="İsim, oyun, il…"></label>

  const q = document.getElementById('q');
  q.oninput = () => { S.q = q.value; S.n = 100; const p = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(p, p); };
}

/* ---- ÇIKTILAR ----------------------------------------------------- */
const today = () => new Date().toLocaleDateString('tr-TR');
function filterText() {
  const {S} = view();
  const f = Object.entries(S.f).filter(([, v]) => v).map(([k, v]) => k + ': ' + v);
  if (S.q) f.push('Arama: ' + S.q);
  return 'Tarih: ' + today() + (f.length ? ' · ' + f.join(' · ') : '');
}
function toExcel() {
  const {R, rows} = view();
  if (!rows.length) return alert('Aktarılacak kayıt yok.');
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k => ({wch: Math.min(50, Math.max(k.length, ...rows.map(r => String(r[k] ?? '').length)) + 2)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, R.title.replace(/[\\/?*\[\]:]/g, ' ').slice(0, 30));
  XLSX.writeFile(wb, R.title.replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}
/* ---- Turne katılımcı penceresi (🔍) ---- */
function showTurne(i) {
  const L = LAST[i], r = L._r;
  let ppl = [];
  try { ppl = JSON.parse(r['Katılımcılar'] || '[]'); } catch (e) {}
  const rows = ppl.map(x => ({'Kişi': x.kisi || '', 'Görev': x.gorev || '', 'Kategori': x.kategori || '',
    'Not': [x.oyun, x.dis ? 'Dış katılımcı' : '', x.erkenAyrildi ? 'Erken ayrıldı' : '', x.gecAyrildi ? 'Geç ayrıldı' : ''].filter(Boolean).join(' · ')}));
  const tarih = L['Başlangıç'] + (L['Bitiş'] && L['Bitiş'] !== L['Başlangıç'] ? ' – ' + L['Bitiş'] : '');
  MD = {R: {title: L['Oyun'] + ' – ' + L['İl'] + ' (' + tarih + ')', w: [32, 32, 18, 18], sum: x => x.length + ' kişi'}, rows, S: {q: '', f: {}}};
  const by = {}; rows.forEach(x => { const k = x['Kategori'] || 'Diğer'; by[k] = (by[k] || 0) + 1; });
  const cnt = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, n]) => k + ' ' + n).join(' · ');
  const md = document.getElementById('md');
  md.innerHTML = `<div class="mc" role="dialog" aria-modal="true" aria-label="Turne katılımcıları">
    <div class="mh"><div><b>${esc(L['Oyun'])}</b><div>${esc(L['İl'])} · ${esc(tarih)} · ${esc(L['Temsil'])} temsil · ${esc(L['Durum'])}</div>
      <div>${esc([L['Mekan'], L['Otel']].filter(Boolean).join(' · '))}</div></div>
      <button class="btn" onclick="closeMd()">Kapat</button></div>
    <div class="cnt"><b>${rows.length} kişi</b>${cnt ? ' — ' + esc(cnt) : ''}</div>
    <div class="mb">${rows.length ? rows.map(x => `<div class="pp"><b>${esc(x['Kişi'])}</b><span>${esc(x['Görev'])}${x['Kategori'] ? ' · ' + esc(x['Kategori']) : ''}</span>${x['Not'] ? `<em>${esc(x['Not'])}</em>` : ''}</div>`).join('')
      : '<p class="empty">Bu turne için katılımcı kaydı yok.</p>'}</div>
    <div class="mf"><button class="btn" onclick="modalOut('x')">Excel indir</button><button class="btn main" onclick="modalOut('p')">PDF al / Yazdır</button></div></div>`;
  md.hidden = false;
}
/* Oyun (temsiller) veya kişi (çalışmalar) için ayrıntı penceresi */
function showDetail(i) {
  const D = LAST[i]._d, cols = Object.keys(D.rows[0] || {}), ctr = new Set(['Saat', 'Temsil']);
  MD = {R: {title: D.title, w: D.w, sum: D.sum}, rows: D.rows, S: {q: '', f: {}}};
  const md = document.getElementById('md');
  md.innerHTML = `<div class="mc" role="dialog" aria-modal="true" aria-label="${esc(D.title)}">
    <div class="mh"><div><b>${esc(D.title)}</b><div>${esc(D.sub)}</div></div><button class="btn" onclick="closeMd()">Kapat</button></div>
    <div class="mb">${D.rows.length ? `<table><thead><tr><th>#</th>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${D.rows.map((r, n) =>
      `<tr><td>${n + 1}</td>${cols.map(c => `<td${ctr.has(c) ? ' class="c"' : ''}>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p class="empty">Kayıt yok.</p>'}</div>
    <div class="mf"><button class="btn" onclick="modalOut('x')">Excel indir</button><button class="btn main" onclick="modalOut('p')">PDF al / Yazdır</button></div></div>`;
  md.hidden = false;
}
function closeMd() { document.getElementById('md').hidden = true; }
function modalOut(k) { OVR = MD; try { k === 'x' ? toExcel() : toPdf(); } finally { OVR = null; } }
addEventListener('keydown', e => { if (e.key === 'Escape') closeMd(); });

/* PDF: ekrandaki tablo basılmaz; ayrı bir A4 dikey "sayfa" (#pr) kurulur.
   Kısa listeler tek sayfaya sığacak en büyük yazıyla (10→7,5 pt), uzun listeler 9 pt ile
   birden çok sayfaya yazılır (başlık her sayfada tekrar eder, satır ortadan bölünmez). */
function sheetHtml(fs) {
  const {R, rows} = view();
  const cols = Object.keys(rows[0]);
  const ctr = new Set(['Sıra', 'Temsil', 'Oyun sayısı', 'Turneye gider', 'Saat', 'Temsil', 'Çalışılan gün', 'Görev', 'Hafta sayısı', 'Turne', 'Gün', 'İl sayısı']);
  const cls = c => ctr.has(c) ? ' class="c"' : '';
  return `<div class="sheet" style="--pfs:${fs}pt">
    <div class="hd"><div><div class="org">İZMİR DEVLET TİYATROSU MÜDÜRLÜĞÜ</div><h2>${esc(R.title)}</h2></div><div class="sm">${esc(R.sum(rows))}</div></div>
    <div class="meta">${esc(filterText())}</div>
    <table><colgroup>${cols.map((c, i) => `<col style="width:${(R.w || [])[i] || 100 / cols.length}%">`).join('')}</colgroup>
    <thead><tr>${cols.map(c => `<th${cls(c)}>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => `<td${cls(c)}>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function toPdf() {
  if (!view().rows.length) return alert('Yazdırılacak kayıt yok.');
  const pr = document.getElementById('pr');
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;left:-9999px;height:262mm'; /* sayfa 273 mm, altta güvenlik payı */
  document.body.append(probe);
  const limit = probe.offsetHeight; probe.remove();
  pr.style.cssText = 'display:block;position:absolute;left:-9999px;top:0';
  let fs = 0;
  for (let s = 10; s >= 7.5; s -= 0.5) {
    pr.innerHTML = sheetHtml(s);
    if (pr.offsetHeight <= limit) { fs = s; break; }
  }
  if (!fs) pr.innerHTML = sheetHtml(9);
  pr.style.cssText = '';
  window.print(); /* Yazdır penceresinde “PDF olarak kaydet” seçilir */
}

const LIVE_ON = BACKENDS.tiyatro && BACKENDS.turne;
document.getElementById('lv').hidden = !LIVE_ON;
render();
if (LIVE_ON) loadLive(false); /* ilk açılışta cache'li okuma: Sheets kotasını yormaz */
</script>
