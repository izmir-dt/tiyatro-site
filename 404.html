<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // GitHub Pages SPA redirect
      var seg = window.location.pathname.split('/').slice(0,2).join('/');
      // seg = /tiyatro-site
      var path = window.location.pathname.replace(seg, '') || '/';
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.redirect = seg + path + search + hash;
      window.location.replace(seg + '/');
    </script>
  </head>
  <body>Yönlendiriliyor...</body>
</html>
