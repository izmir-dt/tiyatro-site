<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1"/>
<title>Turne Yönetimi — İzmir Devlet Tiyatrosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0EB; --fg: #2C2C2C; --border: #DDD8CF; --card: #FFFFFF;
  --primary: #C9922A; --primary-fg: #fff;
  --muted: #EDE8E1; --muted-fg: #8B6560;
  --success: hsl(142,55%,32%); --warn: hsl(42,85%,42%); --danger: hsl(0,68%,46%);
  --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--fg);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font-family:'Poppins',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'Poppins',sans-serif;outline:none}

/* ── TOP BAR ── */
.topbar{background:hsl(10,55%,22%);color:#F5E6C8;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;safe-area-inset-top:env(safe-area-inset-top)}
.topbar-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.topbar-sub{font-size:10px;opacity:.65;font-weight:500}
.topbar-btn{background:rgba(255,255,255,.12);border:none;color:#F5E6C8;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ── TABS ── */
.tab-bar{background:hsl(10,55%,22%);display:flex;padding:0 8px 8px;gap:4px;flex-shrink:0}
.tab-btn{flex:1;padding:8px 4px;border:none;background:transparent;color:rgba(245,230,200,.55);font-size:11px;font-weight:700;font-family:'Poppins',sans-serif;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab-btn svg{opacity:.6;transition:opacity .15s}
.tab-btn.active{background:rgba(255,255,255,.15);color:#F5E6C8}
.tab-btn.active svg{opacity:1}

/* ── PANELS ── */
.panel{flex:1;overflow-y:auto;display:none;flex-direction:column}
.panel.active{display:flex}

/* ── FILTERS ── */
.filters{padding:12px 14px 8px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.search-wrap{position:relative}
.search-inp{width:100%;height:40px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px 0 36px;font-size:13px;background:var(--card);color:var(--fg)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted-fg);pointer-events:none}
.filter-chips{display:flex;gap:6px;overflow-x:hidden;flex-wrap:wrap;padding-bottom:2px}

.fchip{flex-shrink:0;height:30px;padding:0 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);color:var(--muted-fg);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.fchip.active{border-color:var(--primary);background:hsl(38,90%,96%);color:var(--primary)}
.fchip[data-val='taslak'].active{border-color:#94a3b8;background:#f1f0f5;color:#5b5675}
.fchip[data-val='onay-bekliyor'].active{border-color:#f5c842;background:#fef8ec;color:#92570a}
.fchip[data-val='onaylandi'].active{border-color:#6ee0a0;background:#edfaf3;color:#146c38}
.fchip[data-val='tamamlandi'].active{border-color:#7fb0f5;background:#eaf2ff;color:#1748c4}
.fchip[data-val='iptal'].active{border-color:#f08080;background:#fff0f0;color:#a81a1a}
.fchip .fdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── TURNE LIST ── */
.turne-list{padding:0 14px 20px;display:flex;flex-direction:column;gap:10px}
.tcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:transform .1s,box-shadow .1s;active:scale(.98)}
.tcard:active{transform:scale(.985);box-shadow:0 1px 6px rgba(0,0,0,.1)}
.tcard-accent{height:4px;background:var(--primary)}
.tcard-body{padding:12px 14px}
.tcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.tcard-oyun{font-size:14px;font-weight:800;color:var(--fg);line-height:1.3;flex:1;margin-right:8px}
.tcard-statu{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.tcard-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tcard-meta-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted-fg);font-weight:500}
.tcard-meta-item svg{flex-shrink:0;opacity:.7}
.tcard-actions{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--muted)}
.tcard-act-btn{flex:1;height:32px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted-fg);font-size:11px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}
.tcard-act-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}

/* ── EMPTY STATE ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:10px;color:var(--muted-fg);text-align:center;flex:1}
.empty-icon{font-size:42px;margin-bottom:4px}
.empty-title{font-size:15px;font-weight:700;color:var(--fg)}
.empty-desc{font-size:12px;line-height:1.6}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin-bottom:8px}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px) + 12px);right:16px;width:52px;height:52px;background:var(--primary);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(201,146,42,.45);z-index:100;border:none;cursor:pointer;transition:transform .15s}
.fab:active{transform:scale(.93)}

/* ── TAKVIM ── */
.cal-wrap{padding:12px 14px 80px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-month-lbl{font-size:15px;font-weight:800}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-dow-cell{text-align:center;font-size:10px;font-weight:700;color:var(--muted-fg);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{min-height:52px;border-radius:8px;background:var(--card);border:1px solid var(--border);padding:4px;cursor:pointer;transition:background .1s;display:flex;flex-direction:column;gap:2px}
.cal-day:active{background:hsl(38,40%,95%)}
.cal-day.other-month{opacity:.3;pointer-events:none;background:transparent;border-color:transparent}
.cal-day.today .cal-day-num{background:var(--primary);color:#fff;border-radius:50%}
.cal-day-num{font-size:11px;font-weight:700;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.cal-event-dot{width:5px;height:5px;border-radius:50%;background:var(--primary);flex-shrink:0}
.cal-events-row{display:flex;gap:2px;flex-wrap:wrap}

/* ── DETAIL SHEET ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0}
.sheet-header{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border)}
.sheet-title{font-size:16px;font-weight:800;line-height:1.3;flex:1;margin-right:12px}
.sheet-close{width:30px;height:30px;border-radius:8px;background:var(--muted);border:none;color:var(--muted-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.sheet-body{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.sheet-section{display:flex;flex-direction:column;gap:6px}
.sheet-section-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted-fg)}
.sheet-row{display:flex;align-items:center;gap:8px;font-size:13px}
.sheet-row svg{flex-shrink:0;color:var(--muted-fg)}
.sheet-footer{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;gap:8px}
.sheet-btn{flex:1;height:42px;border-radius:10px;font-size:13px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--border);background:var(--card);color:var(--fg);transition:all .15s}
.sheet-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.sheet-btn.danger{border-color:var(--danger);color:var(--danger)}

/* ── MODAL (Add/Edit) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-height:95dvh;display:flex;flex-direction:column;animation:slideUp .25s ease}
.modal-header{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-size:16px;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:8px;background:var(--muted);border:none;color:var(--muted-fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-body{overflow-y:auto;flex:1;padding:16px}
.modal-footer{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.modal-btn{flex:1;height:44px;border-radius:11px;font-size:14px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--fg);transition:all .15s}
.modal-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.modal-btn:disabled{opacity:.5;pointer-events:none}

/* ── FORM FIELDS ── */
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.5px}
.form-label span{color:var(--danger)}
.form-input,.form-select,.form-textarea{width:100%;height:42px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-size:14px;font-family:'Poppins',sans-serif;background:var(--card);color:var(--fg);transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary)}
.form-textarea{height:80px;padding:10px 12px;resize:none}
.form-input.error{border-color:var(--danger)}
.form-error{font-size:11px;color:var(--danger);font-weight:600}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statu-chips{display:flex;gap:6px;flex-wrap:wrap}
.statu-chip{height:32px;padding:0 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:11px;font-weight:700;font-family:'Poppins',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;color:var(--muted-fg)}
.statu-chip.active-taslak{border-color:#94a3b8;background:#f1f0f5;color:#5b5675}
.statu-chip.active-onay{border-color:#f5c842;background:#fef8ec;color:#92570a}
.statu-chip.active-onaylandi{border-color:#6ee0a0;background:#edfaf3;color:#146c38}
.statu-chip.active-tamamlandi{border-color:#7fb0f5;background:#eaf2ff;color:#1748c4}
.statu-chip.active-iptal{border-color:#f08080;background:#fff0f0;color:#a81a1a}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;font-size:12px;font-weight:600;padding:10px 18px;border-radius:10px;z-index:999;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:hsl(142,55%,28%)}
.toast.error{background:hsl(0,68%,42%)}
.toast.warn{background:hsl(38,80%,38%)}

/* ── STATU COLORS ── */
.s-taslak{background:#f1f0f5;color:#5b5675}
.s-onay-bekliyor{background:#fef8ec;color:#92570a}
.s-onaylandi{background:#edfaf3;color:#146c38}
.s-tamamlandi{background:#eaf2ff;color:#1748c4}
.s-iptal{background:#fff0f0;color:#a81a1a}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-title">Turne Yönetimi</div>
    <div class="topbar-sub">İzmir Devlet Tiyatrosu</div>
  </div>
  <button class="topbar-btn" onclick="yenile()" title="Yenile">
    <svg id="refresh-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-liste" onclick="switchTab('liste')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Turneler
  </button>
  <button class="tab-btn" id="tab-takvim" onclick="switchTab('takvim')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Takvim
  </button>
</div>

<!-- PANEL: LİSTE -->
<div class="panel active" id="panel-liste">
  <div class="filters">
    <div class="search-wrap">
      <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-inp" id="search-inp" type="search" placeholder="Oyun, şehir ara..." oninput="renderListe()">
    </div>
    <div class="filter-chips" id="statu-chips">
      <button class="fchip active" data-val="" onclick="setStatuFiltre('',this)">Tümü</button>
      <button class="fchip" data-val="taslak" onclick="setStatuFiltre('taslak',this)"><span class="fdot" style="background:#94a3b8"></span>Taslak</button>
      <button class="fchip" data-val="onay-bekliyor" onclick="setStatuFiltre('onay-bekliyor',this)"><span class="fdot" style="background:#f5c842"></span>Onay Bekliyor</button>
      <button class="fchip" data-val="onaylandi" onclick="setStatuFiltre('onaylandi',this)"><span class="fdot" style="background:#6ee0a0"></span>Onaylandı</button>
      <button class="fchip" data-val="tamamlandi" onclick="setStatuFiltre('tamamlandi',this)"><span class="fdot" style="background:#7fb0f5"></span>Tamamlandı</button>
      <button class="fchip" data-val="iptal" onclick="setStatuFiltre('iptal',this)"><span class="fdot" style="background:#f08080"></span>İptal</button>
    </div>
  </div>
  <div class="turne-list" id="turne-list"></div>
</div>

<!-- PANEL: TAKVİM -->
<div class="panel" id="panel-takvim">
  <div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="calNav(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="cal-month-lbl" id="cal-month-lbl"></span>
      <button class="cal-nav-btn" onclick="calNav(1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="cal-dow" id="cal-dow"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>



<!-- DETAIL SHEET -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-title"></div>
      <button class="sheet-close" onclick="closeSheet()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-footer" id="sheet-footer"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── Veri katmanı (turne.html ile aynı kaynak) ──
let turneler = [];
let tumPersonel = [];
let _turneYukleniyor = true;

// ── Mobil değişkenler ──
var TR_MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var TR_DAYS   = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
var _mobStatuFiltre = '';
var _calYear = new Date().getFullYear();
var _calMonth = new Date().getMonth();

const API            = 'https://turne-backend.vercel.app/api/sheets';
const TURNE_SHEET    = 'TURNE_KAYITLARI';
const PERSONEL_SHEET = 'TURNE_PERSONEL';
const DIS_PERSONEL_SHEET = 'DIS_KATILIMCILAR';
let tumDisPersonel = []; // {kisi, kategori, gorev, _sheetRow}
const NOTLAR_SHEET   = 'TAKVIM_NOTLARI';
const SK             = 'tiyatro_sifre';
const VARSAYILAN_SIFRE = '525327';
const GORUNTULEYICI_SIFRE = '2626';

// ============================================================
// APPS SCRIPT FETCH YARDIMCISI
// Apps Script CORS için her şeyi GET ile gönderiyoruz
// body JSON verisi URL parametresi olarak encode edilir
// ============================================================
async function apiFetch(path, options) {
  options = options || {};
  var method = (options.method || 'GET').toUpperCase();
  var url = API + path;
  var fetchOpts = { method: method };
  if (options.body && method !== 'GET') {
    fetchOpts.headers = options.headers || { 'Content-Type': 'application/json' };
    fetchOpts.body = options.body;
  }
  var res = await fetch(url, fetchOpts);
  return res;
}
const DAHIL_KATEGORILER = ['Sanatçı','Oyuncu','Koro','Koro/Dans','Müzisyen','Orkestra','Solist','Figüran','Figüran/Müzisyen','Dansçı','Koro/Dans Ekibi','Kurumdan Emekli Sanatçı','Turne Başkanı','Sahne Amiri','Kondüvit','Ses – Kondüvit','Ses','Mutemet','Sahne Işıkçısı','Işık Kontrol','Işık – Tasarım','Sahne Makinisti','Aksesuar Memuru','Aksesuar Sorumlusu','Dekor/Aksesuar','Sahne Dekor (Sorumlu)','Sahne Terzisi','Sahne Terzisi/Kostüm','Kostüm','Perukacı','Peruk – Makyaj','Peruk Sorumlusu','Sahne Uzmanı','Dekorcu','Dekor Sorumlusu','Kostümcü','Kostüm Sorumlusu','Makyajcı','Ses Teknisyeni','Işık Teknisyeni','Sahne Görevlisi','Teknik Direktör','Sahne Yöneticisi','Reji Yardımcısı (Sahne)','Video / Görüntü'];


// ── SVG İKON KÜTÜPHANESİ ─────────────────────────────────────────────────
const ICONS = {
  // Statü

function _trNormGlobal(s) {
  return (s||'').toLowerCase()
    .replace(/İ/g,'i').replace(/I/g,'ı')
    .replace(/Ğ/g,'ğ').replace(/Ü/g,'ü')
    .replace(/Ş/g,'ş').replace(/Ö/g,'ö')
    .replace(/Ç/g,'ç');
}

}

}
async function calNotYukle() {
  // Önce localStorage cache'den yükle (anlık görünüm için)
  try { calNotes = JSON.parse(localStorage.getItem('calNotes_cache') || '{}'); } catch(e) { calNotes = {}; }
  try { window.calColors = JSON.parse(localStorage.getItem('calColors_idt') || '{}'); } catch(e) { window.calColors = {}; }
  // Sheets'ten güncel notları çek
  try {
    var res = await apiFetch('/' + encodeURIComponent(NOTLAR_SHEET));
    if (res.ok) {
      var data = await res.json();
      var rows = data.rows || [];
      var h = (data.headers || []).map(function(x){ return (x||'').toLowerCase().trim(); });
      var iTarih = h.findIndex(function(x){ return x.startsWith('tarih'); });
      var iNot   = h.findIndex(function(x){ return x.startsWith('not'); });
      var iAd    = h.findIndex(function(x){ return x.startsWith('ad') || x.startsWith('kullanici'); });
      var rowNumbers = data.rowNumbers || [];
      var sheetsNotes = {};
      rows.forEach(function(r, i) {
        var tarih = (r[iTarih >= 0 ? iTarih : 0] || '').trim();
        var not   = (r[iNot   >= 0 ? iNot   : 1] || '').trim();
        var ad    = (r[iAd    >= 0 ? iAd    : 2] || '').trim();
        if (tarih && not && !_calNotesPendingDelete[tarih]) {
          sheetsNotes[tarih] = { not: not, ad: ad, _sheetRow: rowNumbers[i] || (i + 2) };
        }
      });
      // Local'de bekleyen değişikliklerle merge et
      // Silme bekleyenler hariç: local'de var ama sheets'te yok olanları koru
      Object.keys(calNotes).forEach(function(k) {
        if (!sheetsNotes[k] && !_calNotesPendingDelete[k]) {
          sheetsNotes[k] = calNotes[k]; // silme beklenmiyor, local'dekini koru
        }
        // _calNotesPendingDelete[k] varsa: sheets'te henüz silinmemiş, YAZMA
      });
      calNotes = sheetsNotes;
      // Silinmesi beklenen key'leri cache'den de temizle
      Object.keys(_calNotesPendingDelete).forEach(function(k) {
        delete calNotes[k];
      });
      localStorage.setItem('calNotes_cache', JSON.stringify(calNotes));
    }
  } catch(e) { console.warn('Notlar çekilemedi, cache kullanılıyor:', e); }
}
var _calNotesPendingDelete = {}; // silme devam eden key'ler

function calNotKaydet(key, notMetni, ad) {
  // 1. ANINDA local'e yaz — UI beklemez
  var mevcutNot = calNotes[key];
  if (notMetni) {
    calNotes[key] = { not: notMetni, ad: ad, _sheetRow: (mevcutNot && mevcutNot._sheetRow) || null };
    delete _calNotesPendingDelete[key]; // artık silme değil, ekleme
  } else {
    delete calNotes[key];
    _calNotesPendingDelete[key] = true; // bu key silinecek, Sheets'ten gelirse yok say
  }
  localStorage.setItem('calNotes_cache', JSON.stringify(calNotes));

  // 2. ARKA PLANDA Sheets'e gönder (beklemeden)
  (async function() {
    try {
      if (notMetni) {
        if (mevcutNot && mevcutNot._sheetRow) {
          await apiFetch('/' + encodeURIComponent(NOTLAR_SHEET) + '/cell', {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ row: mevcutNot._sheetRow, col: 2, value: notMetni })
          });
        } else {
          var r = await apiFetch('/' + encodeURIComponent(NOTLAR_SHEET) + '/row', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: [key, notMetni, ad] })
          });
          var rData = await r.json();
          if (calNotes[key]) calNotes[key]._sheetRow = rData.rowNumber || null;

      } else {
        delete _calNotesPendingDelete[key];

function statuRenk(val) {
  return STATU_OPTS.find(x => x.val === val) || { val: val, label: val || 'Taslak', bg:'#e5e7eb', fg:'#374151', border:'#d1d5db', headerBg:'#1f2937', headerFg:'#f3f4f6', headerBorder:'#374151' , calIcon:'◇' };
}
function turneSuresi(t) {
  try {
    if (t.baslangicTarih && t.bitisTarih && t.bitisTarih >= t.baslangicTarih) {
      return Math.max(1, Math.round((parseLocalDate(t.bitisTarih) - parseLocalDate(t.baslangicTarih)) / 86400000) + 1);
    }
    return 1;
  } catch { return 1; }
}
function formatTarih(tarih, kisalt) {
  if (!tarih) return '—';
  try {
    const [y,m,d] = tarih.split('-');
    const aylarTam  = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    const aylarKisa = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
    const ay = kisalt ? aylarKisa[parseInt(m)-1] : aylarTam[parseInt(m)-1];
    return d + ' ' + ay + ' ' + y;
  } catch { return tarih; }
}
// Kart için kısa tarih aralığı: "12–18 Mar" veya "12 Mar" veya "12–18 Mar 2025" (yıl farklıysa)
function formatTarihKart(baslangic, bitis, sure) {
  if (!baslangic) return '—';
  try {
    var aylar = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    var gunler = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    var b = baslangic.split('-');
    var bY=parseInt(b[0]), bM=parseInt(b[1])-1, bD=parseInt(b[2]);
    var bDate = new Date(bY, bM, bD);
    var bGun = gunler[bDate.getDay()];
    if (!bitis || bitis===baslangic || sure<=1) {
      return bD + ' ' + aylar[bM] + ' ' + bY + ' ' + bGun;
    }
    var e = bitis.split('-');
    var eY=parseInt(e[0]), eM=parseInt(e[1])-1, eD=parseInt(e[2]);
    var eDate = new Date(eY, eM, eD);
    var eGun = gunler[eDate.getDay()];
    return bD + ' ' + aylar[bM] + ' ' + bY + ' ' + bGun + ' – ' + eD + ' ' + aylar[eM] + ' ' + eY + ' ' + eGun;
  } catch(ex) { return formatTarih(baslangic); }
}

async function fetchPersonel() {
  try {
    const res  = await apiFetch('/' + encodeURIComponent(PERSONEL_SHEET));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const allRows = data.rows || [];
    // API boş gelirse son başarılı veriyi koru
    if (!allRows.length) { console.warn('Personel verisi boş, mevcut veri korundu.'); return; }
    const h = (data.headers || []).map(x => (x||'').trim().toLowerCase());
    const iOyun = h.findIndex(x => x.startsWith('oyun'));
    const iKat  = h.findIndex(x => x.startsWith('kategori'));
    const iGor  = h.findIndex(x => x.startsWith('görev') || x.startsWith('gorev'));
    const iKisi = h.findIndex(x => x.startsWith('kişi') || x.startsWith('kisi'));
    const rowNumbers = data.rowNumbers || [];
    var yeniPersonel = allRows.flatMap((r, arrayIdx) => {
      var oyun     = (r[iOyun >= 0 ? iOyun : 0] || '').trim();
      var kategori = (r[iKat  >= 0 ? iKat  : 1] || '').trim();
      var gorev    = (r[iGor  >= 0 ? iGor  : 2] || '').trim();
      var kisiRaw  = (r[iKisi >= 0 ? iKisi : 3] || '').trim();
      var sheetRow = rowNumbers[arrayIdx] || (arrayIdx + 2);
      if (!oyun || !kisiRaw) return [];
      var isimler = [];
      var depth = 0, cur = '';
      for (var ci = 0; ci < kisiRaw.length; ci++) {
        var ch = kisiRaw[ci];
        if (ch === '(') { depth++; cur += ch; }
        else if (ch === ')') { depth--; cur += ch; }
        else if (ch === ',' && depth === 0) { if (cur.trim()) isimler.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      if (cur.trim()) isimler.push(cur.trim());
      return isimler.map(function(kisi) {
        var gorevEk = '';
        var m = kisi.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
        if (m) { kisi = m[1].trim(); gorevEk = m[2].trim(); }
        return { oyun, kategori, gorev: gorevEk || gorev, kisi, _sheetRow: sheetRow };
      });
    }).filter(r => r.oyun && r.kisi);

    // Aynı kişi aynı oyunda farklı görevlerle çift satırda varsa görevleri birleştir
    var birlesikMap = {};
    yeniPersonel.forEach(function(p) {
      var anahtar = (p.oyun + '||' + p.kisi.trim().toLowerCase());
      if (!birlesikMap[anahtar]) {
        birlesikMap[anahtar] = Object.assign({}, p, { _gorevler: [p.gorev].filter(Boolean) });
      } else {
        // Farklı görev varsa ekle, tekrar etmesin
        if (p.gorev && !birlesikMap[anahtar]._gorevler.includes(p.gorev)) {
          birlesikMap[anahtar]._gorevler.push(p.gorev);
        }
        // Kategori: Sanatçı öncelikli
        if (p.kategori === 'Sanatçı' || p.kategori === 'Oyuncu') {
          birlesikMap[anahtar].kategori = 'Sanatçı';
        }
      }
    });
    tumPersonel = Object.values(birlesikMap).map(function(p) {
      return Object.assign({}, p, { gorev: p._gorevler.join(' / ') });
    });
  } catch(e) {
    console.warn('Personel çekilemedi, mevcut veri korundu:', e);
    // Hata durumunda mevcut tumPersonel korunur, STATIK_PERSONEL'e düşmez
  }
}

var _CACHE_TTL = 2 * 60 * 1000; // 2 dakika
function _cacheYaz(key, data) {
  try { sessionStorage.setItem(key, JSON.stringify({ ts: Date.now(), data: data })); } catch(e) {}
}
function _cacheOku(key) {
  try {
    var raw = sessionStorage.getItem(key);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    if (Date.now() - parsed.ts > _CACHE_TTL) { sessionStorage.removeItem(key); return null; }
    return parsed.data;
  } catch(e) { return null; }
}
function _cacheSil(key) { try { sessionStorage.removeItem(key); } catch(e) {} }

    const iDurak = h.findIndex(x => x.startsWith('durak') && x.includes('json') || x === 'duraklar');
    // safeRows: her satıra allRows içindeki gerçek indeksi (rowIdx) ekle
    // ÖNEMLİ: map önce yapılır, filter SONRA — böylece realIdx her zaman allRows'daki gerçek index'i gösterir
    // Boş satırlar atlanır ama realIdx kayması olmaz (Sheets'teki sütun konumu korunur)
    const _turneRowNumbers = data.rowNumbers || [];
    const safeRows = allRows
      .map((r, realIdx) => ({
        r, realIdx,

        sheetRowIdx: _turneRowNumbers[realIdx] != null ? (_turneRowNumbers[realIdx] - 2) : realIdx

      return {

  return fetch(url, opts);

function switchTab(tab) {
  _aktifTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'takvim') renderCalendar();
}

// ── STATU FILTER ──
function setStatuFiltre(val, btn) {
  _mobStatuFiltre = val;
  document.querySelectorAll('#statu-chips .fchip').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderListe();
}

// ── RENDER LİSTE ──
function renderListe() {
  var el = document.getElementById('turne-list');
  if (!el) return;

  if (_turneYukleniyor) {
    el.innerHTML = '<div class="empty"><div class="spinner"></div><div class="empty-title">Turneler yükleniyor...</div></div>';
    return;
  }

  var q = (document.getElementById('search-inp').value || '').toLowerCase().trim();
  var list = turneler.filter(function(t) {
    if (_mobStatuFiltre && t.statu !== _mobStatuFiltre) return false;
    if (q && !t.oyun.toLowerCase().includes(q) && !t.il.toLowerCase().includes(q)) return false;
    return true;
  });

  list.sort(function(a, b) {
    return new Date(b.baslangicTarih || 0) - new Date(a.baslangicTarih || 0);
  });

  if (!list.length) {
    el.innerHTML = turneler.length === 0
      ? '<div class="empty"><div class="empty-icon">🎭</div><div class="empty-title">Henüz turne eklenmemiş</div><div class="empty-desc">Sağ alttaki + butonuna tıklayarak<br>ilk turneyi ekleyebilirsiniz.</div></div>'
      : '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Turne bulunamadı</div><div class="empty-desc">Filtreyi veya aramayı değiştirin.</div></div>';
    return;
  }

  el.innerHTML = list.map(function(t) {
    var sk = (t.statu || 'taslak').replace(/\s/g, '-');
    var statuLabels = { 'taslak':'Taslak','onay-bekliyor':'Onay Bekliyor','onaylandi':'Onaylandı','tamamlandi':'Tamamlandı','iptal':'İptal' };
    var statuLabel = statuLabels[sk] || t.statu;
    var tarihStr = formatTarih(t.baslangicTarih, t.bitisTarih);
    return '<div class="tcard" onclick="openDetail(' + t._rowIdx + ')">'
      + '<div class="tcard-accent"></div>'
      + '<div class="tcard-body">'
      + '<div class="tcard-top">'
      + '<div class="tcard-oyun">' + esc(t.oyun || '—') + '</div>'
      + '<span class="tcard-statu s-' + sk + '">' + statuLabel + '</span>'
      + '</div>'
      + '<div class="tcard-meta">'
      + (t.il ? '<div class="tcard-meta-item"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(t.il) + '</div>' : '')
      + (tarihStr ? '<div class="tcard-meta-item"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' + tarihStr + '</div>' : '')
      + (t.sayi > 1 ? '<div class="tcard-meta-item"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>' + t.sayi + ' temsil</div>' : '')
      + (t.katilimcilar && t.katilimcilar.length ? '<div class="tcard-meta-item"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' + t.katilimcilar.length + ' kişi</div>' : '')
      + '</div>'
      + '<div class="tcard-actions">'
      + ''
      + '<button class="tcard-act-btn primary" onclick="event.stopPropagation();openDetail(' + t._rowIdx + ')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>Detay</button>'
      + '</div>'
      + '</div></div>';
  }).join('');
}

// ── YARDIMCI: Sürücü alanını parse et ──
function parseSurucu(raw) {
  if (!raw) return { surucu: '', firma: '', tel: '' };
  var parts = raw.split('|');
  var surucu = parts[0].trim();
  var firma = '', tel = '';
  parts.slice(1).forEach(function(p) {
    if (p.startsWith('FIRMA:')) firma = p.slice(6).trim();
    else if (p.startsWith('TEL:')) tel = p.slice(4).trim();
  });
  return { surucu: surucu, firma: firma, tel: tel };
}

// ── DETAIL SHEET ──
function openDetail(rowIdx) {
  var t = turneler.find(function(x) { return x._rowIdx === rowIdx; });
  if (!t) return;
  var sk = (t.statu || 'taslak').replace(/\s/g, '-');
  var statuLabels = { 'taslak':'Taslak','onay-bekliyor':'Onay Bekliyor','onaylandi':'Onaylandı','tamamlandi':'Tamamlandı','iptal':'İptal' };

  document.getElementById('sheet-title').textContent = t.oyun || '—';

  var body = '';
  body += '<div class="sheet-section">'
    + '<div class="sheet-section-title">Durum</div>'
    + '<span class="tcard-statu s-' + sk + '" style="align-self:flex-start;font-size:12px;padding:4px 10px">' + (statuLabels[sk] || t.statu) + '</span>'
    + '</div>';

  if (t.il || t.mekan) {
    body += '<div class="sheet-section"><div class="sheet-section-title">Yer</div>';
    if (t.il) body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(t.il) + '</div>';
    if (t.mekan) body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>' + esc(t.mekan) + '</div>';
    body += '</div>';
  }

  if (t.baslangicTarih) {
    body += '<div class="sheet-section"><div class="sheet-section-title">Tarih</div>';
    body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' + formatTarih(t.baslangicTarih, t.bitisTarih) + '</div>';
    if (t.sayi > 1) body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>' + t.sayi + ' temsil</div>';
    body += '</div>';
  }

  var hasUlasim = t.gidisUlasim || t.donusUlasim || t.gidisPlaka || t.donusPlaka || t.sehirAracTur || t.aktarma;
  if (hasUlasim) {
    body += '<div class="sheet-section"><div class="sheet-section-title">Ulaşım</div>';
    // Gidiş
    if (t.gidisUlasim) {
      var gStr = 'Gidiş: ' + esc(t.gidisUlasim);
      if (t.gidisSaat) gStr += ' · ' + esc(t.gidisSaat);
      if (t.gidisInis) gStr += ' → ' + esc(t.gidisInis);
      if (t.gidisUcusNo) gStr += ' (' + esc(t.gidisUcusNo) + ')';
      body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' + gStr + '</div>';
    }
    if (t.gidisPlaka) {
      var gS = parseSurucu(t.gidisSurucu);
      var gAracStr = 'Gidiş araç: ' + esc(t.gidisPlaka);
      if (gS.surucu) gAracStr += ' · ' + esc(gS.surucu);
      if (gS.firma) gAracStr += ' · ' + esc(gS.firma);
      if (gS.tel) gAracStr += ' · <a href="tel:' + esc(gS.tel) + '" style="color:var(--primary)">' + esc(gS.tel) + '</a>';
      if (t.gidisKisiSayisi) gAracStr += ' · ' + esc(t.gidisKisiSayisi) + ' kişi';
      body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' + gAracStr + '</div>';
    }
    // Dönüş
    if (t.donusUlasim) {
      var dStr = 'Dönüş: ' + esc(t.donusUlasim);
      if (t.donusSaat) dStr += ' · ' + esc(t.donusSaat);
      if (t.donusInis) dStr += ' → ' + esc(t.donusInis);
      if (t.donusUcusNo) dStr += ' (' + esc(t.donusUcusNo) + ')';
      body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>' + dStr + '</div>';
    }
    if (t.donusPlaka) {
      var dS = parseSurucu(t.donusSurucu);
      var dAracStr = 'Dönüş araç: ' + esc(t.donusPlaka);
      if (dS.surucu) dAracStr += ' · ' + esc(dS.surucu);
      if (dS.firma) dAracStr += ' · ' + esc(dS.firma);
      if (dS.tel) dAracStr += ' · <a href="tel:' + esc(dS.tel) + '" style="color:var(--primary)">' + esc(dS.tel) + '</a>';
      if (t.donusKisiSayisi) dAracStr += ' · ' + esc(t.donusKisiSayisi) + ' kişi';
      body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' + dAracStr + '</div>';
    }
    // Şehir içi
    if (t.sehirAracTur) {
      var sStr = 'Şehir içi: ' + esc(t.sehirAracTur);
      if (t.sehirAracDetay) sStr += ' · ' + esc(t.sehirAracDetay);
      if (t.sehirKisiSayisi) sStr += ' · ' + esc(t.sehirKisiSayisi) + ' kişi';
      body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + sStr + '</div>';
    }
    // Aktarma
    if (t.aktarma) body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>Aktarma: ' + esc(t.aktarma) + '</div>';
    body += '</div>';
  }

  if (t.otelAdi || t.otelAdres || t.otelTelefon) {
    body += '<div class="sheet-section"><div class="sheet-section-title">Konaklama</div>';
    if (t.otelAdi) body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' + esc(t.otelAdi) + '</div>';
    if (t.otelAdres) body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(t.otelAdres) + '</div>';
    if (t.otelTelefon) body += '<div class="sheet-row"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.56 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg><a href="tel:' + esc(t.otelTelefon) + '" style="color:var(--primary)">' + esc(t.otelTelefon) + '</a></div>';
    body += '</div>';
  }

  if (t.katilimcilar && t.katilimcilar.length) {
    // Kategoriye göre grupla
    var katGruplari = {};
    t.katilimcilar.forEach(function(k) {
      var kat = k.kategori || k.gorev || 'Diğer';
      if (!katGruplari[kat]) katGruplari[kat] = [];
      katGruplari[kat].push(k);
    });
    body += '<div class="sheet-section"><div class="sheet-section-title">Katılımcılar (' + t.katilimcilar.length + ')</div>';
    Object.keys(katGruplari).forEach(function(kat) {
      var kisiler = katGruplari[kat];
      body += '<div style="margin-bottom:10px">'
        + '<div style="font-size:10px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">' + esc(kat) + ' (' + kisiler.length + ')</div>'
        + kisiler.map(function(k) {
            var isim = k.kisi || k.ad || '';
            var gorev = k.gorev || '';
            return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--muted)">'
              + '<span style="font-size:12px;font-weight:600">' + esc(isim) + '</span>'
              + (gorev ? '<span style="font-size:10px;color:var(--muted-fg);text-align:right;max-width:120px">' + esc(gorev) + '</span>' : '')
              + '</div>';
          }).join('')
        + '</div>';
    });
    body += '</div>';
  }

  if (t.not) {
    body += '<div class="sheet-section"><div class="sheet-section-title">Not</div>'
      + '<div style="font-size:13px;line-height:1.6;color:var(--muted-fg)">' + esc(t.not) + '</div>'
      + '</div>';
  }

  document.getElementById('sheet-body').innerHTML = body;
  document.getElementById('sheet-footer').innerHTML =
    '<button class="sheet-btn primary" onclick="closeSheet()" style="flex:1">Kapat</button>';

  document.getElementById('sheet-overlay').classList.add('open');
}

function closeSheet(e) {
  if (e && e.target !== document.getElementById('sheet-overlay')) return;
  document.getElementById('sheet-overlay').classList.remove('open');
}

// ── TAKVİM ──
function renderCalDow() {
  document.getElementById('cal-dow').innerHTML = TR_DAYS.map(function(d) {
    return '<div class="cal-dow-cell">' + d + '</div>';
  }).join('');
}

function calNav(dir) {
  _calMonth += dir;
  if (_calMonth < 0) { _calMonth = 11; _calYear--; }
  if (_calMonth > 11) { _calMonth = 0; _calYear++; }
  renderCalendar();
}

function renderCalendar() {
  var lbl = document.getElementById('cal-month-lbl');
  if (lbl) lbl.textContent = TR_MONTHS[_calMonth] + ' ' + _calYear;
  var grid = document.getElementById('cal-grid');
  if (!grid) return;

  var today = new Date();
  var firstDay = new Date(_calYear, _calMonth, 1);
  var lastDay = new Date(_calYear, _calMonth + 1, 0);
  // Monday-first: 0=Mon..6=Sun
  var startDow = (firstDay.getDay() + 6) % 7;

  // Build event map
  var eventMap = {};
  turneler.forEach(function(t) {
    if (!t.baslangicTarih) return;
    var bas = new Date(t.baslangicTarih);
    var bit = t.bitisTarih ? new Date(t.bitisTarih) : bas;
    var cur = new Date(bas);
    while (cur <= bit) {
      var key = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
      if (!eventMap[key]) eventMap[key] = [];
      eventMap[key].push(t);
      cur.setDate(cur.getDate() + 1);
    }
  });

  var cells = '';
  // Empty cells before first day
  for (var i = 0; i < startDow; i++) {
    cells += '<div class="cal-day other-month"></div>';
  }
  for (var d = 1; d <= lastDay.getDate(); d++) {
    var key = _calYear + '-' + String(_calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var isToday = today.getFullYear()===_calYear && today.getMonth()===_calMonth && today.getDate()===d;
    var events = eventMap[key] || [];
    cells += '<div class="cal-day' + (isToday?' today':'') + '" onclick="calDayClick(\'' + key + '\')">'
      + '<div class="cal-day-num">' + d + '</div>'
      + (events.length ? '<div class="cal-events-row">' + events.slice(0,3).map(function() { return '<div class="cal-event-dot"></div>'; }).join('') + '</div>' : '')
      + '</div>';
  }
  grid.innerHTML = cells;
}

function calDayClick(key) {
  var events = turneler.filter(function(t) {
    if (!t.baslangicTarih) return false;
    var bas = t.baslangicTarih;
    var bit = t.bitisTarih || bas;
    return key >= bas && key <= bit;
  });
  if (!events.length) return;
  if (events.length === 1) { openDetail(events[0]._rowIdx); return; }
  // Multiple events: show sheet with list
  document.getElementById('sheet-title').textContent = formatDateKey(key);
  document.getElementById('sheet-body').innerHTML = events.map(function(t) {
    var sk = (t.statu||'taslak').replace(/\s/g,'-');
    return '<div class="tcard" onclick="closeSheet();openDetail(' + t._rowIdx + ')" style="margin-bottom:0">'
      + '<div class="tcard-body" style="padding:10px 12px">'
      + '<div style="font-size:13px;font-weight:700">' + esc(t.oyun) + '</div>'
      + (t.il ? '<div style="font-size:11px;color:var(--muted-fg);margin-top:3px">' + esc(t.il) + '</div>' : '')
      + '</div></div>';
  }).join('');
  document.getElementById('sheet-footer').innerHTML = '';
  document.getElementById('sheet-overlay').classList.add('open');
}

// ── HELPERS ──
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTarih(bas, bit) {
  if (!bas) return '';
  var b = fmtDate(bas);
  if (!bit || bit === bas) return b;
  return b + ' – ' + fmtDate(bit);
}

function fmtDate(d) {
  if (!d) return '';
  var parts = d.split('-');
  if (parts.length < 3) return d;
  return parts[2] + ' ' + TR_MONTHS[parseInt(parts[1])-1] + ' ' + parts[0];
}

function formatDateKey(key) {
  var parts = key.split('-');
  return parts[2] + ' ' + TR_MONTHS[parseInt(parts[1])-1] + ' ' + parts[0];
}

// ── TOAST ──
var _toastTimer;
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { el.className = 'toast'; }, 2800);
}
</script>
